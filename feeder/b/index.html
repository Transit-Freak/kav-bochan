<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>הקו המזין · ציר זמן</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
<style>
  :root{--ink:#14213D;--mut:#5C677D;--line:#E6E9EF;--rail:#14213D;--acc:#0B7A75;
    --c0:#D7263D;--c1:#F4B400;--c2:#00A65A;--c3:#1E5BC6;--c4:#C9CED6}
  *{box-sizing:border-box}
  html,body{margin:0;background:#FBFAF7;color:var(--ink);font:15px/1.45 'Assistant',sans-serif;overflow-x:hidden}
  .wrap{max-width:1400px;margin:0 auto;padding:18px 16px 40px}
  h1{font-size:30px;font-weight:800;margin:0;letter-spacing:-.01em}
  h1 small{font-size:15px;font-weight:600;color:var(--acc);margin-inline-start:10px}
  .lead{color:var(--mut);margin:4px 0 16px}
  .ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  select{font:600 14px 'Assistant';border:2px solid var(--ink);border-radius:10px;padding:6px 10px;background:#fff;color:var(--ink)}
  .tg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
  .tg button{border:0;background:#fff;font:700 14px 'Assistant';padding:6px 12px;cursor:pointer;color:var(--ink)}
  .tg button.on{background:var(--ink);color:#fff}
  .leg{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px;font-weight:700;margin:0 0 12px}
  .leg i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}
  .dir{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:16px;padding:12px 0 6px;box-shadow:0 2px 0 #14213D10}
  .dir h2{font-size:19px;margin:0 16px 2px;font-weight:800}
  .dir .s{color:var(--mut);font-size:13.5px;margin:0 16px 6px}
  .row{display:flex}
  .lab{flex:0 0 170px;border-inline-end:1px solid var(--line);background:#fff}
  .lab div{display:flex;gap:8px;align-items:center;padding:0 12px;white-space:nowrap;overflow:hidden}
  .lab b{font-size:14px;font-weight:800;min-width:34px}
  .lab span{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
  .lab i{width:8px;height:8px;border-radius:50%;background:var(--c2);flex:0 0 8px}
  .sc{overflow-x:auto;flex:1}
  svg text{font-family:'Assistant',sans-serif}
  .sum{display:flex;gap:10px;flex-wrap:wrap;margin:0 16px 6px;direction:rtl}
  .sum span{font-size:13px;font-weight:700;border-radius:999px;padding:1px 10px;color:#fff}
  .msg{padding:40px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <h1>הקו המזין <small>ציר זמן של חיבורים</small></h1>
  <p class="lead" id="lead">כל אוטובוס מחובר ברכבת שלו. קו קצר וירוק — חיבור טוב; אדום — האוטובוס מגיע רגע לפני שהרכבת יוצאת.</p>
  <div class="ctl">
    <select id="st" aria-label="תחנת רכבת"></select>
    <div class="tg" id="mode"><button data-m="to" class="on">🚌 → 🚆</button><button data-m="from">🚆 → 🚌</button></div>
    <select id="lines"><option value="2">קווים מזינים</option><option value="1" selected>מזינים + מסוף</option><option value="0">כל הקווים</option></select>
    <select id="day"></select>
  </div>
  <div class="leg" id="leg"></div>
  <div id="out"><div class="msg">טוען…</div></div>
</div>
<script src="../core.js"></script>
<script>
(function () {
  const K = FeederCore, $ = (id) => document.getElementById(id);
  const S = { mode: "to", walk: 400, lines: 1, th: K.DEF_TH.slice(), st: "" };
  const X0 = 5 * 60, X1 = 24 * 60, PX = 1.6, PAD = 24, W = (X1 - X0) * PX + 2 * PAD;   // דקה = 1.6 פיקסל
  const x = (m) => W - PAD - (m - X0) * PX;   // הזמן רץ מימין לשמאל, כמו הקריאה
  $("leg").innerHTML = K.CATS.map((c, i) => '<span><i style="background:' + c.c + '"></i>' + c.label + (i < 4 ? " " + [0].concat(S.th)[i] + "–" + (S.th[i] - 1) : " " + S.th[3] + "+") + "</span>").join("");
  function draw() {
    const c = S.st, lines = K.busTrips(c, S), dirs = K.directions(c, S.mode);
    if (!lines.length) { $("out").innerHTML = '<div class="msg">אין קווים בתחנה הזו בסינון הזה.</div>'; return; }
    let h = "";
    for (const d of dirs) {
      const ls = K.evalDir(lines, d, S).filter((l) => l.n);
      const rowH = 26, top = 34, railY = top + ls.length * rowH + 22, H = railY + 46;
      let lab = '<div style="height:' + (top + 8 - rowH / 2) + 'px"></div>';
      let g = "";
      for (let t = X0; t <= X1; t += 60) g += '<line x1="' + x(t) + '" x2="' + x(t) + '" y1="' + (top - 8) + '" y2="' + railY + '" stroke="#EEF0F4"/><text x="' + x(t) + '" y="' + (top - 14) + '" font-size="12" fill="#5C677D" text-anchor="middle">' + String(t / 60 % 24).padStart(2, "0") + ":00</text>";
      // מסילה + רכבות
      g += '<line x1="' + (PAD / 2) + '" x2="' + (W - PAD / 2) + '" y1="' + railY + '" y2="' + railY + '" stroke="#14213D" stroke-width="5" stroke-linecap="round"/>';
      for (const tr of d.trains) if (tr.t >= X0 && tr.t <= X1) g += '<rect x="' + (x(tr.t) - 3) + '" y="' + (railY - 9) + '" width="6" height="18" rx="2" fill="#14213D"><title>' + K.fmt(tr.t) + " · " + K.esc(S.mode === "to" ? "ל" + tr.dest : "מ" + tr.orig) + (Math.round(tr.delay) ? " · " + (tr.delay > 0 ? "+" : "") + Math.round(tr.delay) : "") + "</title></rect>";
      const sum = [0, 0, 0, 0, 0];
      ls.forEach((l, i) => {
        const y = top + i * rowH + 8;
        l.cnt.forEach((v, k) => sum[k] += v);
        lab += '<div style="height:' + rowH + 'px" title="' + K.esc(l.op + " · " + l.from + " ← " + l.to) + '"><b>' + K.esc(l.num) + "</b>" + (l.feed === 2 ? '<i title="קו מזין"></i>' : "") + "<span>" + K.esc(S.mode === "to" ? l.from : l.to) + "</span></div>";
        g += '<line x1="' + (PAD / 2) + '" x2="' + (W - PAD / 2) + '" y1="' + y + '" y2="' + y + '" stroke="#F3F4F7"/>';
        for (const r of l.rows) {
          if (r.act < X0 || r.act > X1) continue;
          const col = K.CATS[r.c].c, bx = x(r.act);
          if (r.tr && r.c < 4) {
            const tx = x(r.tr.t);
            g += '<path d="M' + bx + " " + y + " C " + bx + " " + (railY - 30) + ", " + tx + " " + (railY - 40) + ", " + tx + " " + (railY - 9) + '" fill="none" stroke="' + col + '" stroke-width="1.6" opacity=".75"/>';
          }
          g += '<circle cx="' + bx + '" cy="' + y + '" r="5.5" fill="' + col + '" stroke="#fff" stroke-width="1.5"><title>קו ' + K.esc(l.num) + " · " + (S.mode === "to" ? "הגיע " : "יצא ") + K.fmt(r.act) + (r.tr ? " · רכבת " + K.fmt(r.tr.t) : "") + " · " + (isFinite(r.gap) ? Math.round(r.gap) + " דק' · " : "") + K.CATS[r.c].label + "</title></circle>";
          if (isFinite(r.gap) && r.c < 4) g += '<text x="' + (bx - 7) + '" y="' + (y - 6) + '" font-size="10.5" font-weight="700" text-anchor="end" fill="' + col + '">' + Math.round(r.gap) + "</text>";
        }
      });
      lab += '<div style="height:' + (railY - (top + 8 - rowH / 2) - ls.length * rowH - 15) + 'px"></div><div style="height:30px"><b>🚆</b><span>רכבות</span></div>';
      const n = sum[0] + sum[1] + sum[2] + sum[3];
      h += '<div class="dir"><h2>' + K.esc(d.label) + '</h2><div class="s">' + K.esc(d.sub) + " · " + d.n + (S.mode === "to" ? " יציאות" : " הגעות") + " ביום · " + ls.length + ' קווים</div><div class="sum">' +
        [2, 1, 0, 3].map((k) => '<span style="background:' + K.CATS[k].c + '">' + K.CATS[k].label + " " + (n ? Math.round(100 * sum[k] / n) : 0) + "%</span>").join("") +
        '</div><div class="row"><div class="lab">' + lab + '</div><div class="sc"><svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '">' + g + "</svg></div></div></div>";
    }
    $("out").innerHTML = h;
  }
  function stations() {
    const ss = K.stations().map((c) => [c, K.C.STN[c][0], K.busTrips(c, Object.assign({}, S, { lines: 2 })).length]).sort((a, b) => a[1].localeCompare(b[1], "he"));
    if (!S.st) S.st = (ss.slice().sort((a, b) => b[2] - a[2])[0] || [])[0];
    $("st").innerHTML = ss.map((s) => '<option value="' + s[0] + '"' + (s[0] === S.st ? " selected" : "") + ">" + K.esc(s[1]) + (s[2] ? " · " + s[2] + " מזינים" : "") + "</option>").join("");
  }
  $("st").onchange = (e) => { S.st = e.target.value; draw(); };
  $("lines").onchange = (e) => { S.lines = +e.target.value; draw(); };
  $("mode").querySelectorAll("button").forEach((b) => b.onclick = () => { S.mode = b.dataset.m; $("mode").querySelectorAll("button").forEach((q) => q.classList.toggle("on", q === b)); $("lead").textContent = S.mode === "to" ? "כל אוטובוס מחובר לרכבת הבאה בכיוון. קו ירוק — חיבור טוב; אדום — האוטובוס מגיע רגע לפני שהרכבת יוצאת." : "כל רכבת מחוברת לאוטובוסים שיצאו אחריה. אדום — האוטובוס יוצא לפני שהנוסעים מספיקים להגיע אליו."; draw(); });
  $("day").onchange = (e) => K.load(e.target.value).then(draw);
  (async () => { const ds = await K.days(); $("day").innerHTML = ds.map((d) => '<option value="' + d + '">' + K.fmtD(d) + "</option>").join(""); await K.load(ds[0]); stations(); draw(); })().catch((e) => $("out").innerHTML = '<div class="msg">' + K.esc(e.message) + "</div>");
})();
</script>
</body>
</html>
