<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../../nav-restore.js"></script><script src="../../home-link.js" data-home="/"></script>
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="%231E5BC6" stroke="%23101418" stroke-width="3"/><rect x="14" y="38" width="8" height="12" rx="2" fill="%23fff"/><rect x="26" y="30" width="8" height="20" rx="2" fill="%23fff"/><rect x="38" y="21" width="8" height="29" rx="2" fill="%23fff"/><rect x="50" y="12" width="8" height="38" rx="2" fill="%23fff"/></svg>'>
<meta property="og:title" content="קליטה ברכבת — הקו הבוחן">
<meta property="og:description" content="איפה יש קליטה סלולרית ברכבת: אנטנות, מנהרות ומהירות הנסיעה לכל 100 מטר מסילה, לכל מפעיל">
<title>קליטה ברכבת — הקו הבוחן</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Secular+One&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root{--bg:#fff;--ink:#101418;--mut:#4B5563;--dim:#8A94A3;--line:#E5E7EB;--accent:#1E5BC6;
    --g3:#00A65A;--g2:#F4B400;--g1:#F26B1D;--g0:#D7263D;--disp:'Secular One','Heebo',sans-serif;--body:'Heebo',sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 16px 40px}
  .top{display:flex;align-items:center;gap:12px;padding-bottom:10px}
  .glyph{width:46px;height:46px;border-radius:50%;background:var(--accent);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  h1{font-family:var(--disp);font-weight:400;font-size:32px;margin:0}
  .band{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--g3) 0 25%,var(--g2) 25% 50%,var(--g1) 50% 75%,var(--g0) 75%);margin-bottom:14px}
  .sub{color:var(--mut);margin:0 0 14px;font-size:14px;line-height:1.5}
  .ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
  .seg button{border:0;background:#fff;color:var(--ink);font:700 14px var(--body);padding:8px 16px;cursor:pointer;border-inline-end:1.5px solid var(--ink)}
  .seg button:last-child{border-inline-end:0}
  .seg button{--b:var(--ink);color:var(--b)}
  .seg button.on{background:var(--b);color:#fff}
  label.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;cursor:pointer}
  select{font:700 14px var(--body);border:1.5px solid var(--ink);border-radius:999px;padding:6px 12px;background:#fff;color:var(--ink)}
  .route{border:1.5px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:12px 14px;margin-bottom:14px;background:#fff}
  .rsel{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .rsel label{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
  .rsel select{max-width:230px}
  .rsel button{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:6px 12px;font:700 13px var(--body);cursor:pointer}
  .rcands{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .rcand{border:1.5px solid var(--ink);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;background:#fff;cursor:pointer;text-align:right}
  .rcand.on{background:var(--ink);color:#fff}
  .rcand small{display:block;font-weight:500;opacity:.8}
  .rres{margin-top:10px}
  .rres table{border-collapse:collapse;width:100%;font-size:13.5px}
  .rres th,.rres td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
  .rres th{font-size:12px;color:var(--mut)}
  .rres .best{font-weight:800}
  .rres .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;min-width:120px}
  .rres .bar i{display:block;height:100%}
  .rres .crown{display:inline-block;background:var(--g3);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;margin-inline-start:6px}
  .rnote{font-size:12.5px;color:var(--mut);margin-top:6px}
  #map{height:min(70vh,640px);border:1.5px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);overflow:hidden;background:#eef2f6}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0;font-size:13px;font-weight:700}
  .legend i{display:inline-block;width:22px;height:6px;border-radius:3px;vertical-align:middle;margin-inline-end:6px}
  .legend i.dot{width:10px;height:10px;border-radius:50%;border:1px solid #fff;box-shadow:0 0 0 1px #0003}
  .legend .sep{width:1px;height:16px;background:var(--line)}
  .panel .dim{color:var(--dim);font-size:12.5px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
  .stats div{border-top:6px solid var(--accent);padding-top:8px}
  .stats b{font-family:var(--disp);font-weight:400;font-size:26px;display:block;line-height:1.1}
  .stats span{font-size:11.5px;font-weight:800;color:var(--mut)}
  .panel{border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:12px;padding:16px 18px;margin-top:18px;background:#fff;font-size:14px;line-height:1.65}
  .panel h2{font-family:var(--disp);font-weight:400;font-size:20px;margin:0 0 8px}
  .panel ul{margin:6px 0;padding-inline-start:20px}
  .msg{padding:30px;text-align:center;color:var(--mut)}
  .leaflet-container{font-family:var(--body)}
  .leaflet-popup-content{direction:rtl;text-align:right;font-size:13px;line-height:1.5;margin:10px 14px}
  .ant{width:8px;height:8px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px #0004}
  @media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="glyph" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 64 64"><rect x="14" y="38" width="8" height="12" rx="2" fill="#fff"/><rect x="26" y="30" width="8" height="20" rx="2" fill="#fff"/><rect x="38" y="21" width="8" height="29" rx="2" fill="#fff"/><rect x="50" y="12" width="8" height="38" rx="2" fill="#fff"/></svg></div>
    <h1>קליטה ברכבת</h1>
  </div>
  <div class="band"></div>
  <p class="sub" id="sub">טוען נתונים…</p>
  <div class="route" id="route">
    <div class="rsel">
      <label>מוצא <select id="rFrom"><option value="">בחר תחנה</option></select></label>
      <label>יעד <select id="rTo"><option value="">בחר תחנה</option></select></label>
      <button type="button" id="rClear" hidden>נקה</button>
    </div>
    <div id="rOut"></div>
  </div>
  <div class="ctl">
    <div class="seg" id="ops"></div>
    <div class="seg" id="gen"><button data-gen="all" class="on">כל הדורות</button><button data-gen="4">דור 4 ומעלה</button><button data-gen="5">דור 5</button></div>
    <label class="chk">סוג רכבת <select id="train"></select></label>
    <label class="chk"><input type="checkbox" id="showAnt" checked> הצג אנטנות</label>
    <label class="chk"><input type="checkbox" id="showSpd"> צבע לפי מהירות</label>
  </div>
  <p class="sub" id="trainNote" style="font-size:12.5px;margin:-6px 0 10px"></p>
  <div class="legend" id="legend"></div>
  <div id="map"><div class="msg">טוען…</div></div>
  <div class="stats" id="stats"></div>
  <div class="panel" id="method"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>document.write('<script src="app.js?v='+Date.now()+'"><\/script>')</script>
<script src="../../birthday.js" defer></script>
<script src="../../hagim.js" defer></script>
<script src="../../a11y.js" defer></script>
</body>
</html>
