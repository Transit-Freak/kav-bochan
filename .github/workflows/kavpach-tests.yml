name: kavpach-tests

# בדיקה קבועה לקו פח, לקו המוזהב ולדף הבית: הדף נטען ב-Chromium עם נתונים קבועים וקטנים (tests/fixtures/kavpach),
# הבדיקה עוברת על הלשוניות, מסננת ומחפשת, ומשווה לתמונה-במילים (tests/kavpach/snapshots.json).
# רץ על PR שנוגע בקוד של הכלי, בדף הבית או בבדיקה — לא על עדכוני הנתונים.
# עדכון התמונה-במילים אחרי שינוי מכוון: tests/kavpach/README.md

on:
  pull_request:
    paths:
      - 'KavPach.jsx'
      - 'KavPach.js'
      - 'kavpach-core.js'
      - 'xlsx-worker.js'
      - 'index.html'
      - 'home/**'
      - 'version.js'
      - 'theme-boot.js'
      - 'nav-restore.js'
      - 'a11y.js'
      - 'vendor/**'
      - 'tools/build_kavpach.mjs'
      - 'tests/kavpach/**'
      - 'tests/fixtures/kavpach/**'
      - '.github/workflows/kavpach-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kavpach-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none   # בלי קבצי הנתונים הכבדים של האתר
          sparse-checkout: |
            /*
            !/*/data/
            !/*/*/data/
            !/kavbug-data/
            !/gis/
            !/unreleased/
            !/s/
            !/magihim-2012/
            !/reports/
            !/sakachot-lab/
            !/lines/
            !/data-*.json
            !/kavpach-*.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright ו-Chromium
        run: |
          npm i --no-save --no-package-lock --prefix "$RUNNER_TEMP/kp" playwright@1.56.1 >/dev/null
          "$RUNNER_TEMP/kp/node_modules/.bin/playwright" install --with-deps chromium

      - name: קו פח, הקו המוזהב ודף הבית בדפדפן מול התמונה-במילים
        run: NODE_PATH="$RUNNER_TEMP/kp/node_modules" node tests/kavpach/app.mjs
