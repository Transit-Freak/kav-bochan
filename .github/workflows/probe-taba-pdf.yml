name: probe-taba-pdf

# ניסיון (שלמה 20.09): קריאת הוראות תוכניות תת"ל של מסילות (PDF ציבורי באתר רמ"י) —
# האם רשומים בהן מנהרות/חתכים/גשרים עם קילומטראז'. מדפיס ליומן בלבד.

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: כלים
        run: sudo apt-get install -y -q poppler-utils >/dev/null
      - name: קריאה
        run: |
          python3 - <<'PY'
          import re, subprocess, tempfile, urllib.request
          DOCS = [
            ('תת"ל 22 ד — השלמות סטטוטוריות למסילה המזרחית', 'https://apps.land.gov.il/IturTabotData/takanonim/haifa/3051434.pdf'),
            ('תת"ל 108 — המשך קו הרכבת לירושלים', 'https://apps.land.gov.il/IturTabotData/takanonim/jerus/1052798.pdf'),
            ('תת"ל 13/1/א — מסילת נהר הירדן', 'https://apps.land.gov.il/IturTabotData/takanonim/tzafon/2053008.pdf'),
            ('תת"ל 79 — מסילה, עוקפי לוד', 'https://apps.land.gov.il/IturTabotData/takanonim/Artzi/9423881.pdf'),
          ]
          RX = re.compile(r'מנהר|חתך|גשר|ק"מ|ק״מ|קמ\'|חתכ|שקוע|פורטל|נספח')
          for name, url in DOCS:
              print('\n' + '=' * 80 + '\n' + name + '\n' + url)
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  b = urllib.request.urlopen(req, timeout=120).read()
                  with tempfile.NamedTemporaryFile(suffix='.pdf', delete=False) as f:
                      f.write(b)
                  info = subprocess.run(['pdfinfo', f.name], capture_output=True, text=True).stdout
                  pages = re.search(r'Pages:\s+(\d+)', info)
                  out = subprocess.run(['pdftotext', '-layout', f.name, '-'], capture_output=True, text=True, timeout=120).stdout
                  print(f'{len(b)} בתים · עמודים: {pages.group(1) if pages else "?"} · טקסט: {len(out)} תווים')
                  lines = [l.strip() for l in out.splitlines() if l.strip()]
                  hits = [l for l in lines if RX.search(l)]
                  print(f'שורות רלוונטיות: {len(hits)} מתוך {len(lines)}')
                  for l in hits[:80]:
                      print('  ', l[:160])
                  # רשימת נספחים
                  print('-- נספחים --')
                  for l in lines:
                      if re.search(r'^\s*נספח|נספח\s+[א-ת\d]', l):
                          print('  ', l[:160])
              except Exception as ex:
                  print('נכשל:', repr(ex)[:200])
          PY
