name: pages-deploy

# פרסום האתר בתור, במקום "pages build and deployment" של GitHub (שלמה 05.10: "שברגע שעולה לשם
# קובץ חדש האתר יתעדכן"). הפרסום הישן התבטל בכל שמירה חדשה למאגר, גם באמצע — ב-05.10 היו
# 33 ביטולים מול 6 פרסומים, והאתר פיגר שעות אחרי הנתונים.
#
# כאן פרסום שהתחיל תמיד מסתיים (cancel-in-progress: false, על שלב deploy). מה שנשמר בינתיים מחכה בתור, ו-GitHub
# משאיר בתור רק את הבקשה האחרונה, כך שהפרסום הבא כבר כולל את כל מה שהצטבר.
#
# מתי מפרסמים:
# - push ל-main: שמירות של אנשים ושל מפתחות אישיים (המיזוגים, האיסוף הביתי).
# - workflow_run: שמירות של הצינורות עצמם. commit שנדחף עם GITHUB_TOKEN לא מפעיל push.
# - כל 10 דקות: רשת ביטחון לכל שאר הצינורות.
# check מדלג על הפרסום אם main לא השתנה מאז הפרסום המוצלח האחרון.
#
# דורש הגדרה חד-פעמית: Settings → Pages → Source = GitHub Actions.

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - historical-passenger-websites
      - historical-2012-2018
      - line-history
      - line-hub
      - kavpach-build
      - bus-reliability
      - rail-reliability
      - rail-trace
      - gis-layers
      - fleet-registry
      - update-weekly
      - alerts   # הקו המודיע — שתי משיכות ביום (שלמה 18.10)
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read
  actions: write   # ביטול ריצה שנתקעה (למטה)

# התור על שלב הפרסום בלבד, לא על כל הריצה: כך check רץ תמיד, גם כשפרסום קודם תקוע, ויכול לשחרר אותו.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.cmp.outputs.go }}
    steps:
      # 13–14.10: ריצה אחת נתקעה כמעט יום ב"ממתינה לאישור" של סביבת github-pages — בלי מאשרים ובלי
      # זמן המתנה, תקלה של GitHub. היא החזיקה את התור, וכל פרסום אחריה חיכה ובוטל: האתר לא התעדכן
      # (שלמה 14.10: "מה קורה?"). פרסום רגיל לוקח כ-10 דקות; ריצה שממתינה מעל 30 דקות מבוטלת.
      - name: שחרור פרסום תקוע
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages-deploy.yml/runs?status=waiting&per_page=20" \
                --jq '.workflow_runs[] | select(now - (.updated_at | fromdateiso8601) > 1800) | .id' 2>/dev/null); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            echo "::warning::פרסום $id ממתין מעל 30 דקות — מבוטל"
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null || true
          done
      - name: main השתנה מאז הפרסום האחרון?
        id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          # מקור הפרסום בהגדרות חייב להיות GitHub Actions. שלמה 05.10 (לא ליד המחשב): "שה-GitHub
          # ידע לבד" — מנסים להחליף אותו מכאן. אם אין הרשאה, מדלגים בלי להיכשל, והפרסום הישן
          # ממשיך לעבוד עד שמחליפים ב-Settings → Pages → Source.
          type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo unknown)
          if [ "$type" = "legacy" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow >/dev/null 2>&1 \
              && echo "מקור הפרסום הוחלף ל-GitHub Actions" || echo "אין הרשאה להחליף את מקור הפרסום מכאן"
            type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo unknown)
          fi
          if [ "$type" != "workflow" ]; then
            echo "מקור הפרסום בהגדרות: $type (לא GitHub Actions) — מדלג"; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          last=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=10" --jq '.[].id'); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state')
            if [ "$state" = "success" ]; then last=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq .sha); break; fi
          done
          echo "main: $head · פורסם לאחרונה: ${last:-אין}"
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$head" = "$last" ]; then
            echo "אין שינוי מאז הפרסום האחרון"; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.go == 'yes'
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # האתר כ-3GB (בלי הארכיון; עם הארכיון כ-7.5GB): מפנים מקום בשרת לפני ההעתקה והאריזה
      - name: מקום בדיסק
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1
      # ההורדה לוקחת בדרך כלל כ-4 דקות, אבל בתקלות של GitHub היא נתקעת עד שנגמר זמן הריצה
      # (07.10: שתי ריצות נתקעו כך, והעיצוב החדש לא פורסם). מגבילים ל-12 דקות ומנסים שוב פעם אחת.
      #
      # הארכיון הכבד של "הקו בזמן" (early-patterns, early-stops: כ-808 אלף קבצים, 4.5GB) מתפרסם
      # מ-kav-bochan-archive, והאתר קורא משם (שלמה 13.10: "למה עדכון כזה קטן חצי שעה?"). לכן
      # מורידים בלי שתי התיקיות, ו-tools/pages_trim_archive.sh מחזיר רק קבצים שאינם בארכיון באותו
      # תוכן. אם אי אפשר לסמוך על הארכיון — מורידים הכל כמו קודם (full=yes).
      - id: co
        uses: actions/checkout@v4
        timeout-minutes: 12
        continue-on-error: true
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/line-history/data/early-patterns/
            !/line-history/data/early-stops/
      - if: steps.co.outcome != 'success'
        uses: actions/checkout@v4
        timeout-minutes: 15
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/line-history/data/early-patterns/
            !/line-history/data/early-stops/
      - id: arch
        name: הארכיון — באתר נשאר רק מה שאינו בארכיון
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/pages_trim_archive.sh
      - if: steps.arch.outputs.full != 'no'
        name: גיבוי — כל הקבצים
        timeout-minutes: 20
        run: |
          git sparse-checkout disable
          test -d line-history/data/early-patterns && echo "הורדו כל הקבצים"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
