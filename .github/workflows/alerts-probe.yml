name: alerts-probe
# זמני (ניסיון 2) — קלט גולמי של הקו המודיע לבדיקה מקומית. יימחק לפני מיזוג.
on:
  push:
    branches: [claude/stoic-allen-3g21ru]
    paths: ['.github/workflows/alerts-probe.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - run: python3 -u tools/_probe/dump.py 2>&1 | grep --line-buffered -v 'ניסיון'
        timeout-minutes: 55
        continue-on-error: true
      - if: always()
        run: |
          du -sh dump; ls dump | wc -l
          git config user.name probe; git config user.email probe@users.noreply.github.com
          mkdir -p tools/_probe/dump && mv dump/* tools/_probe/dump/
          # הנתונים נכנסים מעל הראש העדכני של הענף (גם אם נדחף אליו משהו בזמן הריצה)
          for i in 1 2 3; do
            git fetch -q --depth=1 origin claude/stoic-allen-3g21ru
            GIT_INDEX_FILE=/tmp/idx git read-tree FETCH_HEAD
            GIT_INDEX_FILE=/tmp/idx git add --sparse tools/_probe/dump
            t=$(GIT_INDEX_FILE=/tmp/idx git write-tree)
            c=$(git commit-tree "$t" -p FETCH_HEAD -m "probe dump (זמני, יימחק)")
            git push origin "$c:refs/heads/claude/stoic-allen-3g21ru" && break
            sleep 5
          done
