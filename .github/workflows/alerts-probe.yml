name: alerts-probe
# זמני — אבחון הודעה אחת מקובץ מפת ישראל. יימחק.
on:
  push:
    branches: [claude/stoic-allen-3g21ru]
    paths: ['.github/workflows/alerts-probe.yml']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/osrm/il.osm.pbf
          key: kavbug-osm-none
          restore-keys: kavbug-osm-
      - run: |
          sudo apt-get install -y -qq osmium-tool >/dev/null
          pip install -q osmium
          osmium tags-filter /tmp/osrm/il.osm.pbf w/highway -o /tmp/osrm/il-hw.osm.pbf --overwrite --no-progress
      - env: { OSM_PBF: /tmp/osrm/il-hw.osm.pbf, IDS: '14554731087,14582570000,14566738591,14566594958,14575228275,14566720982,14566525662,14566629662,14455262371,14566487405,14562841129,14582425964', NUMS: '5,5א,12,78,83,87א,96,99,268,41,1,119,22,2,3,9,17,201,445,126', WALK: '14582425964' }
        run: |
          true
          python3 tools/_probe/one.py 2>&1 | grep -E "XADD|ROUTE|ניתוב נכשל|Traceback|Error" | head -260
