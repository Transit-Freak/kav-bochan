name: alerts-probe
on:
  push:
    branches: [claude/stoic-allen-3g21ru]
    paths: ['.github/workflows/alerts-probe.yml']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - name: diag (why no-match)
        env: { OUT: out, MAX_MIN: '50', TEMP_DIR: /tmp/temp }
        run: |
          cat > diag.py <<'PY'
          # אבחון: למה route_detour מחזיר None. מריצים את alerts_fetch עם גרסה מסומנת של הפונקציה.
          import inspect, json, os, re, sys, textwrap
          sys.path.insert(0, 'tools')
          import alerts_route as AR
          import alerts_fetch as AF

          src = textwrap.dedent(inspect.getsource(AR.route_detour)).split('\n')
          out = []
          for i, l in enumerate(src):
              out.append(re.sub(r'return None', f'return _fail({i}, locals())', l))
          LOG = []
          CUR = {}
          def _fail(i, loc):
              d = {'at': i, 'src': src[i].strip()[:60]}
              for k in ('st', 'a', 'b', 'k'):
                  if k in loc and isinstance(loc[k], (str, int)):
                      d[k] = loc[k]
              d['steps'] = loc['para'].get('steps')
              d['start'] = loc['para'].get('start')
              d['lines'] = sorted(loc['para'].get('lines') or [])
              if 'st' in loc:
                  d['m_st'] = sorted(loc['net'].match(loc['st']))[:4]
              if loc['para'].get('start'):
                  a, b = loc['para']['start']
                  d['m_a'], d['m_b'] = sorted(loc['net'].match(a))[:4], sorted(loc['net'].match(b))[:4]
              d['m_first'] = sorted(loc['net'].match(loc['para']['steps'][0]))[:4]
              LOG.append(d)
              return None
          ns = dict(AR.__dict__)
          ns['_fail'] = _fail
          exec('\n'.join(out), ns)
          AR.route_detour = ns['route_detour']

          orig = AF.estimate_routes
          REP = []
          def est(alert, rc_routes, stops):
              LOG.clear()
              res = orig(alert, rc_routes, stops)
              paras = AR.parse(alert['description'].get('he', ''))
              rs = []
              for r in rc_routes:
                  if r.get('why') == 'no-match':
                      cand = [p for p in paras if not p['lines'] or r['num'] in p['lines']]
                      fl = [x for x in LOG if not x['lines'] or r['num'] in x['lines']]
                      rs.append({'num': r['num'], 'ncand': len(cand), 'fails': [{k: v for k, v in x.items() if k not in ('lines', 'steps', 'start')} for x in fl][:3]})
              if rs:
                  REP.append({'id': alert.get('id'), 'ag': [x.get('agency_name') for x in alert.get('relevant_agencies') or []][:1],
                              'paras': [{'l': sorted(p['lines'] or []), 's': p['start'], 'st': p['steps']} for p in paras][:8],
                              'routes': rs, 'desc': alert['description'].get('he', '')[:1200]})
              return res
          AF.estimate_routes = est
          try:
              AF.main()
          finally:
              json.dump(REP, open('diag.json', 'w'), ensure_ascii=False)
              print('DIAG', len(REP))

          PY
          python3 diag.py 2>&1 | grep -v "ניסיון" | tail -8
      - name: summary per agency
        run: |
          python3 - <<'PY'
          import json, glob, collections
          al = {a['id']: a for a in json.load(open('out/alerts.json'))['alerts']}
          tot = collections.defaultdict(collections.Counter)
          for f in glob.glob('out/rc/*.json'):
              rc = json.load(open(f)); a = al.get(rc['id'])
              if not a: continue
              ag = (a.get('ag') or ['?'])[0]
              for r in rc['routes']:
                  tot[ag]['routes'] += 1
                  tot[ag]['est' if r.get('est') else (r.get('why') or '?')] += 1
          for ag, c in sorted(tot.items(), key=lambda kv: -kv[1]['routes']):
              print(ag, dict(c))
          print('ALL', dict(sum(tot.values(), collections.Counter())))
          PY
      - name: dump
        run: |
          python3 -c "import json;d=json.load(open('diag.json'));print(len(d), sum(len(a['routes']) for a in d))"
          gzip -9c diag.json | base64 -w 0 | fold -w 3000 | sed 's/^/B64:/'
