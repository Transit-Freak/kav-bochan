name: probe-gisnet
on:
  push:
    branches: [probe-terms]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > p.js <<'JS'
          const {chromium}=require('playwright');(async()=>{
          const b=await chromium.launch();const p=await b.newPage();
          const urls=['https://www.k-m.org.il/','https://www.complot.co.il/','http://www.complot.co.il/','https://v5.gis-net.co.il/v5/K_Malachi'];
          for(const u of urls){
            try{await p.goto(u,{waitUntil:'domcontentloaded',timeout:90000});await p.waitForTimeout(6000);}catch(e){console.log('\n###',u,'ERR',e.message.slice(0,150));continue}
            console.log('\n###',u,'→',p.url(),'|',await p.title());
            const links=await p.$$eval('a',as=>as.map(a=>[a.innerText.trim().slice(0,40),a.href]).filter(([t,h])=>/תנאי|תקנון|privacy|terms|פרטיות|מדריך|זכויות/i.test(t+' '+h)));
            console.log('LINKS',JSON.stringify(links.slice(0,20)));
            for(const [t,h] of links.filter(([t,h])=>/תנאי|תקנון|terms|מדריך/i.test(t+' '+h)).slice(0,3)){
              try{const q=await b.newPage();await q.goto(h,{waitUntil:'domcontentloaded',timeout:60000});await q.waitForTimeout(4000);const tx=await q.evaluate(()=>document.body.innerText);
                console.log('\n  >>> SUB',t,h,'len',tx.length);console.log('  TEXT',tx.replace(/\s+/g,' ').slice(0,8000));await q.close();}catch(e){console.log('  SUB ERR',h,e.message.slice(0,100))}
            }
          }
          await b.close()})()
          JS
          node p.js
