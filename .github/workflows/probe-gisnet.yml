name: probe-gisnet
on:
  push:
    branches: [probe-gisnet]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > p.js <<'JS'
          const {chromium}=require('playwright');(async()=>{
          const b=await chromium.launch();const p=await b.newPage();
          await p.goto('https://v5.gis-net.co.il/v5/K_Malachi',{waitUntil:'networkidle',timeout:90000}).catch(e=>console.log('goto',e.message));
          await p.waitForTimeout(5000);
          const P='https://v5.gis-net.co.il/proxy/proxy.ashx?http://arcgis005/arcgis/rest/services/K_malachi/k_malachi_Public/MapServer';
          const get=async(path)=>p.evaluate(async u=>{const r=await fetch(u);return [r.status,await r.text()]},P+path);
          let [s,t]=await get('?f=json&guid=x');console.log('INFO',s,t.slice(0,300));
          let info;try{info=JSON.parse(t)}catch(e){[s,t]=await get('?f=json');info=JSON.parse(t)}
          for(const l of info.layers) console.log('LAYER',l.id,l.name);
          for(const l of info.layers.filter(l=>/שכונ|מספר|בית|בתים|כתוב/.test(l.name))){
            const [s2,t2]=await get('/'+l.id+'?f=json');const d=JSON.parse(t2);
            console.log('FIELDS',l.id,l.name,d.geometryType,JSON.stringify((d.fields||[]).map(f=>[f.name,f.alias])));
            const [s3,t3]=await get('/'+l.id+'/query?f=json&where=1%3D1&returnGeometry=false&outFields=*&resultRecordCount=3');
            console.log('SAMPLE',l.id,t3.slice(0,1500));
          }
          await b.close()})()
          JS
          node p.js
