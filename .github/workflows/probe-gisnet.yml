name: probe-gisnet
on:
  push:
    branches: [probe-gisnet]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          A='https://data.gov.il/api/3/action/'
          def g(a,**q): return json.load(urllib.request.urlopen(urllib.request.Request(A+a+'?'+urllib.parse.urlencode(q),headers={'User-Agent':'kav-bochan'}),timeout=120))['result']
          seen=set()
          for q in ['כתובות','כתובת','מספרי בתים','מספר בית','addresses','address','רחובות','גיאוקוד','נקודות כתובת','בנק כתובות']:
              r=g('package_search',q=q,rows=40)
              print(f'\n=== "{q}": {r["count"]} תוצאות')
              for p in r['results']:
                  if p['name'] in seen: continue
                  seen.add(p['name'])
                  res=[(x.get('name') or '')[:40]+' ['+(x.get('format') or '')+(' DS' if x.get('datastore_active') else '')+']' for x in p.get('resources',[])][:4]
                  print(f"- {p['title']} | {p.get('organization',{}).get('title','')} | {p['name']} | {res}")
          PY
