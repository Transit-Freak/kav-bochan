name: probe-gisnet
on:
  push:
    branches: [probe-gisnet]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > p.js <<'JS'
          const {chromium}=require('playwright');(async()=>{
          const b=await chromium.launch();const p=await b.newPage();
          const seen=new Set();
          p.on('request',r=>{const u=r.url();if(!/\.(png|jpg|gif|woff2?|ttf|svg|css)(\?|$)/.test(u)&&!seen.has(u)){seen.add(u);console.log('REQ',r.method(),r.resourceType(),u.slice(0,400));if(r.postData())console.log('   BODY',r.postData().slice(0,400))}});
          p.on('response',async r=>{const u=r.url();if(/layer|Layer|query|Query|config|Config|json|ashx|asmx|api/i.test(u)&&!/\.js(\?|$)/.test(u)){try{const t=await r.text();console.log('RES',r.status(),u.slice(0,300),'\n   ',t.slice(0,1500).replace(/\s+/g,' '))}catch(e){}}});
          await p.goto('https://v5.gis-net.co.il/v5/K_Malachi',{waitUntil:'networkidle',timeout:90000}).catch(e=>console.log('goto',e.message));
          await p.waitForTimeout(15000);
          console.log('TITLE',await p.title());
          const txt=await p.evaluate(()=>document.body.innerText.slice(0,3000));console.log('TEXT',txt.replace(/\s+/g,' '));
          await b.close()})()
          JS
          node p.js
