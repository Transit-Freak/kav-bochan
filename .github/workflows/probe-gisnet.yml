name: probe-gisnet
on:
  push:
    branches: [probe-gisnet]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > p.js <<'JS'
          const {chromium}=require('playwright');(async()=>{
          const b=await chromium.launch();const p=await b.newPage();
          const KW=/תנאי|תקנון|שימוש|זכויות|יוצרים|בינה מלאכותית|AI|לימוד מכונה|למידת מכונה|סריקה|איסוף אוטומטי|scrap|crawl|bot|רובוט|מאגר|העתק|הורד|מסחרי|אסור|Complot|קומפלוט/i;
          const urls=['https://www.complot.co.il/','https://complot.co.il/','https://www.gis-net.co.il/','https://gis-net.co.il/','https://v5.gis-net.co.il/',
            'https://v5.gis-net.co.il/v5/K_Malachi','https://www.k-malachi.muni.il/','https://www.kiryat-malachi.muni.il/'];
          for(const u of urls){
            try{await p.goto(u,{waitUntil:'networkidle',timeout:45000});}catch(e){console.log('\n###',u,'ERR',e.message.slice(0,120));continue}
            console.log('\n###',u,'→',p.url(),'|',await p.title());
            const links=await p.$$eval('a',as=>as.map(a=>[a.innerText.trim(),a.href]).filter(([t,h])=>/תנאי|תקנון|שימוש|privacy|terms|נגישות|מדריך|אודות|about/i.test(t+' '+h)));
            console.log('LINKS',JSON.stringify(links.slice(0,25)));
            const txt=await p.evaluate(()=>document.body.innerText);
            const hits=txt.split(/\n+/).filter(l=>KW.test(l)).slice(0,25);console.log('HITS',JSON.stringify(hits).slice(0,2500));
            for(const [t,h] of links.filter(([t,h])=>/תנאי|תקנון|terms|מדריך/i.test(t+' '+h)).slice(0,4)){
              try{const q=await b.newPage();await q.goto(h,{waitUntil:'networkidle',timeout:45000});const tx=await q.evaluate(()=>document.body.innerText);
                console.log('\n  >>> SUB',t,h,'len',tx.length);console.log('  TEXT',tx.replace(/\s+/g,' ').slice(0,6000));await q.close();}catch(e){console.log('  SUB ERR',h,e.message.slice(0,100))}
            }
          }
          await b.close()})()
          JS
          node p.js
