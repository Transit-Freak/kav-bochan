name: probe-gisnet
on:
  push:
    branches: [probe-gisnet]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, csv, sys
          P = 'https://v5.gis-net.co.il/proxy/proxy.ashx?http://arcgis005/arcgis/rest/services/K_malachi/k_malachi_Public/MapServer'
          H = {'User-Agent': 'Mozilla/5.0', 'Referer': 'https://v5.gis-net.co.il/v5/K_Malachi'}
          def get(path, **q):
              u = P + path + ('?' + urllib.parse.urlencode(q) if q else '')
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=120))
          info = get('', f='json')
          for l in info['layers']:
              print('LAYER', l['id'], l['name'], l.get('geometryType', ''))
          def find(*words):
              return [l for l in info['layers'] if any(w in l['name'] for w in words)]
          for l in find('שכונ', 'מספר', 'בית', 'כתוב'):
              d = get(f"/{l['id']}", f='json')
              print('\nFIELDS', l['id'], l['name'], d.get('geometryType'), [(f['name'], f.get('alias')) for f in d.get('fields') or []])
          json.dump(info, open('info.json', 'w'))
          PY
