name: probe-stopload
on:
  push:
    branches: [probe-stopload]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - run: pip install -q brotli
      - run: NDAYS=8 python3 tools/probe_stopload.py
      - uses: actions/upload-artifact@v4
        with:
          name: stopload
          path: stopload.json
