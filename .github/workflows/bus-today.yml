name: bus-today

# מדד דיוק האוטובוסים — "היום": היום הנוכחי (לפי השעון בישראל) נבחר בדף כמו כל יום אחר, ומתעדכן כל 10 דקות.
# אותו חישוב של הריצה הלילית (tools/bus_reliability.py) במצב --partial: רק נסיעות שהסתיימו לפי הלו"ז,
# והפלט אותם קובצי יום (days/D.json, .stops, .dep, .cover, .cities, .regions) ועוד today.json.
#
# GitHub כמעט לא מפעיל כאן cron של כל 10 דקות, ולכן ריצה אחת ארוכה (כ-5.5 שעות): הלולאה ב-tools/bus_today_loop.sh
# מעדכנת כל 10 דקות, ובסוף הריצה מפעילה את הריצה הבאה (gh workflow run). ה-cron השעתי רק מתניע מחדש אם השרשרת
# נקטעה; ריצה שמוצאת ריצה אחרת פעילה יוצאת מיד.
#
# בלי להוריד את כל היום בכל עדכון: קובצי ה-SIRI של היום (קובץ לדקה מ-S3) ורצפי התחנות המוכנים (pickle)
# נשמרים ב-actions/cache במפתח של התאריך בישראל — בסוף כל מקטע של כשעה, כדי שריצה שנפלה לא תאבד הכל;
# הישנים נמחקים. אחרי חצות — תאריך חדש, מטמון חדש.
#
# פרסום בלי פריסה של האתר ובלי להגדיל את main: הקבצים (מכווצים) נדחפים (force) כ-commit יחיד בענף נפרד
# bus-today, והדף bus/ קורא אותם מ-raw.githubusercontent.com.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write    # דחיפה לענף bus-today
  actions: write     # מחיקת מטמונים ישנים והפעלת הריצה הבאה

concurrency:
  group: bus-today
  cancel-in-progress: false

jobs:
  today:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      SEG: 3300          # מקטע: 55 דקות, ואחריו שמירת מטמון
    steps:
      - name: ריצה אחרת פעילה?
        id: go
        run: |
          set -euo pipefail
          other=$(gh run list -R "$GITHUB_REPOSITORY" --workflow bus-today.yml --status in_progress --json databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")
          if [ "$other" != "0" ]; then echo "ריצה אחרת כבר מעדכנת — יוצאים"; echo "run=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "run=1" >> "$GITHUB_OUTPUT"
          echo "t0=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          echo "d=$(TZ=Asia/Jerusalem date +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.go.outputs.run == '1'
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          # הכלים, וקבצי האתר שהחישוב קורא: סוג הרכב (data-main, fleet) והקטלוג של המדד (אשכולות, שמות תחנות)
          sparse-checkout: |
            /tools/
            /data-main.json
            /fleet/data/fleet.json
            /fleet/data/fleet-official.json
            /bus/data/routes.json
            /bus/data/stops.json

      - name: המטמון של היום
        if: steps.go.outputs.run == '1'
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: bus-today-${{ steps.go.outputs.d }}-${{ github.run_id }}
          restore-keys: bus-today-${{ steps.go.outputs.d }}-

      - name: תלויות
        if: steps.go.outputs.run == '1'
        run: pip install -q brotli

      - name: עדכונים כל 10 דקות (1/6)
        id: s1
        if: ${{ !cancelled() && steps.go.outputs.run == '1' }}
        run: tools/bus_today_loop.sh run $(( ${{ steps.go.outputs.t0 }} + 1 * SEG ))

      - name: שמירת המטמון (1/6)
        if: ${{ !cancelled() && steps.s1.outputs.d != '' }}
        uses: actions/cache/save@v4
        with:
          path: cache
          key: bus-today-${{ steps.s1.outputs.d }}-${{ github.run_id }}-${{ github.run_attempt }}-1

      - name: מחיקת מטמונים ישנים (1/6)
        if: ${{ !cancelled() && steps.s1.outputs.d != '' }}
        run: tools/bus_today_loop.sh prune "bus-today-${{ steps.s1.outputs.d }}-${{ github.run_id }}-${{ github.run_attempt }}-1"

      - name: עדכונים כל 10 דקות (2/6)
        id: s2
        if: ${{ !cancelled() && steps.go.outputs.run == '1' }}
        run: tools/bus_today_loop.sh run $(( ${{ steps.go.outputs.t0 }} + 2 * SEG ))

      - name: שמירת המטמון (2/6)
        if: ${{ !cancelled() && steps.s2.outputs.d != '' }}
        uses: actions/cache/save@v4
        with:
          path: cache
          key: bus-today-${{ steps.s2.outputs.d }}-${{ github.run_id }}-${{ github.run_attempt }}-2

      - name: מחיקת מטמונים ישנים (2/6)
        if: ${{ !cancelled() && steps.s2.outputs.d != '' }}
        run: tools/bus_today_loop.sh prune "bus-today-${{ steps.s2.outputs.d }}-${{ github.run_id }}-${{ github.run_attempt }}-2"

      - name: עדכונים כל 10 דקות (3/6)
        id: s3
        if: ${{ !cancelled() && steps.go.outputs.run == '1' }}
        run: tools/bus_today_loop.sh run $(( ${{ steps.go.outputs.t0 }} + 3 * SEG ))

      - name: שמירת המטמון (3/6)
        if: ${{ !cancelled() && steps.s3.outputs.d != '' }}
        uses: actions/cache/save@v4
        with:
          path: cache
          key: bus-today-${{ steps.s3.outputs.d }}-${{ github.run_id }}-${{ github.run_attempt }}-3

      - name: מחיקת מטמונים ישנים (3/6)
        if: ${{ !cancelled() && steps.s3.outputs.d != '' }}
        run: tools/bus_today_loop.sh prune "bus-today-${{ steps.s3.outputs.d }}-${{ github.run_id }}-${{ github.run_attempt }}-3"

      - name: עדכונים כל 10 דקות (4/6)
        id: s4
        if: ${{ !cancelled() && steps.go.outputs.run == '1' }}
        run: tools/bus_today_loop.sh run $(( ${{ steps.go.outputs.t0 }} + 4 * SEG ))

      - name: שמירת המטמון (4/6)
        if: ${{ !cancelled() && steps.s4.outputs.d != '' }}
        uses: actions/cache/save@v4
        with:
          path: cache
          key: bus-today-${{ steps.s4.outputs.d }}-${{ github.run_id }}-${{ github.run_attempt }}-4

      - name: מחיקת מטמונים ישנים (4/6)
        if: ${{ !cancelled() && steps.s4.outputs.d != '' }}
        run: tools/bus_today_loop.sh prune "bus-today-${{ steps.s4.outputs.d }}-${{ github.run_id }}-${{ github.run_attempt }}-4"

      - name: עדכונים כל 10 דקות (5/6)
        id: s5
        if: ${{ !cancelled() && steps.go.outputs.run == '1' }}
        run: tools/bus_today_loop.sh run $(( ${{ steps.go.outputs.t0 }} + 5 * SEG ))

      - name: שמירת המטמון (5/6)
        if: ${{ !cancelled() && steps.s5.outputs.d != '' }}
        uses: actions/cache/save@v4
        with:
          path: cache
          key: bus-today-${{ steps.s5.outputs.d }}-${{ github.run_id }}-${{ github.run_attempt }}-5

      - name: מחיקת מטמונים ישנים (5/6)
        if: ${{ !cancelled() && steps.s5.outputs.d != '' }}
        run: tools/bus_today_loop.sh prune "bus-today-${{ steps.s5.outputs.d }}-${{ github.run_id }}-${{ github.run_attempt }}-5"

      - name: עדכונים כל 10 דקות (6/6)
        id: s6
        if: ${{ !cancelled() && steps.go.outputs.run == '1' }}
        run: tools/bus_today_loop.sh run $(( ${{ steps.go.outputs.t0 }} + 6 * SEG ))

      - name: שמירת המטמון (6/6)
        if: ${{ !cancelled() && steps.s6.outputs.d != '' }}
        uses: actions/cache/save@v4
        with:
          path: cache
          key: bus-today-${{ steps.s6.outputs.d }}-${{ github.run_id }}-${{ github.run_attempt }}-6

      - name: מחיקת מטמונים ישנים (6/6)
        if: ${{ !cancelled() && steps.s6.outputs.d != '' }}
        run: tools/bus_today_loop.sh prune "bus-today-${{ steps.s6.outputs.d }}-${{ github.run_id }}-${{ github.run_attempt }}-6"

      - name: הריצה הבאה
        if: ${{ !cancelled() && steps.go.outputs.run == '1' }}
        run: gh workflow run bus-today.yml -R "$GITHUB_REPOSITORY" --ref main
