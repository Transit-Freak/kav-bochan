name: kavpach-ridership

# נוסעים לפי רבעון לכל קו (שלמה 23.10) — לקו פח ולקו המוזהב. המאגר מתעדכן פעם ברבעון, לכן פעם
# בשבוע מספיק.

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/kavpach_ridership.py', '.github/workflows/kavpach-ridership.yml']

permissions:
  contents: write

concurrency:
  group: kavpach-ridership
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools
          sparse-checkout-cone-mode: true
      - name: נוסעים לפי רבעון
        run: |
          python3 tools/kavpach_ridership.py
      - name: שמירה
        run: |
          git config user.name 'kavpach-bot'
          git config user.email 'noreply@github.com'
          [ -f kavpach-ridership.json ] || exit 0
          git add kavpach-ridership.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: נוסעים לפי רבעון (קו פח)'
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 10; done
          exit 1
