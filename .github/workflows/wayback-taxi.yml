# זמני (ענף ניסויים): איתור מפרטי הקווים של מכרזי מוניות השירות במינהל הרכש, וכתבות על קווי הרפורמה ברחובות.
name: wayback-taxi
on:
  push:
    branches: [claude/stoic-allen-3g21ru]
    paths: ['.github/workflows/wayback-taxi.yml', 'tools/wayback_probe.py']
  workflow_dispatch:
concurrency:
  group: wayback-taxi
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - name: כלים
        run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: חיפוש
        run: python3 tools/wayback_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: taxi-tenders
          path: out/
          retention-days: 5
