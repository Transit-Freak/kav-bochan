# זמני (ענף ניסויים): בדיקה זהירה של גישה לארכיון האינטרנט מ-GitHub — 3 בקשות בלבד.
name: wayback-taxi
on:
  push:
    branches: [claude/stoic-allen-3g21ru]
    paths: ['.github/workflows/wayback-taxi.yml']
  workflow_dispatch:
concurrency:
  group: wayback-taxi
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: בדיקת גישה
        run: |
          UA='kav-bochan-research/1.0'
          for u in "https://archive.org/wayback/available?url=tel-aviv.gov.il&timestamp=20170101" \
                   "https://web.archive.org/cdx/search/cdx?url=tel-aviv.gov.il&from=2017&to=2017&limit=3&output=json" \
                   "https://web.archive.org/web/2017/http://www.tel-aviv.gov.il/"; do
            curl -s -o /tmp/o -w "%{http_code} %{time_total}s $u\n" --max-time 40 -A "$UA" "$u" || echo "FAIL $u"
            head -c 200 /tmp/o; echo; sleep 6
          done
