# זמני (ענף ניסויים): חיפוש זהיר בארכיון האינטרנט — מתי 301 ו-311 הפסיקו לעצור בתחנה 14718. עד ~40 בקשות.
name: wayback-taxi
on:
  push:
    branches: [claude/stoic-allen-3g21ru]
    paths: ['.github/workflows/wayback-taxi.yml', 'tools/wayback_stop.py']
  workflow_dispatch:
concurrency:
  group: wayback-taxi
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - name: חיפוש
        run: python3 tools/wayback_stop.py
