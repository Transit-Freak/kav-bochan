# זמני (ענף ניסויים): חיפוש תיאורי מסלול של מוניות שירות בארכיון האינטרנט, 2013–2019.
# התוצאות נשמרות בענף הזה בתיקייה wayback-taxi/.
name: wayback-taxi
on:
  push:
    branches: [claude/stoic-allen-3g21ru]
    paths: ['.github/workflows/wayback-taxi.yml', 'tools/wayback_taxi.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/stoic-allen-3g21ru
          sparse-checkout: |
            tools/wayback_taxi.py
            .github/workflows/wayback-taxi.yml
          sparse-checkout-cone-mode: false
      - name: חיפוש
        run: python3 tools/wayback_taxi.py
      - name: שמירה
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add wayback-taxi
          git commit -m "wayback-taxi: תוצאות" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin claude/stoic-allen-3g21ru && git push -q origin HEAD:claude/stoic-allen-3g21ru && break; sleep 5; done
