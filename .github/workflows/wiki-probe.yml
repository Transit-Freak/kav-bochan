name: wiki-probe

# זמני: שליפת קוד המקור של ערכי תחנות מוויקיפדיה — מחקר פורמט לוויקי-בודק.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: fetch wikitext
        run: python3 tools/wiki_probe.py
