name: bus-ref
on:
  push:
    branches: [claude/bus-ref]
    paths: [.github/workflows/bus-ref.yml]
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: tools/bus-ref}
      - name: תמונות מדפים שנמצאו בחיפוש (להסתכלות בלבד)
        run: |
          pip install -q pillow
          mkdir -p tools/bus-ref && rm -f tools/bus-ref/*
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, io, time
          from PIL import Image
          UA = {'User-Agent': 'kav-bochan-ref/1.0 (https://kavbochan.app; reference viewing)'}
          def api(**p):
              p.update(format='json')
              return json.load(urllib.request.urlopen(urllib.request.Request('https://commons.wikimedia.org/w/api.php?' + urllib.parse.urlencode(p), headers=UA), timeout=30))
          def sheet(name, queries, per=8):
              ims, caps = [], []
              for q in queries:
                  try:
                      r = api(action='query', generator='search', gsrsearch=q + ' filetype:bitmap', gsrnamespace=6, gsrlimit=per, gsrsort='create_timestamp_desc', prop='imageinfo', iiprop='url', iiurlwidth=600)
                  except Exception as e: print('api', e); continue
                  for pg in (r.get('query', {}).get('pages') or {}).values():
                      try:
                          b = urllib.request.urlopen(urllib.request.Request(pg['imageinfo'][0]['thumburl'], headers=UA), timeout=20).read()
                          ims.append(Image.open(io.BytesIO(b)).convert('RGB')); caps.append(pg['title'][5:70])
                      except Exception: pass
                      time.sleep(0.2)
              open(f'tools/bus-ref/{name}.txt', 'w').write('\n'.join(caps))
              W = 360; th = [im.resize((W, int(im.height * W / im.width))) for im in ims]
              for s in range(0, len(th), 12):
                  part = th[s:s+12]; H = min(480, max(t.height for t in part))
                  sh = Image.new('RGB', (W*4, H*3), 'white')
                  for i, t in enumerate(part): sh.paste(t.crop((0, 0, W, min(H, t.height))), ((i % 4) * W, (i // 4) * H))
                  sh.save(f'tools/bus-ref/{name}{s//12}.jpg', quality=75)
              print(name, len(ims))
          sheet('sold', ['Israeli soldiers', 'IDF soldier woman', 'Israel Defense Forces soldiers bus', 'IDF soldiers backpack'])
          sheet('ppl', ['Jerusalem Light Rail passengers', 'Jerusalem Central Bus Station', 'Tel Aviv street people', 'Israel bus stop', 'Haredi women street Jerusalem', 'Israeli students campus 2023'])
          PY
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/bus-ref && git commit -qm "reference photos" && git push -q origin HEAD:claude/bus-ref
