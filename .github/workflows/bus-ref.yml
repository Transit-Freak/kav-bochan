name: bus-ref
on:
  push:
    branches: [claude/bus-ref]
    paths: [.github/workflows/bus-ref.yml]
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: tools/bus-ref}
      - name: תמונות מדפים שנמצאו בחיפוש (להסתכלות בלבד)
        run: |
          pip install -q pillow
          mkdir -p tools/bus-ref && rm -f tools/bus-ref/*
          python3 - <<'PY'
          import re, json, urllib.request, io, html
          from PIL import Image
          UA = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'}
          PAGES = [
            'https://www.ynetnews.com/culture/article/bk9ams4ege',
            'https://magazine.esra.org.il/esramagazine/look-into-it/latest-esramagazine/entry/beer-sheva-kaleidoscopic-mix-at-city-bus-station.html',
            'https://unsplash.com/s/photos/tel-aviv-yafo%2C-israel',
            'https://unsplash.com/s/photos/jerusalem-people',
            'https://unsplash.com/s/photos/israeli-woman',
            'https://unsplash.com/s/photos/israeli-soldier',
            'https://theculturetrip.com/middle-east/israel/articles/these-instagram-photos-capture-the-essence-of-everyday-life-in-tel-aviv',
          ]
          out = []; n = 0
          for pg in PAGES:
              try:
                  h = urllib.request.urlopen(urllib.request.Request(pg, headers=UA), timeout=30).read().decode('utf-8', 'ignore')
              except Exception as e:
                  print('page fail', pg, e); continue
              urls = re.findall(r'https?://[^\s"\'<>]+?\.(?:jpe?g|webp)(?:\?[^\s"\'<>]*)?', html.unescape(h))
              urls += re.findall(r'https://images\.unsplash\.com/photo-[^\s"\'<>?]+(?:\?[^\s"\'<>]*)?', html.unescape(h))
              seen, got = set(), 0
              for u in urls:
                  key = u.split('?')[0]
                  if key in seen or any(k in u.lower() for k in ('logo', 'icon', 'avatar', 'profile', 'sprite')): continue
                  seen.add(key)
                  if 'images.unsplash.com' in u: u = key + '?w=1000&q=70'
                  try:
                      b = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30).read()
                      im = Image.open(io.BytesIO(b)).convert('RGB')
                  except Exception: continue
                  if im.width < 400 or im.height < 300: continue
                  im.thumbnail((1000, 1000)); fn = f'{n:02d}.jpg'; im.save('tools/bus-ref/' + fn, quality=75)
                  out.append({'file': fn, 'page': pg, 'src': key}); n += 1; got += 1
                  if got >= 12: break
              print(pg, got)
          json.dump(out, open('tools/bus-ref/index.json', 'w'), indent=1)
          PY
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/bus-ref && git commit -qm "reference photos" && git push -q origin HEAD:claude/bus-ref
