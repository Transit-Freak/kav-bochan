name: wiki-stations

# ויקי-בודק: בניית נתוני האמת על תחנות מרכזיות ומסופים מה-GTFS הרשמי —
# הקווים שמתחילים/מסתיימים בכל תחנה — וסריקה מוקדמת של כל הערכים בוויקיפדיה.

on:
  schedule:
    - cron: '0 4 * * 5'   # שישי 04:00 UTC — שבועי
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: בניית נתוני התחנות
        run: python3 tools/wiki_stations.py

      - name: סריקת הערכים בוויקיפדיה (best-effort)
        continue-on-error: true
        run: python3 tools/wiki_audit.py

      - name: commit
        run: |
          git config user.name 'fleet-bot'
          git config user.email 'noreply@github.com'
          git add wiki-check/data
          git diff --cached --quiet && { echo 'אין שינוי'; exit 0; }
          git commit -m 'data: wiki-check — עדכון נתוני התחנות וסריקת הערכים'
          git pull --rebase origin main
          git push
