name: links-check
# בדיקת הקישורים החיצוניים בדף הקישורים (שלמה 30.09: "חצי מהם לא עובדים")
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: links.html }
      - shell: bash {0}
        run: |
          for u in $(grep -o 'href="https\?://[^"]*"' links.html | sed 's/href="//;s/"$//' | sort -u); do
            r=$(curl -sL -A 'Mozilla/5.0' -o /tmp/b -w '%{http_code} %{url_effective}' --max-time 30 "$u" || true)
            t=$(grep -o '<title>[^<]*' /tmp/b | head -1 | cut -c8-90)
            echo "$r | $u | $t"
          done
          echo "== CKAN"
          for id in licensing_bus_system kli_rechev_ciburiim bus_fleet; do
            curl -s -A 'Mozilla/5.0' "https://data.gov.il/api/3/action/package_show?id=$id" | python3 -c "import json,sys;d=json.load(sys.stdin)['result'];print('$id', d['name'], d['id'], (d.get('organization') or {}).get('name'), d['title'])" || echo "$id FAIL"
          done
          curl -sL -A 'Mozilla/5.0' -o /tmp/p -w '%{http_code}\n' https://data.gov.il/he/datasets/ministry_of_transport/licensing_bus_system
