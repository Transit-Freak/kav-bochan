name: blender-tap
on:
  push:
    branches: [claude/blender-tap]
    paths: [tools/blender-test/**, .github/workflows/blender-tap.yml]
permissions:
  contents: write
concurrency: {group: blender-tap, cancel-in-progress: true}
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        variant: [ok, err, nofunds]
    env:
      TAP_PREVIEW: '1'
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: tools/blender-test}
      - name: Blender
        run: |
          set -e
          sudo apt-get update -q && sudo apt-get install -yq libxi6 libxkbcommon0 libsm6 libxrender1 libgl1 libegl1 libxxf86vm1 libxfixes3 > /dev/null
          V=$(curl -s https://download.blender.org/release/ | grep -oE 'Blender5\.[0-9]+' | sort -Vu | tail -1)
          F=$(curl -s https://download.blender.org/release/$V/ | grep -oE 'blender-5\.[0-9.]+-linux-x64\.tar\.xz' | sort -Vu | tail -1)
          echo "$V/$F"; curl -sL https://download.blender.org/release/$V/$F | tar -xJ -C $HOME
          echo "BL=$(ls -d $HOME/blender-*/)blender" >> $GITHUB_ENV
          git clone -q --depth=1 https://github.com/EL4CTEO/blender-skills.git $HOME/bsk
          echo "SK=$HOME/bsk/skills" >> $GITHUB_ENV
      - name: MPFB
        continue-on-error: true
        run: |
          $BL -b --factory-startup --online-mode --command extension sync || true
          $BL -b --online-mode --command extension install -s --enable mpfb || $BL -b --online-mode --command extension install --enable blender_org.mpfb
          UD=$($BL -b --online-mode --python-expr "import bpy;print('UD='+bpy.utils.extension_path_user('bl_ext.blender_org.mpfb', create=True))" | grep '^UD=' | cut -d= -f2)
          echo "UD=$UD"; mkdir -p "$UD/data"
          curl -sL -o /tmp/sa.zip http://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip && unzip -qo /tmp/sa.zip -d "$UD/data" && ls "$UD/data" | head
      - name: תנועה מצולמת (CMU 16_34 — הליכה איטית ועצירה)
        run: |
          git clone -q --depth=1 --filter=blob:none --sparse https://github.com/Shriinivas/cmubvh.git $HOME/cmubvh
          cd $HOME/cmubvh && Z=Sequence-015-019/16/Data/16_34.zip
          git sparse-checkout set --no-cone "/$Z" && mkdir -p $HOME/bvh && unzip -qo "$Z" -d $HOME/bvh
          F=$(find $HOME/bvh -name '*.bvh' | head -1); echo "BVH=$F" >> $GITHUB_ENV; echo "BVH file: $F"
      - name: Build
        working-directory: tools/blender-test
        run: |
          pip install -q pillow && mkdir -p out tex && python3 screens.py tex && python3 card_tex.py tex
          $BL -b --factory-startup --python-exit-code 1 -P bus.py 2>&1 | grep -E 'BUS|Error|Traceback' | tail -5
          D=out/tap; [ "$VARIANT" != ok ] && D=out/tap_$VARIANT; rm -rf $D; mkdir -p $D
          $BL -b --online-mode out/bus.blend -P tap.py 2>&1 | grep -E 'TAP|DBG|MATCHED|Error|Traceback|line [0-9]|Saved:' | cut -c1-900 || true
          ls $D | wc -l
      - name: Save
        if: always()
        working-directory: tools/blender-test
        run: |
          D=out/tap; [ "$VARIANT" != ok ] && D=out/tap_$VARIANT
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A $D && git commit -qm "blender-tap renders ($VARIANT)" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin claude/blender-tap && git push -q origin HEAD:claude/blender-tap && break; sleep $((i * 7)); done
