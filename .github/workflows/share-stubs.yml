name: share-stubs

# דפי-שיתוף לכל קו, רכב ותחנה — מתחדשים יומית אחרי שכל הצינורות רצו,
# כך שישויות חדשות מקבלות דף שיתוף אוטומטית. הקבצים דטרמיניסטיים:
# קומיט נוצר רק כשמשהו באמת השתנה.

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # באנרי שיתוף — מתפצלים על כמה releases (מגבלת 1000 קבצים ל-release שעצרה את
      # הריצה שבוע, 28.09). כשל כאן לא עוצר את יצירת דפי השיתוף
      - name: באנרים — רינדור החסרים (קווים, 2012, רכבות)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          R: Transit-Freak/kav-bochan
        run: |
          python3 - <<'PYEOF'
          import json,glob,gzip
          nums={(e.get('line') or '') for e in json.load(open('line-history/data/lines.json',encoding='utf-8'))['lines']}
          nums|={str(e.get('no') or '') for e in json.load(open('magihim-2012/data/index.json',encoding='utf-8')).get('lines') or []}
          json.dump(sorted(nums-{''}),open('lnums.json','w',encoding='utf-8'),ensure_ascii=False)
          rn=set()
          for f in glob.glob('line-history/data/early-rail/????-??-??.json.gz'):
              for r in json.load(gzip.open(f,'rt',encoding='utf-8')).get('rows') or []:
                  if str(r[0]).strip(): rn.add(str(r[0]).strip())
          json.dump(sorted(rn),open('rnums.json','w',encoding='utf-8'),ensure_ascii=False)
          PYEOF
          python3 tools/share_banner_sync.py line lnums.json
          python3 tools/share_banner_sync.py rail rnums.json
      - name: יצירת דפי השיתוף
        run: python3 tools/share_stubs.py
      - name: דחיפה
        run: |
          git config user.name kav-bochan-bot
          git config user.email bot@users.noreply.github.com
          git add s
          git diff --cached --quiet && { echo "אין שינוי"; exit 0; }
          git commit -m "דפי שיתוף: רענון יומי"
          for i in 1 2 3 4; do git push && exit 0; git pull --rebase && continue; done
          git push
