name: mot-catalog
# בדיקה חד-פעמית: כל המאגרים של משרד התחבורה ב-data.gov.il (שלמה 30.09: כלי GIS — מסופים ותוכניות)
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - shell: bash {0}
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          def get(q):
              u='https://data.gov.il/api/3/action/package_search?'+urllib.parse.urlencode(q)
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent':'Mozilla/5.0'}), timeout=60))['result']
          seen=set()
          for q in [{'fq':'organization:ministry_of_transport','rows':1000},
                    {'q':'מסוף','rows':100},{'q':'תחנה מרכזית','rows':100},{'q':'תכנית תחבורה','rows':100},
                    {'q':'תוכנית','rows':100},{'q':'נת"צ','rows':100},{'q':'רכבת קלה','rows':100},{'q':'מטרו','rows':100}]:
              r=get(q); print('\n## query', q, 'count', r['count'])
              for d in r['results']:
                  if d['name'] in seen: continue
                  seen.add(d['name'])
                  fm=sorted({(x.get('format') or '').upper() for x in d.get('resources',[])})
                  print(f"{d['name']} | {(d.get('organization') or {}).get('name')} | {d['title']} | {d.get('metadata_modified','')[:10]} | {','.join(fm)}")
          PY
