name: tmp-455-transfer
# זמני: בדיקה חד-פעמית של החלפה 455 ← קריית מלאכי לפי SIRI. יימחק בסוף הבדיקה.
on:
  push:
    branches: [claude/stoic-allen-3g21ru]
    paths:
      - '.github/workflows/tmp-455-transfer.yml'
      - 'tmp-455/**'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tmp-455
          filter: blob:none
      - run: python3 tmp-455/analyze.py
