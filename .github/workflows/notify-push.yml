name: notify-push

# הקו בזמן — שליחת התראות הדפדפן היומית (OneSignal), מיד כשהסריקה של אותו יום נשמרה.
# בלי המפתחות (Secrets) הריצה יוצאת בשקט — הפיצ'ר כבוי עד שיוזנו.
#
# שלמה 11.10: "שההתראות יחכו לסריקה של אותו יום ולא ישלחו בשעה קבועה". עד עכשיו השליחה רצה
# בשעה קבועה (09:15 UTC), ובימים שבהם הסריקה התעכבה (ב-11.10 היא נשמרה רק ב-15:08 UTC, בניסיון
# השני) נשלחו התראות בלי השינויים של היום. עכשיו: אחרי כל ריצה מוצלחת של line-history — שליחה
# אם הסריקה של היום נשמרה (lines.json gen = היום) ואם עוד לא נשלח היום (push-sent.json).
# רשת ביטחון ב-21:40 UTC: אם הסריקה לא נשמרה כל היום, הסיכומים (3 ימים / שבועי) נשלחים בכל זאת.

on:
  workflow_run:
    workflows: [line-history]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '40 21 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'תאריך השינויים (ברירת מחדל: היום)'
        required: false
        default: ''
      dry:
        description: 'הרצה יבשה (1 = רק להדפיס)'
        required: false
        default: '0'
      debug:
        description: 'אבחון: הצגת הנרשמים והתגים (1 = כן)'
        required: false
        default: '0'
      digest_all:
        description: 'סיכום חד-פעמי לכל הנרשמים: כמה ימים אחורה (ריק = לא)'
        required: false
        default: ''
      digest_since:
        description: 'עם digest_all: רק למי שנכנס לאתר אחרי זמן זה (ISO, למשל 2026-09-07T15:00:00Z)'
        required: false
        default: ''
      repair_sub:
        description: 'עם debug=1: תחילת מזהה מנוי לתיקון תגים (ריק = רק אבחון)'
        required: false
        default: ''
      repair_tags:
        description: 'עם repair_sub: התגים לכתיבה (JSON)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: notify-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            line-history/data/lines.json
            line-history/data/push-sent.json
          sparse-checkout-cone-mode: false
      - name: הסריקה של היום נשמרה, ועוד לא נשלח היום?
        id: g
        env:
          EVENT: ${{ github.event_name }}
          RUN_OK: ${{ github.event.workflow_run.conclusion }}
        run: |
          today=$(date -u +%F)
          gen=$(python3 -c "import json; print(json.load(open('line-history/data/lines.json')).get('gen',''))" 2>/dev/null || echo "")
          sent=$(python3 -c "import json; print(json.load(open('line-history/data/push-sent.json')).get('d',''))" 2>/dev/null || echo "")
          echo "היום: $today · הסריקה האחרונה שנשמרה: ${gen:-אין} · נשלח לאחרונה: ${sent:-אף פעם}"
          go=yes
          if [ "$EVENT" = "workflow_dispatch" ]; then go=yes
          elif [ "$sent" = "$today" ]; then echo "ההתראות של היום כבר נשלחו"; go=no
          elif [ "$EVENT" = "workflow_run" ] && [ "$RUN_OK" != "success" ]; then echo "הסריקה לא הצליחה — מחכים לניסיון הבא"; go=no
          elif [ "$EVENT" = "workflow_run" ] && [ "$gen" != "$today" ]; then echo "הסריקה של היום עוד לא נשמרה"; go=no
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  send:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build digest data
        run: |
          set -euo pipefail
          python3 tools/build_digest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add line-history/data/digest.json
          if git diff --cached --quiet; then echo "digest unchanged"; else
            git commit -m "data: digest יומי להתראות הסיכום"
            for i in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              git pull --rebase origin main; sleep 5
            done
          fi

      - name: Send daily notifications
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          set -euo pipefail
          if [ '${{ github.event.inputs.debug }}' = '1' ]; then
            REPAIR_SUB='${{ github.event.inputs.repair_sub || '' }}' \
            REPAIR_TAGS='${{ github.event.inputs.repair_tags || '' }}' \
            python3 tools/push_debug.py
            exit 0
          fi
          DATE='${{ github.event.inputs.date || '' }}' \
          DRY='${{ github.event.inputs.dry || '0' }}' \
          DIGEST_ALL='${{ github.event.inputs.digest_all || '' }}' \
          DIGEST_SINCE='${{ github.event.inputs.digest_since || '' }}' \
          python3 tools/send_push.py

      # סימון שההתראות של היום נשלחו — כדי שריצה נוספת של הסריקה באותו יום לא תשלח שוב
      - name: סימון שנשלח היום
        if: github.event.inputs.dry != '1' && github.event.inputs.debug != '1' && (github.event.inputs.date == '' || github.event.inputs.date == null)
        run: |
          set -euo pipefail
          echo "{\"d\":\"$(date -u +%F)\",\"at\":\"$(date -u +%FT%TZ)\",\"by\":\"$GITHUB_EVENT_NAME\"}" > line-history/data/push-sent.json
          git add line-history/data/push-sent.json
          git commit -q -m "data: התראות הקו בזמן נשלחו היום"
          for i in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            git pull --rebase origin main; sleep 5
          done
