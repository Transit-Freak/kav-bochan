name: blender-busanim
on:
  push:
    branches: [claude/blender-busanim]
    paths: [tools/blender-test/busanim*, .github/workflows/blender-busanim.yml]
permissions:
  contents: write
concurrency: {group: blender-busanim, cancel-in-progress: true}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      m: ${{ steps.p.outputs.m }}
      mode: ${{ steps.p.outputs.mode }}
      step: ${{ steps.p.outputs.step }}
      frames: ${{ steps.p.outputs.frames }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: tools/blender-test/busanim_plan.json, sparse-checkout-cone-mode: false}
      - id: p
        run: |
          P=tools/blender-test/busanim_plan.json
          echo "m=$(jq -c .jobs $P)" >> $GITHUB_OUTPUT
          echo "mode=$(jq -r .mode $P)" >> $GITHUB_OUTPUT
          echo "step=$(jq -r .step $P)" >> $GITHUB_OUTPUT
          echo "frames=$(jq -r .commit_frames $P)" >> $GITHUB_OUTPUT
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: tools/blender-test}
      - name: Blender
        run: |
          set -e
          sudo apt-get update -q && sudo apt-get install -yq libxi6 libxkbcommon0 libsm6 libxrender1 libgl1 libegl1 libxxf86vm1 libxfixes3 > /dev/null
          V=$(curl -s https://download.blender.org/release/ | grep -oE 'Blender5\.[0-9]+' | sort -Vu | tail -1)
          F=$(curl -s https://download.blender.org/release/$V/ | grep -oE 'blender-5\.[0-9.]+-linux-x64\.tar\.xz' | sort -Vu | tail -1)
          echo "$V/$F"; curl -sL https://download.blender.org/release/$V/$F | tar -xJ -C $HOME
          echo "BL=$(ls -d $HOME/blender-*/)blender" >> $GITHUB_ENV
          git clone -q --depth=1 https://github.com/EL4CTEO/blender-skills.git $HOME/bsk
          echo "SK=$HOME/bsk/skills" >> $GITHUB_ENV
      - name: MPFB
        run: |
          $BL -b --factory-startup --online-mode --command extension sync || true
          $BL -b --online-mode --command extension install -s --enable mpfb || $BL -b --online-mode --command extension install --enable blender_org.mpfb
          UD=$($BL -b --online-mode --python-expr "import bpy;print('UD='+bpy.utils.extension_path_user('bl_ext.blender_org.mpfb', create=True))" | grep '^UD=' | cut -d= -f2)
          echo "UD=$UD"; mkdir -p "$UD/data"
          curl -sL -o /tmp/sa.zip http://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip && unzip -qo /tmp/sa.zip -d "$UD/data"
          ls "$UD/data/clothes" | tr '\n' ' '; echo; ls "$UD/data/hair" | tr '\n' ' '; echo; ls "$UD/data/skins" | tr '\n' ' '
      - name: CMU walk
        continue-on-error: true
        run: |
          git clone -q --depth=1 --filter=blob:none --sparse https://github.com/Shriinivas/cmubvh.git $HOME/cmubvh
          cd $HOME/cmubvh
          Z=$(git ls-tree -r --name-only HEAD | grep -E '/02_01\.zip$' | head -1)
          git sparse-checkout set --no-cone "/$Z" && mkdir -p $HOME/bvh && unzip -qo "$Z" -d $HOME/bvh
          F=$(find $HOME/bvh -name '*.bvh' | head -1) && echo "BVH=$F" >> $GITHUB_ENV && echo "BVH $F"
      - name: Wheelchair model (OpenGameArt, license check)
        continue-on-error: true
        run: |
          mkdir -p $HOME/chair && cd $HOME/chair
          curl -sL -A 'Mozilla/5.0 (kav-bochan render)' https://opengameart.org/content/wheelchair -o oga.html; echo "oga page $(wc -c < oga.html)"
          echo '--- OGA license block'; grep -oiE 'license[^<]{0,80}|CC0|CC-BY[ -0-9.A-Z]*|CC-BY-SA[ 0-9.]*|GPL [0-9.]*|OGA-BY[ 0-9.]*' oga.html | sort | uniq -c | head -20
          echo '--- OGA author'; grep -oE 'href="/users/[^"]+"[^>]*>[^<]+' oga.html | head -5
          echo '--- OGA title'; grep -oE '<title>[^<]+' oga.html
          echo '--- OGA files'; grep -oE 'https?://opengameart.org/sites/default/files/[^"]+' oga.html | sort -u
          U=$(grep -oE 'https?://opengameart.org/sites/default/files/[^"]+\.(zip|blend|obj|glb|gltf|fbx|stl|7z|rar)' oga.html | sort -u | head -1)
          echo "download: $U"
          if [ -n "$U" ]; then curl -sL -o "m_$(basename "$U")" "$U"; ls -la; for z in *.zip; do [ -f "$z" ] && unzip -qo "$z" -d x; done; find . -type f | grep -viE '\.html$' | head -40; echo "CHAIR=$HOME/chair" >> $GITHUB_ENV; fi
          echo '--- BlendSwap'; curl -sL -A 'Mozilla/5.0' https://www.blendswap.com/blend/12634 -o bs.html; echo "bs page $(wc -c < bs.html)"; grep -oiE 'CC-?0|CC-BY[ -0-9.A-Z]*|CC-BY-SA|license[^<]{0,60}|login|sign in' bs.html | sort | uniq -c | head
      - name: Render
        working-directory: tools/blender-test
        env:
          SHOT: ${{ matrix.shot }}
          PART: ${{ matrix.part }}
          PARTS: ${{ matrix.parts }}
          MODE: ${{ needs.plan.outputs.mode }}
          STEP: ${{ needs.plan.outputs.step }}
        run: |
          pip install -q pillow && mkdir -p out tex && python3 screens.py tex && python3 busanim_tex.py tex
          $BL -b --factory-startup --python-exit-code 1 -P bus.py 2>&1 | grep -E 'BUS|Error|Traceback' | tail -5
          $BL -b out/bus.blend --online-mode --python-exit-code 1 -P busanim.py 2>&1 | grep -vE '^Fra:|^ *$|Synchronizing|Updating|Loading render|Compiling|Waiting|Sample [0-9]' | cut -c1-900 | tail -400
          ls out/$SHOT | wc -l
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'frames-${{ matrix.shot }}-${{ matrix.part }}', path: 'tools/blender-test/out/${{ matrix.shot }}/', if-no-files-found: ignore, retention-days: 3}
  save:
    needs: [plan, render]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: tools/blender-test/busanim_plan.json, sparse-checkout-cone-mode: false}
      - uses: actions/download-artifact@v4
        with: {pattern: 'frames-*', path: /tmp/fr}
      - name: mp4 + contact sheets, commit
        run: |
          sudo apt-get install -yq ffmpeg > /dev/null 2>&1 || true
          ST=${{ needs.plan.outputs.step }}; FR=$((24 / ST))
          O=tools/blender-test/out/busanim; mkdir -p $O
          for d in /tmp/fr/frames-*; do s=$(basename $d | sed -E 's/^frames-(.*)-[0-9]+$/\1/'); mkdir -p /tmp/sh/$s; cp $d/*.png /tmp/sh/$s/ 2>/dev/null || true; done
          for s in $(ls /tmp/sh); do
            n=$(ls /tmp/sh/$s | wc -l); echo "$s: $n frames"; [ $n -gt 0 ] || continue
            ls /tmp/sh/$s/*.png | sort | awk '{print "file \x27" $0 "\x27"}' > /tmp/l.txt
            ffmpeg -y -loglevel error -r $FR -f concat -safe 0 -i /tmp/l.txt -c:v libx264 -pix_fmt yuv420p -crf 20 -r 24 $O/$s.mp4
            K=$(( (n + 23) / 24 )); [ $K -lt 1 ] && K=1
            ffmpeg -y -loglevel error -r 1 -f concat -safe 0 -i /tmp/l.txt -vf "select='not(mod(n\,$K))',scale=480:-1,drawtext=text='%{n}':x=8:y=8:fontsize=20:fontcolor=yellow,tile=4x6" -frames:v 1 -q:v 3 $O/${s}_sheet.jpg || ffmpeg -y -loglevel error -r 1 -f concat -safe 0 -i /tmp/l.txt -vf "select='not(mod(n\,$K))',scale=480:-1,tile=4x6" -frames:v 1 -q:v 3 $O/${s}_sheet.jpg
            if [ "${{ needs.plan.outputs.frames }}" = "true" ]; then mkdir -p tools/blender-test/out/$s && rm -f tools/blender-test/out/$s/*.png && cp /tmp/sh/$s/*.png tools/blender-test/out/$s/; fi
          done
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A tools/blender-test/out --sparse 2>/dev/null || git add -A tools/blender-test/out
          git commit -qm "busanim renders" && for i in 1 2 3; do git pull -q --rebase origin claude/blender-busanim && git push -q origin HEAD:claude/blender-busanim && break; sleep 5; done || true
