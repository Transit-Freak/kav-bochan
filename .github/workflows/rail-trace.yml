name: rail-trace

# איפה הרכבת צוברת איחור, ורכבות שבוטלו באמצע המסלול (שלמה 06.10) — tools/rail_trace.py.
# רץ אחרי המדד הלילי (rail-reliability), שמכין את הלו"ז של היום (rail/data/days). כל יום מוריד
# כ-1,600 צילומי-דקה של השידורים הגולמיים מהארכיון של דאטאבוס ב-S3 (כ-2 דקות ליום).

on:
  workflow_run:
    workflows: [rail-reliability]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '20 5 * * *'   # רשת ביטחון, אם ההפעלה אחרי המדד הלילי לא קרתה
  workflow_dispatch:
    inputs:
      from:
        description: 'FROM (YYYY-MM-DD) — ריק = 14 הימים האחרונים'
        required: false
      to:
        description: 'TO (YYYY-MM-DD)'
        required: false
      redo:
        description: 'חישוב מחדש גם לימים שכבר קיימים (1)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: rail-trace
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: בדיקות
        run: python3 -m unittest tests/test_rail_trace.py

      - name: מעקב דקה-אחר-דקה
        env:
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
          REDO: ${{ github.event.inputs.redo }}
          MAX_MIN: '240'
        run: |
          python3 -m pip install -q brotli
          python3 tools/rail_trace.py

      - name: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rail/data/trace
          git diff --cached --quiet && { echo "אין שינוי"; exit 0; }
          git commit -m "data: rail — איפה נצבר איחור ורכבות שבוטלו באמצע"
          ok=
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && { ok=1; break; }
            git rebase --abort 2>/dev/null || true
            echo "push rejected — retry $i"; sleep 15
          done
          [ -n "$ok" ] || { echo "הדחיפה נכשלה"; exit 1; }
