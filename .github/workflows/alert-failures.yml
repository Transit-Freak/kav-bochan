name: alert-failures

# התראה בעברית למייל כשצינור חשוב נכשל (שלמה 05.10): "האם אפשר שברגע שיש תקלה כזו
# אני אקבל הודעה מובנת בעברית למייל ומה הייתה התקלה?"
# בלי שרת מייל: tools/alert_failures.py פותח Issue (אחד לכל צינור) שמזכיר את בעל המאגר,
# ו-GitHub שולח אותו למייל. תקלה חוזרת = תגובה באותו Issue; ריצה מוצלחת סוגרת אותו.
# workflow_run מופעל מיד כשהריצה מסתיימת — לא מתעכב כמו cron.
# בנוסף, בדיקה כל שעתיים שהנתונים באתר לא ישנים (מדד הדיוק, הקו בזמן, הקו המודיע) גם כשאף ריצה לא נכשלה.
#
# מ-10.11 (שלמה: "שהוא יגיע בסוף היום אם משהו לא הצליח"): אין מייל על כל תקלה. פעם ביום, בערך ב-21:00 בישראל,
# נשלח סיכום אחד — רק מה שעדיין לא תקין בסוף היום. אם הכל תקין, אין מייל.

on:
  schedule:
    - cron: '50 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/alert_failures.py
            bus/data/index.json
            line-history/data/lines.json
            alerts/data/report.json
          sparse-checkout-cone-mode: false
      - name: התראה
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/alert_failures.py --digest
