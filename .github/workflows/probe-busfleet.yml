name: probe-busfleet (temp)
on:
  push:
    branches: [claude/stoic-allen-3g21ru]
    paths: ['.github/workflows/probe-busfleet.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: bus_fleet columns
        run: |
          python3 - <<'PY'
          import json, urllib.request, collections
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'}), timeout=60))
          for ds in ['bus_fleet', 'kli_rechev_ciburiim']:
              p = get('https://data.gov.il/api/3/action/package_show?id=' + ds)['result']
              for r in p['resources']:
                  if not r.get('datastore_active'): continue
                  d = get('https://data.gov.il/api/3/action/datastore_search?resource_id=%s&limit=5000' % r['id'])['result']
                  print('=====', ds, r['id'], r.get('name'), 'total', d.get('total'))
                  for f in d['fields']:
                      vals = collections.Counter(str(x.get(f['id']))[:30] for x in d['records'])
                      print(' ', f['id'], '|', len(vals), 'distinct |', vals.most_common(6))
          PY
