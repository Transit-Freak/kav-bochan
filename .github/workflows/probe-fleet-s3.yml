name: probe-fleet-s3

# בדיקה זמנית (ענף probe בלבד): איך נסיעות ה-API נבנות מקובצי ה-SIRI
on:
  push:
    branches: ['probe-fleet-s3']

jobs:
  dig:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - run: pip install -q brotli
      - name: רכבים לדוגמה
        run: |
          python3 - <<'PYEOF'
          import collections, sys, json, datetime, urllib.request, urllib.parse, brotli
          sys.path.insert(0, 'tools')
          import siri_s3, bus_speed
          from concurrent.futures import ThreadPoolExecutor
          API = 'https://open-bus-stride-api.hasadna.org.il'
          def get(p, **q):
              with urllib.request.urlopen(f'{API}{p}?' + urllib.parse.urlencode(q), timeout=120) as r:
                  return json.load(r)
          day = '2026-10-28'
          V = ['9292601', '82748601', '18378304', '62965603', '51433903']
          for v in V:
              rows = get('/siri_rides/list', limit=200, vehicle_refs=v,
                         scheduled_start_time_from=f'{day}T00:00:00+02:00', scheduled_start_time_to=f'{day}T23:59:59+02:00')
              print('API', v, len(rows))
              for r in sorted(rows, key=lambda r: r['scheduled_start_time']):
                  print('  ', {k: r.get(k) for k in r if not k.startswith('updated') and r.get(k) is not None})
          print(json.dumps(get('/siri_rides/list', limit=1), ensure_ascii=False))
          ks = siri_s3.keys(day)
          recs = collections.defaultdict(list)
          with ThreadPoolExecutor(20) as ex:
              for k, b in zip(ks, ex.map(bus_speed.fetch, ks)):
                  if not b: continue
                  j = json.loads(brotli.decompress(b))
                  for sd in j['Siri']['ServiceDelivery']['StopMonitoringDelivery']:
                      for x in sd.get('MonitoredStopVisit') or []:
                          mj = x['MonitoredVehicleJourney']
                          if mj.get('VehicleRef') in V:
                              fr = mj.get('FramedVehicleJourneyRef') or {}
                              recs[(mj.get('VehicleRef'), mj.get('LineRef'), fr.get('DatedVehicleJourneyRef'), fr.get('DataFrameRef'),
                                    mj.get('OriginAimedDepartureTime'))].append((k[8:16], x['RecordedAtTime'][11:19],
                                    (mj.get('MonitoredCall') or {}).get('Order')))
          for k, v in sorted(recs.items(), key=lambda x: (x[0][0], x[1][0])):
              print('S3', k, len(v), 'distinct rec', len({a[1] for a in v}), v[0], v[-1])
          PYEOF
