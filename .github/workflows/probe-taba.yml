name: probe-taba

# ניסיון: האם תב"ע של מסילות (תת"ל) זמינה כנתונים קריאים — מנהרות/חתכים/גשרים (שלמה 20.09)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: כלים
        run: sudo apt-get install -y -q poppler-utils >/dev/null
      - name: ניסיון
        run: python3 tools/probe_taba.py
