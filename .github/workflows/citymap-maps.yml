name: citymap-maps

# מפות רשת סכמטיות לכל עיר (ניסוי): חילוץ קווים עירוניים מ-GTFS + רינדור
# מפה סטטית לכל עיר. רץ שבועי — רשתות הקווים משתנות לאט.
# (דחיפה חוזרת: שרת ה-GTFS של משרד התחבורה לא הגיב בריצה הקודמת)

on:
  schedule:
    - cron: '30 3 * * 5'
  push:
    paths:
      - '.github/workflows/citymap-maps.yml'
      - 'tools/citymap.py'
      - 'tools/citymap-render.py'
      - 'tools/citymap-build.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # קבוצה נפרדת לכל ref: ריצת ה-push של סנכרון הענף (שמדלגת בגלל תנאי
  # main-בלבד) נכנסת לקבוצה לפני שהתנאי נבדק — בלי זה היא מבטלת את ריצת main
  group: citymap-maps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GTFS
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          curl -fSL --connect-timeout 20 --max-time 1800 --retry 15 --retry-all-errors --retry-delay 60 -A "$UA" \
            -o gtfs.zip "https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip"
          # shapes.txt (המסלול האמיתי) ו-calendar.txt (נסיעות בשבוע). הכול יחד כ-1GB פרוס,
          # מול כ-14GB פנויים ב-runner; ה-zip נמחק מיד אחרי החילוץ.
          unzip -o gtfs.zip stops.txt stop_times.txt trips.txt routes.txt shapes.txt calendar.txt agency.txt
          rm -f gtfs.zip
          df -h . | tail -1

      - name: Fetch POI layer (osm-poi branch)
        run: |
          set -euo pipefail
          git fetch origin osm-poi --depth 1
          git show origin/osm-poi:poi.json > poi.json

      - name: Extract city lines
        run: |
          set -euo pipefail
          OUTDIR=/tmp/citydata python3 tools/citymap.py

      - name: Render maps
        run: |
          set -euo pipefail
          # כל עיר בכל רמות התצוגה (פנימיים / + מטרופוליניים / כל הקווים); דפים ישנים נמחקים
          rm -rf unreleased/citymap/maps
          POI=poi.json python3 tools/citymap-build.py /tmp/citydata unreleased/citymap/maps
          cp /tmp/citydata/cities.json unreleased/citymap/cities.json
          ls unreleased/citymap/maps | head -50

      - name: Push extracted city data (citymap-data branch)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/dataw
          git worktree add --detach /tmp/dataw
          cd /tmp/dataw
          git checkout --orphan citymap-data
          git rm -rf --quiet . || true
          cp /tmp/citydata/*.json .
          git add -A
          git commit -m "data: citymap extracted city lines"
          git push -f origin citymap-data

      - name: Commit maps to main
        run: |
          set -euo pipefail
          rm -f gtfs.zip stops.txt stop_times.txt trips.txt routes.txt shapes.txt calendar.txt agency.txt poi.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main עלול לזוז בזמן הריצה — שומרים פלט, מתעדכנים, מחילים ודוחפים (עם ניסיונות חוזרים)
          rm -rf /tmp/out-citymap && mkdir -p /tmp/out-citymap
          cp -r unreleased/citymap/maps /tmp/out-citymap/maps
          cp unreleased/citymap/cities.json /tmp/out-citymap/cities.json
          for i in 1 2 3 4; do
            git fetch origin main && git reset --hard origin/main
            mkdir -p citymap
            rm -rf unreleased/citymap/maps
            cp -r /tmp/out-citymap/maps unreleased/citymap/maps
            cp /tmp/out-citymap/cities.json unreleased/citymap/cities.json
            git add unreleased/citymap/maps unreleased/citymap/cities.json
            if git diff --cached --quiet; then
              echo "maps unchanged — nothing to commit"; break; fi
            git commit -m "data: refresh citymap network maps"
            if git push origin HEAD:main; then break; fi
            echo "push rejected (main moved) — retry $i"; sleep 10
          done
