name: fetch-mavat-docs

# רשימת מסמכי תוכנית במב"ת (דף פומבי, דרך דפדפן אמיתי כמו משתמש): לוחצים על הלשונית
# "מסמכי התכנית" ושומרים את הטבלה ואת קישורי ההורדה. לא ניגשים ל-GIS (שלמה 20.09).

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'כתובת דף התוכנית במב"ת'
        required: true
      out:
        description: 'קובץ יעד'
        required: true
        default: 'docs/fetched/taba/mavat-docs.txt'
      download:
        description: 'טקסטים של שורות להורדה, מופרדים ב-;; (למשל "נספח חתך לאורך מסילה - חתום לאישור")'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: דפדפן
        run: |
          npm init -y >/dev/null
          npm install --silent playwright@1.47.2
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: לשונית המסמכים
        env:
          U: ${{ inputs.url }}
          OUT: ${{ inputs.out }}
          DL: ${{ inputs.download }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -q poppler-utils >/dev/null
          mkdir -p "$(dirname "$OUT")"
          cat > fetch.js <<'EOF'
          const { chromium } = require('playwright'); const fs = require('fs');
          (async () => {
            const b = await chromium.launch(); const ctx = await b.newContext({ locale: 'he-IL', acceptDownloads: true, userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36' });
            const pg = await ctx.newPage(); const nets = [];
            pg.on('response', async (r) => { try { const ct = r.headers()['content-type'] || ''; if (/json/.test(ct) && /mavat/.test(r.url())) { const t = await r.text(); nets.push(`--- ${r.url()} (${t.length})\n${t.slice(0, 20000)}`); } } catch (e) {} });
            await pg.goto(process.env.U, { waitUntil: 'networkidle', timeout: 90000 }); await pg.waitForTimeout(3000);
            // לחיצה על הלשונית "מסמכי התכנית"
            const tab = pg.getByText('מסמכי התכנית', { exact: false }).first();
            try { await tab.click({ timeout: 15000 }); console.log('לחצתי על הלשונית'); } catch (e) { console.log('לחיצה נכשלה:', e.message.slice(0, 120)); }
            await pg.waitForTimeout(6000);
            // "קרא עוד" / הרחבות
            for (const t of ['הצג הכל', 'עוד', 'הרחב']) { try { const el = pg.getByText(t, { exact: false }).first(); if (await el.count()) await el.click({ timeout: 3000 }); } catch (e) {} }
            await pg.waitForTimeout(2000);
            // הורדות: לכל טקסט שורה — מוצאים את השורה ולוחצים על כפתור/קישור ההורדה שבה
            const dir = require('path').dirname(process.env.OUT);
            for (const want of (process.env.DL || '').split(';;').map(s => s.trim()).filter(Boolean)) {
              try {
                // מהטקסט למעלה: ההורה הראשון שמכיל אלמנט לחיץ — זו השורה; מסמנים את הלחיצים שבה
                const info = await pg.evaluate((want) => {
                  const all = [...document.querySelectorAll('body *')].filter(e => e.children.length === 0 && (e.textContent || '').includes(want));
                  if (!all.length) return null;
                  let el = all[0], depth = 0;
                  while (el && depth < 8) {
                    const cl = el.querySelectorAll('a, button, [role=button], img, svg, i, [class*=download], [class*=Download], [ng-click], [onclick]');
                    if (cl.length) { [...cl].forEach((c, k) => c.setAttribute('data-kb-click', want.slice(0, 20) + '#' + k)); return { depth, n: cl.length, html: el.outerHTML.slice(0, 2500) }; }
                    el = el.parentElement; depth++;
                  }
                  return { depth, n: 0, html: (all[0].parentElement || all[0]).outerHTML.slice(0, 1500) };
                }, want);
                console.log('שורה:', want, '→', info ? `נמצאה · לחיצים: ${info.n} · עומק ${info.depth}` : 'לא נמצאה');
                if (info) console.log('  HTML:', info.html.replace(/\s+/g, ' ').slice(0, 1200));
                if (!info || !info.n) continue;
                let done = false;
                for (let k = info.n - 1; k >= 0 && !done; k--) {
                  const sel = `[data-kb-click="${want.slice(0, 20)}#${k}"]`;
                  const tag = await pg.evaluate((sel) => { const e = document.querySelector(sel); return e ? e.tagName + ' ' + (e.className || '').toString().slice(0, 60) + ' ' + (e.getAttribute('href') || e.getAttribute('title') || e.getAttribute('aria-label') || '') : ''; }, sel);
                  try {
                    // לחיצה דרך JS (האלמנט מוסתר בקבוצה מכווצת) — תופסים הורדה או חלון חדש
                    const race = Promise.race([
                      pg.waitForEvent('download', { timeout: 15000 }).then(d => ({ kind: 'download', d })),
                      ctx.waitForEvent('page', { timeout: 15000 }).then(p => ({ kind: 'popup', p })),
                    ]);
                    await pg.evaluate((sel) => { const e = document.querySelector(sel); e.scrollIntoView(); e.click(); }, sel);
                    const ev = await race;
                    if (ev.kind === 'download') {
                      const name = (ev.d.suggestedFilename() || ('doc_' + Date.now())).replace(/[^\w.\-֐-׿]/g, '_');
                      const dest = dir + '/' + name; await ev.d.saveAs(dest);
                      console.log('  הורד:', name, require('fs').statSync(dest).size, 'בתים', '(', tag, ')'); done = true;
                    } else {
                      await ev.p.waitForLoadState('domcontentloaded').catch(() => {});
                      const u = ev.p.url(); console.log('  חלון חדש:', u.slice(0, 200));
                      const r = await ctx.request.get(u, { timeout: 120000 }); const body = await r.body();
                      console.log('  תוכן:', r.status(), r.headers()['content-type'], body.length, 'בתים');
                      if (body.slice(0, 4).toString() === '%PDF') { const name = 'mavat_' + (u.match(/[?&]fn=([^&]+)/) || [0, 'doc_' + Date.now()])[1].replace(/[^\w.\-֐-׿]/g, '_'); const dest = dir + '/' + (name.endsWith('.pdf') ? name : name + '.pdf'); require('fs').writeFileSync(dest, body); console.log('  נשמר', dest); done = true; }
                      await ev.p.close().catch(() => {});
                    }
                  } catch (e) { console.log('  לחיץ', k, '(', tag, ') לא הוריד:', e.message.slice(0, 80)); }
                }
              } catch (e) { console.log('  שגיאה:', e.message.slice(0, 150)); }
            }
            const text = await pg.evaluate(() => document.body.innerText);
            const links = await pg.$$eval('a[href], button, [onclick]', els => els.map(e => (e.innerText || '').trim().replace(/\s+/g, ' ').slice(0, 80) + ' | ' + (e.href || e.getAttribute('onclick') || e.getAttribute('data-url') || '')).filter(s => s.length > 5));
            const rows = await pg.$$eval('table tr, [role=row], .row, li', els => els.map(e => (e.innerText || '').trim().replace(/\s+/g, ' ')).filter(s => /נספח|תשריט|הוראות|חתך|תנוחה/.test(s)).slice(0, 300));
            fs.writeFileSync(process.env.OUT, `מקור: ${process.env.U}\nהורד: ${new Date().toLocaleString('he-IL', { timeZone: 'Asia/Jerusalem' })}\n\n===== שורות מסמכים =====\n${rows.join('\n')}\n\n===== טקסט =====\n${text}\n\n===== קישורים/כפתורים =====\n${links.join('\n')}\n\n===== תשובות רשת (JSON) =====\n${nets.join('\n\n')}\n`);
            await b.close();
          })();
          EOF
          node fetch.js
          wc -c "$OUT"
          for f in "$(dirname "$OUT")"/*.pdf; do
            [ -f "$f" ] || continue
            case "$f" in *9423881_40_2.pdf) continue;; esac
            echo "=== $f"; pdfinfo "$f" | grep -E "Pages|Page size|Producer|Creator" || true
            pdftotext -layout "$f" "${f%.pdf}.txt" || true
            pdftotext -bbox-layout "$f" "${f%.pdf}.bbox.html" || true
            echo "טקסט: $(wc -c < "${f%.pdf}.txt") בתים · מילים עם מנהרה/חתך/פורטל: $(grep -cE 'מנהר|חתך|פורטל' "${f%.pdf}.txt" || true) · מספרי רשת (6 ספרות): $(grep -oE '\b[12][0-9]{5}\b' "${f%.pdf}.txt" | wc -l)"
            # קבצים גדולים לא נכנסים למאגר — רק הטקסט
            [ "$(stat -c %s "$f")" -lt 45000000 ] || rm -f "$f"
          done
      - name: שמירה
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$(dirname "${{ inputs.out }}")"
          git diff --cached --quiet && { echo "ללא שינוי"; exit 0; }
          git commit -m "docs: רשימת מסמכי תוכנית ממב\"ת — ${{ inputs.out }}"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push origin HEAD:main && break || sleep $((5 * i)); done
