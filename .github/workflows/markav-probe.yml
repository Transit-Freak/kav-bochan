name: markav-probe
# בדיקה זמנית — יימחק אחרי הבדיקה
on:
  push:
    branches: [claude/stoic-allen-3g21ru]
    paths: ['.github/workflows/markav-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36'
    steps:
      - name: history
        continue-on-error: true
        run: |
          for id in 10006 10003 10010; do
            for p in RidershipHistoryDL timeseriesDL; do
              echo "=== $p $id"; curl -sSL -A "$UA" -D h -o o "https://markav.net/$p?q=$id"; grep -iE '^(HTTP|content-type|content-disposition)' h; head -c 1500 o; echo
            done
            sleep 2
          done
