name: markav-probe
# בדיקה זמנית — יימחק אחרי הבדיקה
on:
  push:
    branches: [claude/stoic-allen-3g21ru]
    paths: ['.github/workflows/markav-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36'
    steps:
      - name: weekly
        continue-on-error: true
        run: |
          for id in 10003 10010 10001 10002 10004 10005 10011 10012; do
            curl -sSL -A "$UA" -o l.html "https://markav.net/line/$id/"
            echo "$id $(python3 -c 'import re,sys;t=open("l.html").read();t=re.sub(r"<[^>]+>"," ",t);m=re.search(r"נוסעים בשבוע\s*:\s*([\d,\.]+)",t);print(m.group(1) if m else "-")')"
            sleep 2
          done
