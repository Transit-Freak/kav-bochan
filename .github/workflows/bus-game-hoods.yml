name: bus-game-hoods
# משחק האוטובוס (unreleased/bus-game): שכונות קריית מלאכי וגבול העיר מ-OpenStreetMap (ובדיקה קצרה של אזורים סטטיסטיים ב-ArcGIS).
# Overpass חסום מסביבת העבודה, לכן ההורדה רצה כאן והפלט נשמר בענף claude/bus-game (world/hoods_raw.json.gz).
on:
  push:
    branches: [claude/bus-game]
    paths: [.github/workflows/bus-game-hoods.yml]
  workflow_dispatch:
    inputs:
      arcgis:
        description: 'כתובת שאילתת ArcGIS (query) לאזורים סטטיסטיים — לא חובה'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: bus-game-hoods-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: unreleased/bus-game/world, fetch-depth: 1}
      - name: Overpass
        run: |
          set -euo pipefail
          B='31.690,34.700,31.770,34.790'
          Q="[out:json][timeout:300];
          (relation[boundary=administrative](31.690,34.700,31.770,34.790);
           node[place]($B); way[place]($B); relation[place]($B);
           way[landuse=residential]($B); relation[landuse=residential]($B);
           relation[landuse]($B);
           way[boundary]($B); relation[boundary~\"^(administrative|place|neighbourhood|statistical)\$\"]($B););
          out geom qt;"
          Q=$(echo "$Q" | tr '\n' ' ' | sed "s/(\$B)/($B)/g")
          ok=0
          for ep in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass-api.de/api/interpreter; do
            echo "== $ep"
            if curl -fsS --max-time 300 -A "kav-bochan-bus-game/1.0 (https://kavbochan.app)" --data-urlencode "data=$Q" "$ep" -o hoods.json; then ok=1; break; fi
            sleep 30
          done
          [ "$ok" = 1 ]
          python3 - <<'EOF'
          import json, collections
          d = json.load(open('hoods.json'))
          print(len(d['elements']), 'elements')
          for e in d['elements']:
              t = e.get('tags', {})
              if 'place' in t or t.get('boundary') or t.get('landuse') == 'residential' and t.get('name'):
                  print(e['type'], e['id'], t.get('place') or t.get('boundary') or t.get('landuse'), t.get('admin_level', ''), t.get('name:he') or t.get('name'), '|', t.get('name:en', ''))
          EOF
          gzip -9 -c hoods.json > unreleased/bus-game/world/hoods_raw.json.gz
      - name: ArcGIS (statistical areas, brief)
        continue-on-error: true
        env:
          ARC: ${{ github.event.inputs.arcgis }}
        run: |
          for q in "statistical%20areas%20israel" "%D7%90%D7%96%D7%95%D7%A8%D7%99%D7%9D%20%D7%A1%D7%98%D7%98%D7%99%D7%A1%D7%98%D7%99%D7%99%D7%9D" "%D7%A9%D7%9B%D7%95%D7%A0%D7%95%D7%AA%20%D7%A7%D7%A8%D7%99%D7%99%D7%AA%20%D7%9E%D7%9C%D7%90%D7%9B%D7%99" "neighborhoods%20israel" "stat%20areas%20cbs"; do
            echo "== search $q"
            curl -sS --max-time 40 "https://www.arcgis.com/sharing/rest/search?q=$q&f=json&num=25" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for r in d.get('results',[]): print(r.get('type'),'|',r.get('title'),'|',r.get('owner'),'|',r.get('url'),'|',r.get('id'))" || true
          done
          if [ -n "$ARC" ]; then
            curl -sS --max-time 120 "$ARC" -o arc.json && ls -la arc.json && head -c 600 arc.json && gzip -9 -c arc.json > unreleased/bus-game/world/hoods_arcgis.json.gz
          fi
      - name: Save
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add unreleased/bus-game/world/hoods_raw.json.gz
          [ -f unreleased/bus-game/world/hoods_arcgis.json.gz ] && git add unreleased/bus-game/world/hoods_arcgis.json.gz
          git commit -qm "משחק האוטובוס: שכונות קריית מלאכי מ-OpenStreetMap" || exit 0
          git push -q origin HEAD:claude/bus-game || { git fetch -q --deepen 50 origin claude/bus-game && git rebase -q FETCH_HEAD && git push -q origin HEAD:claude/bus-game; }
