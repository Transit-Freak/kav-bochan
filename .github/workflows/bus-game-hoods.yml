name: bus-game-hoods
# משחק האוטובוס (unreleased/bus-game): שכונות קריית מלאכי וגבול העיר מ-OpenStreetMap (ובדיקה קצרה של אזורים סטטיסטיים ב-ArcGIS).
# Overpass חסום מסביבת העבודה, לכן ההורדה רצה כאן והפלט נשמר בענף claude/bus-game (world/hoods_raw.json.gz).
on:
  push:
    branches: [claude/bus-game]
    paths: [.github/workflows/bus-game-hoods.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bus-game-hoods-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: unreleased/bus-game/world, fetch-depth: 1}
      - name: Overpass
        run: |
          set -euo pipefail
          B='31.690,34.700,31.770,34.790'
          Q="[out:json][timeout:300];
          (relation[boundary=administrative](31.690,34.700,31.770,34.790);
           node[place]($B); way[place]($B); relation[place]($B);
           way[landuse=residential]($B); relation[landuse=residential]($B);
           relation[landuse]($B);
           way[boundary]($B); relation[boundary~\"^(administrative|place|neighbourhood|statistical)\$\"]($B););
          out geom qt;"
          Q=$(echo "$Q" | tr '\n' ' ' | sed "s/(\$B)/($B)/g")
          ok=0
          for ep in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass-api.de/api/interpreter; do
            echo "== $ep"
            if curl -fsS --max-time 300 -A "kav-bochan-bus-game/1.0 (https://kavbochan.app)" --data-urlencode "data=$Q" "$ep" -o hoods.json; then ok=1; break; fi
            sleep 30
          done
          [ "$ok" = 1 ]
          python3 - <<'EOF'
          import json, collections
          d = json.load(open('hoods.json'))
          print(len(d['elements']), 'elements')
          for e in d['elements']:
              t = e.get('tags', {})
              if 'place' in t or t.get('boundary') or t.get('landuse') == 'residential' and t.get('name'):
                  print(e['type'], e['id'], t.get('place') or t.get('boundary') or t.get('landuse'), t.get('admin_level', ''), t.get('name:he') or t.get('name'), '|', t.get('name:en', ''))
          EOF
          gzip -9 -c hoods.json > unreleased/bus-game/world/hoods_raw.json.gz
      - name: ArcGIS (CBS neighbourhoods / statistical areas, brief)
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, re, gzip, urllib.request, urllib.parse
          def get(u, t=60):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'kav-bochan-bus-game/1.0'}), timeout=t)
              return json.loads(r.read().decode('utf-8'))
          ENV = '34.70,31.69,34.79,31.77'
          svcs = []
          for org in ['https://services2.arcgis.com/xMRYm7cNgdR5RN6F/arcgis/rest/services']:
              try:
                  d = get(org + '?f=json')
                  for s in d.get('services', []):
                      print('svc', s.get('name'), s.get('type'))
                      if s.get('type') == 'FeatureServer' and re.search(r'shchun|neigh|stat|shchunot|schun', s.get('name', ''), re.I):
                          svcs.append(s['url'])
              except Exception as e: print('list fail', org, e)
          svcs += ['https://services8.arcgis.com/JcXY3lLZni6BK4El/arcgis/rest/services/statistical_areas_2022/FeatureServer',
                   'https://services.arcgis.com/b6zSqPB0TQc3mBgU/arcgis/rest/services/' + urllib.parse.quote('מפקד_2022') + '/FeatureServer']
          out = {}
          for u in svcs:
              try:
                  meta = get(u + '?f=json')
                  for L in meta.get('layers', [])[:4]:
                      q = u + '/%d/query?' % L['id'] + urllib.parse.urlencode({'geometry': ENV, 'geometryType': 'esriGeometryEnvelope', 'inSR': 4326,
                          'spatialRel': 'esriSpatialRelIntersects', 'outFields': '*', 'outSR': 4326, 'f': 'geojson', 'resultRecordCount': 400})
                      g = get(q, 120)
                      fs = g.get('features', [])
                      print('==', u, L['id'], L.get('name'), len(fs), 'features')
                      for f in fs[:60]:
                          pr = f.get('properties', {})
                          print('   ', json.dumps({k: v for k, v in pr.items() if v not in (None, '') and not str(k).lower().startswith('shape')}, ensure_ascii=False)[:400])
                      if fs: out[u + '/%d' % L['id']] = g
              except Exception as e: print('fail', u, e)
          if out:
              json.dump(out, gzip.open('unreleased/bus-game/world/hoods_arcgis.json.gz', 'wt', encoding='utf-8'), ensure_ascii=False)
          EOF
      - name: Save
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add unreleased/bus-game/world/hoods_raw.json.gz
          [ -f unreleased/bus-game/world/hoods_arcgis.json.gz ] && git add unreleased/bus-game/world/hoods_arcgis.json.gz
          git commit -qm "משחק האוטובוס: שכונות קריית מלאכי מ-OpenStreetMap" || exit 0
          git push -q origin HEAD:claude/bus-game || { git fetch -q --deepen 50 origin claude/bus-game && git rebase -q FETCH_HEAD && git push -q origin HEAD:claude/bus-game; }
