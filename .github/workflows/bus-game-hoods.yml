name: bus-game-hoods
# משחק האוטובוס (unreleased/bus-game): גבולות השכונות של קריית מלאכי.
# OSM (Overpass): שמות השכונות (נקודות), גבול העיר, המושבים ← world/hoods_raw.json.gz
# הלמ"ס (ArcGIS Online): האזורים הסטטיסטיים 2022 ומפקד 2022 ← world/hoods_cbs.json.gz
# שניהם חסומים מסביבת העבודה, לכן ההורדה רצה כאן והפלט נשמר בענף claude/bus-game. הבנייה: tools/build_demand.py
on:
  push:
    branches: [claude/bus-game]
    paths: [.github/workflows/bus-game-hoods.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bus-game-hoods-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: unreleased/bus-game/world, fetch-depth: 1}
      - name: Overpass
        run: |
          set -euo pipefail
          B='31.690,34.700,31.770,34.790'
          Q="[out:json][timeout:300];
          (relation[boundary=administrative](31.690,34.700,31.770,34.790);
           node[place]($B); way[place]($B); relation[place]($B);
           way[landuse=residential]($B); relation[landuse=residential]($B);
           relation[landuse]($B);
           way[boundary]($B); relation[boundary~\"^(administrative|place|neighbourhood|statistical)\$\"]($B););
          out geom qt;"
          Q=$(echo "$Q" | tr '\n' ' ' | sed "s/(\$B)/($B)/g")
          ok=0
          for ep in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass-api.de/api/interpreter; do
            echo "== $ep"
            if curl -fsS --max-time 300 -A "kav-bochan-bus-game/1.0 (https://kavbochan.app)" --data-urlencode "data=$Q" "$ep" -o hoods.json; then ok=1; break; fi
            sleep 30
          done
          [ "$ok" = 1 ]
          python3 - <<'EOF'
          import json, collections
          d = json.load(open('hoods.json'))
          print(len(d['elements']), 'elements')
          for e in d['elements']:
              t = e.get('tags', {})
              if 'place' in t or t.get('boundary') or t.get('landuse') == 'residential' and t.get('name'):
                  print(e['type'], e['id'], t.get('place') or t.get('boundary') or t.get('landuse'), t.get('admin_level', ''), t.get('name:he') or t.get('name'), '|', t.get('name:en', ''))
          EOF
          gzip -9 -c hoods.json > unreleased/bus-game/world/hoods_raw.json.gz
      - name: CBS statistical areas 2022 (ArcGIS)
        # הלמ"ס: גבולות האזורים הסטטיסטיים 2022 (שכבה רשמית של ISRAEL_CBS_GIS ב-ArcGIS Online),
        # ומפקד 2022 לפי אזור סטטיסטי (אוכלוסייה ושימוש עיקרי). data.gov.il חסום מכאן — ArcGIS לא.
        run: |
          python3 - <<'EOF'
          import json, gzip, urllib.request, urllib.parse
          def get(u, t=120):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'kav-bochan-bus-game/1.0'}), timeout=t)
              return json.loads(r.read().decode('utf-8'))
          ENV = '34.70,31.69,34.79,31.77'
          def query(u, fields, geo):
              return get(u + '/query?' + urllib.parse.urlencode({'geometry': ENV, 'geometryType': 'esriGeometryEnvelope', 'inSR': 4326,
                  'spatialRel': 'esriSpatialRelIntersects', 'outFields': fields, 'outSR': 4326, 'returnGeometry': 'true' if geo else 'false',
                  'f': 'geojson', 'resultRecordCount': 500}))['features']
          AREAS = 'https://services2.arcgis.com/xMRYm7cNgdR5RN6F/ArcGIS/rest/services/Statistical__Areas_2022/FeatureServer/0'
          CENSUS = 'https://services.arcgis.com/b6zSqPB0TQc3mBgU/arcgis/rest/services/' + urllib.parse.quote('מפקד_2022') + '/FeatureServer/0'
          fs = query(AREAS, 'SEMEL_YISHUV,SHEM_YISHUV,STAT_2022,YISHUV_STAT_2022,COD_TIFKUD', True)
          cen = {f['properties']['YISHUV_STAT_2022']: f['properties'] for f in query(CENSUS, 'YISHUV_STAT_2022,pop_approx,Main_Function_Txt,Stat2022_Unite', False)}
          for f in fs:
              c = cen.get(f['properties']['YISHUV_STAT_2022'], {})
              f['properties'].update({k: c.get(k) for k in ('pop_approx', 'Main_Function_Txt', 'Stat2022_Unite')})
              print(f['properties'])
          out = {'type': 'FeatureCollection', 'source': {'areas': AREAS, 'census': CENSUS}, 'features': fs}
          json.dump(out, gzip.open('unreleased/bus-game/world/hoods_cbs.json.gz', 'wt', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
          EOF
          ls -la unreleased/bus-game/world
      - name: Save
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add unreleased/bus-game/world/hoods_raw.json.gz
          git add unreleased/bus-game/world/hoods_cbs.json.gz
          git commit -qm "משחק האוטובוס: שכונות קריית מלאכי (OSM והלמ\"ס)" || exit 0
          git push -q origin HEAD:claude/bus-game || { git fetch -q --deepen 50 origin claude/bus-game && git rebase -q FETCH_HEAD && git push -q origin HEAD:claude/bus-game; }
