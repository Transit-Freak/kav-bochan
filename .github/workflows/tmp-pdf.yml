name: tmp-pdf

# בדיקה זמנית: הורדת PDF מ"מצגת לשינוי בקו" (ענף claude/line-changes-pdf) עם אריחי מפה אמיתיים. יימחק אחרי הבדיקה.

on:
  push:
    branches: [claude/stoic-allen-3g21ru]
    paths: ['.github/workflows/tmp-pdf.yml']

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/stoic-allen-3g21ru
          sparse-checkout: |
            .github
          path: out
      - uses: actions/checkout@v4
        with:
          ref: claude/line-changes-pdf
          sparse-checkout: |
            line-changes
          sparse-checkout-cone-mode: true
          path: site
      - name: root files
        run: |
          cd site
          for f in home-link.js a11y.js version.js versions.json; do git show HEAD:$f > $f || true; done
          ls
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: browser
        run: |
          sudo apt-get install -y poppler-utils >/dev/null 2>&1
          mkdir pw && cd pw && npm init -y >/dev/null && npm install --silent playwright@1.47.2
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: pdf
        run: |
          (cd site && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          mkdir -p out/tmp-pdf
          cat > pw/run.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const b = await chromium.launch();
            const res = [];
            for (const [id, mob] of [['22029-20261117', 0], ['13054-20261116,10784-20261116,10791-20261116', 0], ['22029-20261117', 1],
              ['21059-20261120,17069-20261117,27076-20261117,32078-20261117,21094-20261117,11887-20261117,10982-20261117,10984-20261120,10985-20261117,10987-20261117,11994-20261117,10988-20261119,10357-20261120,14457-20261120', 0]]) {
              const ctx = await b.newContext(mob ? { viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, deviceScaleFactor: 3, acceptDownloads: true } : { viewport: { width: 1280, height: 900 }, acceptDownloads: true });
              const p = await ctx.newPage();
              const errs = []; p.on('pageerror', e => errs.push(e.message)); p.on('console', m => { if (m.type() === 'error') errs.push(m.text().slice(0, 300)); });
              await p.goto('http://localhost:8000/line-changes/index.html?c=' + id, { waitUntil: 'domcontentloaded' });
              await p.waitForFunction(() => document.querySelectorAll('.sframe').length > 0, null, { timeout: 60000 });
              await p.waitForTimeout(1500);
              const n = await p.evaluate(() => document.querySelectorAll('.sitem:not(.off)').length);
              const t = Date.now();
              let r = { id: id.slice(0, 40), mob, slides: n };
              try {
                const [d] = await Promise.all([p.waitForEvent('download', { timeout: 400000 }), p.click(mob ? '#dl2' : '#dl')]);
                const f = 'out/tmp-pdf/' + (mob ? 'mob-' : '') + d.suggestedFilename();
                await d.saveAs(f);
                r = Object.assign(r, { file: f, ms: Date.now() - t, size: fs.statSync(f).size, lp: await p.evaluate(() => window.LCApp.lastPdf) });
              } catch (e) { r.fail = String(e).slice(0, 300); }
              r.msg = await p.evaluate(() => document.querySelector('.dlmsg').textContent);
              r.errs = errs.slice(0, 8);
              res.push(r); console.log(JSON.stringify(r));
              await ctx.close();
            }
            fs.writeFileSync('out/tmp-pdf/result.json', JSON.stringify(res, null, 1));
            await b.close();
          })();
          JS
          LANG=C.UTF-8 NODE_PATH=$PWD/pw/node_modules node pw/run.cjs
          cd out/tmp-pdf
          for f in *.pdf; do pdfinfo "$f" | grep -E "Pages|Page size" >> info.txt; echo "$f" >> info.txt; done
          for f in *.pdf; do b=$(echo "$f" | md5sum | cut -c1-6); pdftoppm -r 96 -png -f 1 -l 3 "$f" "p-$b"; echo "$b $f" >> names.txt; done
          find . -name '*.pdf' -size +3M -delete
          ls -la
      - name: commit
        run: |
          cd out
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add --sparse tmp-pdf
          git commit -m "בדיקה זמנית: PDF עם אריחים אמיתיים"
          git push
