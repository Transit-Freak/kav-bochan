name: alerts-hist-probe
on:
  push:
    branches: [claude/stoic-allen-3g21ru]
    paths: ['.github/workflows/alerts-hist-probe.yml']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: wayback + old alerts
        run: |
          set +e
          UA="kavbochan.app alerts (research)"
          echo "== CDX: bus-alerts.com"
          curl -s -m 60 "https://web.archive.org/cdx/search/cdx?url=bus-alerts.com&matchType=domain&output=txt&fl=timestamp,original,statuscode,length&limit=400" | tee cdx.txt | head -120
          echo "lines: $(wc -l < cdx.txt)"
          echo "== CDX: all_alerts snapshots"
          curl -s -m 60 "https://web.archive.org/cdx/search/cdx?url=bus-alerts.com/api/all_alerts*&output=txt&fl=timestamp,original,statuscode,length" | head -50
          echo "== feed: ids, oldest first_start"
          curl -s -m 60 -A "$UA" https://bus-alerts.com/api/all_alerts -o all.json
          python3 - <<'PY'
          import json
          d=json.load(open('all.json'))['alerts']
          ids=sorted(int(a['id']) for a in d if str(a['id']).isdigit())
          print('n',len(d),'min id',ids[0],'max id',ids[-1])
          dl=[a for a in d if a.get('is_deleted')]
          print('deleted',len(dl),[ (a['id'],a.get('first_start_time')) for a in dl[:5]])
          print('oldest start',sorted(a.get('first_start_time') or '' for a in d)[:3])
          open('probe_ids.txt','w').write('\n'.join(str(i) for i in [ids[0]-1, ids[0]-1000, ids[0]-100000, ids[0]-10000000]))
          PY
          echo "== json/alert for a current id and nearby ids"
          ID=$(python3 -c "import json;d=json.load(open('all.json'))['alerts'];print(min(int(a['id']) for a in d if str(a['id']).isdigit()))")
          curl -s -m 30 -A "$UA" -o one.json -w "current $ID -> %{http_code} %{size_download}\n" "https://bus-alerts.com/api/json/alert/$ID"; head -c 600 one.json; echo
          for i in $(cat probe_ids.txt); do curl -s -m 30 -A "$UA" -o /dev/null -w "$i -> %{http_code} %{size_download}\n" "https://bus-alerts.com/api/json/alert/$i"; sleep 1; done
