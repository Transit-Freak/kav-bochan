name: bus-people-fingers
# ניסיון (שלב 1), 11.11: אדם אחד עם פרקי אצבעות. anim.py + fingers_rig.py מכאן, person_variants.py מהענף claude/bus-game,
# הייצוא — tools/blender-test/fingers/export_person.py (עותק של זה שבמשחק, עם שמירה על כפות הידיים בהקטנה).
# הפלט נשמר בענף הזה, ב-tools/blender-test/out_fingers.
on:
  push:
    branches: [claude/bus-people-fingers]
    paths: [.github/workflows/bus-people-fingers.yml, tools/blender-test/anim.py, tools/blender-test/fingers_rig.py, tools/blender-test/fingers/**]
permissions:
  contents: write
concurrency:
  group: bus-people-fingers
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: tools/blender-test}
      - uses: actions/checkout@v4
        with: {ref: claude/bus-game, path: game, sparse-checkout: unreleased/bus-game/tools}
      - name: Blender
        run: |
          set -e
          sudo apt-get update -q && sudo apt-get install -yq libxi6 libxkbcommon0 libsm6 libxrender1 libgl1 libegl1 libxxf86vm1 libxfixes3 > /dev/null
          V=$(curl -s https://download.blender.org/release/ | grep -oE 'Blender5\.[0-9]+' | sort -Vu | tail -1)
          F=$(curl -s https://download.blender.org/release/$V/ | grep -oE 'blender-5\.[0-9.]+-linux-x64\.tar\.xz' | sort -Vu | tail -1)
          echo "$V/$F"; curl -sL https://download.blender.org/release/$V/$F | tar -xJ -C $HOME
          echo "BL=$(ls -d $HOME/blender-*/)blender" >> $GITHUB_ENV
      - name: MPFB
        run: |
          $BL -b --factory-startup --online-mode --command extension sync || true
          $BL -b --online-mode --command extension install -s --enable mpfb || $BL -b --online-mode --command extension install --enable blender_org.mpfb
          UD=$($BL -b --online-mode --python-expr "import bpy;print('UD='+bpy.utils.extension_path_user('bl_ext.blender_org.mpfb', create=True))" | grep '^UD=' | cut -d= -f2)
          echo "UD=$UD"; mkdir -p "$UD/data"
          curl -sL -o /tmp/sa.zip http://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip && unzip -qo /tmp/sa.zip -d "$UD/data"
          # בדיקה לשלב מאוחר (חיוך): אילו מטרות הבעה יש ב-MPFB עצמו
          EXT=$(dirname "$UD")/../../extensions; find $HOME/.config/blender -type d \( -iname '*express*' -o -iname '*viseme*' -o -iname 'faceunits*' \) | head -10 || true
          find $HOME/.config/blender -iname '*smile*' | head -10 || true
      - name: CMU 16_15
        run: |
          git clone -q --depth=1 --filter=blob:none --sparse https://github.com/Shriinivas/cmubvh.git $HOME/cmubvh
          cd $HOME/cmubvh && Z=$(git ls-tree -r --name-only HEAD | grep -E '/16_15\.zip$') && git sparse-checkout set --no-cone "/$Z"
          mkdir -p $HOME/bvh && unzip -qo "$Z" -d $HOME/bvh && echo "BVH=$(find $HOME/bvh -name '*.bvh' | head -1)" >> $GITHUB_ENV
      - name: Person 0 with fingers
        working-directory: tools/blender-test
        run: |
          set -e
          G=$GITHUB_WORKSPACE/game/unreleased/bus-game; O=$PWD/out_fingers; mkdir -p out $O; rm -f $O/*
          python3 $G/tools/person_variants.py anim.py .
          n=0
          $BL -b --online-mode -P anim_$n.py 2>&1 | grep -E 'FINGERS|VARIANT|MATCHED|shoe floor|knee err|Error|Traceback|line [0-9]' | cut -c1-3000 || true
          ls -la out/anim_$n.blend
          for hr in 0.3 0.45 0.6; do
            echo "== hands ratio: $hr"
            PERSON_HANDS=$hr $BL -b --online-mode out/anim_$n.blend --python-exit-code 1 -P fingers/export_person.py -- $O/person_${n}_h$hr.glb 2>&1 | grep -E 'MESH base|WALK|TRIS|PERSON|Error|Traceback'
          done
          ls -la $O
      - uses: actions/upload-artifact@v4
        with: {name: person-fingers, path: tools/blender-test/out_fingers, retention-days: 7}
      - name: Save
        run: |
          cd tools/blender-test && git add -f out_fingers
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -qm "ניסיון אצבעות: ייצוא אדם 0 (מ-${GITHUB_SHA::9})" && git pull -q --rebase origin claude/bus-people-fingers && git push -q origin HEAD:claude/bus-people-fingers || true
