name: bus-game-assets
# משחק האוטובוס (unreleased/bus-game): ייצוא האוטובוס והאדם מ-Blender ל-GLB.
# קוד הבנייה (bus.py, anim.py, screens.py) נלקח מהענף claude/blender-test; קוד הייצוא — מכאן (unreleased/bus-game/tools).
# רץ רק בענף claude/bus-game. הפלט (unreleased/bus-game/assets) נשמר בענף נפרד, bus-game-assets — ראו בסוף.
on:
  push:
    branches: [claude/bus-game]
    paths: [.github/workflows/bus-game-assets.yml, unreleased/bus-game/tools/export_*.py, unreleased/bus-game/tools/person_variants.py]
  workflow_dispatch:
    inputs:
      bus: {description: 'לייצא גם את האוטובוס', type: boolean, default: false}
      only: {description: 'רק האנשים האלה (למשל 0,3)', type: string, default: ''}
permissions:
  contents: write
concurrency:
  group: bus-game-assets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: unreleased/bus-game}
      - uses: actions/checkout@v4
        with: {ref: claude/blender-test, path: bt, sparse-checkout: tools/blender-test}
      - name: Blender
        run: |
          set -e
          sudo apt-get update -q && sudo apt-get install -yq libxi6 libxkbcommon0 libsm6 libxrender1 libgl1 libegl1 libxxf86vm1 libxfixes3 > /dev/null
          V=$(curl -s https://download.blender.org/release/ | grep -oE 'Blender5\.[0-9]+' | sort -Vu | tail -1)
          F=$(curl -s https://download.blender.org/release/$V/ | grep -oE 'blender-5\.[0-9.]+-linux-x64\.tar\.xz' | sort -Vu | tail -1)
          echo "$V/$F"; curl -sL https://download.blender.org/release/$V/$F | tar -xJ -C $HOME
          echo "BL=$(ls -d $HOME/blender-*/)blender" >> $GITHUB_ENV
          git clone -q --depth=1 https://github.com/EL4CTEO/blender-skills.git $HOME/bsk
          echo "SK=$HOME/bsk/skills" >> $GITHUB_ENV
      - name: MPFB
        run: |
          $BL -b --factory-startup --online-mode --command extension sync || true
          $BL -b --online-mode --command extension install -s --enable mpfb || $BL -b --online-mode --command extension install --enable blender_org.mpfb
          UD=$($BL -b --online-mode --python-expr "import bpy;print('UD='+bpy.utils.extension_path_user('bl_ext.blender_org.mpfb', create=True))" | grep '^UD=' | cut -d= -f2)
          echo "UD=$UD"; mkdir -p "$UD/data"
          curl -sL -o /tmp/sa.zip http://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip && unzip -qo /tmp/sa.zip -d "$UD/data"
      - name: CMU 16_15
        run: |
          git clone -q --depth=1 --filter=blob:none --sparse https://github.com/Shriinivas/cmubvh.git $HOME/cmubvh
          cd $HOME/cmubvh && Z=$(git ls-tree -r --name-only HEAD | grep -E '/16_15\.zip$') && git sparse-checkout set --no-cone "/$Z"
          mkdir -p $HOME/bvh && unzip -qo "$Z" -d $HOME/bvh && echo "BVH=$(find $HOME/bvh -name '*.bvh' | head -1)" >> $GITHUB_ENV
      - name: Bus
        if: github.event_name == 'push' || inputs.bus
        working-directory: bt/tools/blender-test
        run: |
          set -e
          pip install -q pillow && mkdir -p out tex && python3 screens.py tex
          $BL -b --factory-startup --python-exit-code 1 -P bus.py 2>&1 | grep -E 'BUS|Error|Traceback' | tail -5
          $BL -b out/bus.blend --python-exit-code 1 -P $GITHUB_WORKSPACE/unreleased/bus-game/tools/export_bus.py -- $GITHUB_WORKSPACE/unreleased/bus-game/assets/bus.glb 2>&1 | grep -E 'EXPORT tris|BUS GLB|Error|Traceback'
      - name: People (walk 16_15 + idle)
        working-directory: bt/tools/blender-test
        run: |
          set -e
          # כמה אנשים שונים (tools/person_variants.py): anim.py בונה כל אחד ומעביר אליו את התנועה, וייצוא ל-assets/people
          G=$GITHUB_WORKSPACE/unreleased/bus-game; mkdir -p out $G/assets/people
          N=$(python3 $G/tools/person_variants.py anim.py .)
          ONLY="${{ inputs.only }}"
          for n in $(seq 0 $((N-1))); do
            if [ -n "$ONLY" ] && ! echo ",$ONLY," | grep -q ",$n,"; then continue; fi
            echo "::group::person $n"
            $BL -b --online-mode -P anim_$n.py 2>&1 | grep -E 'ASSETS|VARIANT|MATCHED|shoe floor|Error|Traceback' | cut -c1-6000 || true
            ls -la out/anim_$n.blend
            $BL -b --online-mode out/anim_$n.blend --python-exit-code 1 -P $G/tools/export_person.py -- $G/assets/people/person_$n.glb 2>&1 | grep -E 'MESH|WALK|IDLE|TRIS|IMG|EXPORT|PERSON|Error|Traceback'
            echo "::endgroup::"
          done
          (cd $G/assets/people && ls person_*.glb | sort -V | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin]))" > people.json && cat people.json)
      - name: Save
        # הפלט נשמר בענף נפרד, bus-game-assets, שאין לו PR — כדי שכל ייצוא לא ישלח מייל על ה-PR של המשחק.
        # מעבירים אותו למשחק ביד: git fetch --depth 1 origin bus-game-assets && git checkout FETCH_HEAD -- unreleased/bus-game/assets
        run: |
          ls -la unreleased/bus-game/assets
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          PARENT=$(git ls-remote origin refs/heads/bus-game-assets | cut -f1)
          if [ -n "$PARENT" ]; then git fetch -q --depth 1 origin bus-game-assets; fi
          export GIT_INDEX_FILE=$RUNNER_TEMP/assets.index
          git add -f unreleased/bus-game/assets
          TREE=$(git write-tree)
          if [ -n "$PARENT" ] && [ "$(git rev-parse $PARENT^{tree})" = "$TREE" ]; then echo 'no change'; exit 0; fi
          C=$(git commit-tree $TREE ${PARENT:+-p $PARENT} -m "משחק האוטובוס: ייצוא האנשים והאוטובוס מ-Blender (מ-${GITHUB_SHA::9})")
          git push -q origin $C:refs/heads/bus-game-assets
          echo "saved $C"
