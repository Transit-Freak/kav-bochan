name: kavpach-overlap
on:
  workflow_run:
    workflows: [line-history]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/overlap.py
      - tools/shape_overlap.py
      - tools/test_shape_overlap.py
      - .github/workflows/kavpach-overlap.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: kavpach-overlap
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 05.11: "No space left on device" — המאגר עם הארכיון ההיסטורי כבר גדול מהמקום הפנוי בשרת. מפנים כלים שלא בשימוש
      - name: מקום בדיסק
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Geometry overlap regression tests
        run: python3 -m unittest discover -s tools -p test_shape_overlap.py -v
      - name: Reuse daily GTFS or fetch current source
        env:
          GH_TOKEN: ${{ github.token }}
          GTFS_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kavpach-gtfs
          if [ -z "${GTFS_RUN_ID:-}" ]; then
            GTFS_RUN_ID=$(gh run list --workflow line-history.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if ! gh run download "$GTFS_RUN_ID" --name gtfs-daily --dir /tmp/kavpach-gtfs; then
            curl -fSL --connect-timeout 30 --max-time 1200 --retry 3 \
              https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip -o /tmp/kavpach-gtfs/gtfs.zip
          fi
          unzip -o /tmp/kavpach-gtfs/gtfs.zip trips.txt routes.txt stop_times.txt shapes.txt -d /tmp/kavpach-gtfs
      - name: Compute shared stops and directed shape lengths
        env:
          TRIPS: /tmp/kavpach-gtfs/trips.txt
          ROUTES: /tmp/kavpach-gtfs/routes.txt
          STOP_TIMES: /tmp/kavpach-gtfs/stop_times.txt
          SHAPES: /tmp/kavpach-gtfs/shapes.txt
          OUT: kavpach-overlap.json
        run: python3 tools/overlap.py
      - name: Publish overlap data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kavpach-overlap.json
          if git diff --cached --quiet; then exit 0; fi
          # 04.11: ה-rebase נתקע בהתנגשות על אותו קובץ (ריצה אחרת שמרה גרסה משלה). הקובץ נבנה כולו בריצה הזו —
          # שומרים עותק, עוברים ל-main העדכני ומעתיקים אותו מעליו
          cp kavpach-overlap.json /tmp/kavpach-overlap.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/kavpach-overlap.json kavpach-overlap.json
            git add kavpach-overlap.json
            git diff --cached --quiet && exit 0
            git commit -q -m 'data: refresh KavPach shared stops and directed geometry overlap'
            git push origin HEAD:main && exit 0
            echo "push rejected — retry $i"; sleep $((10 * i))
          done
          exit 1
