name: probe-holidays

# בדיקת תאריכי החגים (בקשת שלמה 07.09) לפני "שמות חגיגיים" — הפלט ללוג בלבד.
# ה-ICU של הדפדפן (node) מול ספריות ואתרים (tools/probe_holidays.py).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ICU (Intl, ca=hebrew) — מה שהאתר ישתמש בו
        run: |
          node -e '
          const f = new Intl.DateTimeFormat("en-u-ca-hebrew", { timeZone: "Asia/Jerusalem", year: "numeric", month: "long", day: "numeric" });
          const parts = (d) => { const o = {}; for (const p of f.formatToParts(d)) o[p.type] = p.value; return o; };
          const want = [["Tishri",1,"ראש השנה"],["Tishri",3,"צום גדליה"],["Tishri",10,"יום כיפור"],["Tishri",15,"סוכות"],["Tishri",22,"שמיני עצרת/שמחת תורה"],["Kislev",25,"חנוכה"],["Tevet",10,"עשרה בטבת"],["Shevat",15,"ט\"ו בשבט"],["Adar I",14,"פורים קטן (אדר א)"],["Adar II",13,"תענית אסתר"],["Adar II",14,"פורים"],["Adar",13,"תענית אסתר (שנה רגילה)"],["Adar",14,"פורים (שנה רגילה)"],["Nisan",15,"פסח"],["Nisan",21,"שביעי של פסח"],["Nisan",27,"יום השואה"],["Iyar",4,"יום הזיכרון"],["Iyar",5,"יום העצמאות"],["Iyar",18,"ל\"ג בעומר"],["Iyar",28,"יום ירושלים"],["Sivan",6,"שבועות"],["Tamuz",17,"י\"ז בתמוז"],["Av",9,"תשעה באב"]];
          const t0 = Date.UTC(2026, 8, 1);
          const days = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
          for (let i = 0; i < 560; i++) {
            const d = new Date(t0 + i * 864e5); const o = parts(d);
            for (const [m, day, name] of want) if (o.month === m && +o.day === day) console.log(d.toISOString().slice(0, 10), days[d.getUTCDay()], "=", o.day, o.month, o.year, "→", name);
          }'
      - name: ספריות ואתרים
        run: |
          pip install -q convertdate pyluach
          python3 tools/probe_holidays.py
