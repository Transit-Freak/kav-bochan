name: walk-probe (temporary)
on:
  push:
    branches: [claude/stoic-allen-3g21ru]
    paths: ['tmp-walk/**', '.github/workflows/walk-probe.yml']
jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tmp-walk
      - run: python3 tmp-walk/walk.py tmp-walk/pairs.json
