name: walk-probe (temporary)
on:
  push:
    branches: [claude/stoic-allen-3g21ru]
    paths: ['tmp-walk/**', '.github/workflows/walk-probe.yml']
permissions:
  contents: write
jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tmp-walk
      - run: python3 tmp-walk/walk.py tmp-walk/pairs.json | grep '^WALKJSON ' | cut -c10- > tmp-walk/out.json
      - run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add tmp-walk/out.json
          git commit -m 'walk-probe output [skip ci]'
          git push
