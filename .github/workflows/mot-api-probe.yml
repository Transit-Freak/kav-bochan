name: mot-api-probe
# בדיקה חד-פעמית: מקורות חלופיים לקבצי המפה של משרד התחבורה (data.gov.il חוסם את GitHub)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - shell: bash {0}
        run: |
          Z='https://data.gov.il/dataset/66ba64f9-f47c-4c0a-917f-e3cdaf1cf6b1/resource/8d4d11cc-0406-4cb4-8344-d2752b89e003/download/brt_line.zip'
          echo "== wayback availability"; curl -s "https://archive.org/wayback/available?url=$Z" ; echo
          echo "== wayback id_ fetch"; curl -sL -o /tmp/w.zip -w '%{http_code} %{size_download}\n' "https://web.archive.org/web/2026id_/$Z"; file /tmp/w.zip
          echo "== wayback save"; curl -s -m 120 -o /dev/null -w '%{http_code}\n' "https://web.archive.org/save/$Z"
          sleep 20; curl -sL -o /tmp/w2.zip -w '%{http_code} %{size_download}\n' "https://web.archive.org/web/2026id_/$Z"; file /tmp/w2.zip
          echo "== MOT ArcGIS"; for u in https://gisn.mot.gov.il/arcgis/rest/services?f=json https://geo.mot.gov.il/arcgis/rest/services?f=json https://gis.mot.gov.il/arcgis/rest/services?f=json https://services.arcgis.com/; do curl -s -m 20 -o /tmp/a -w "%{http_code} $u\n" "$u"; head -c 300 /tmp/a; echo; done
          echo "== ArcGIS Online search"; curl -s "https://www.arcgis.com/sharing/rest/search?q=%D7%9E%D7%A9%D7%A8%D7%93%20%D7%94%D7%AA%D7%97%D7%91%D7%95%D7%A8%D7%94%20BRT&f=json&num=10" | python3 -c "import json,sys;[print(r['type'],'|',r['title'],'|',r.get('owner'),'|',r.get('url')) for r in json.load(sys.stdin).get('results',[])]"
          curl -s "https://www.arcgis.com/sharing/rest/search?q=metro%20israel%20mot&f=json&num=10" | python3 -c "import json,sys;[print(r['type'],'|',r['title'],'|',r.get('owner'),'|',r.get('url')) for r in json.load(sys.stdin).get('results',[])]"
