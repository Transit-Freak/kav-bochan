name: stride-probe
# בדיקה חד-פעמית: המרווחים בין שידורי GPS של רכב אחד ב-Stride (שלמה 30.09)
on:
  workflow_dispatch:
    inputs:
      plate: { default: '23286602' }
      start: { default: '2026-09-30T05:30:00+03:00' }
      end:   { default: '2026-09-30T06:40:00+03:00' }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, datetime, os
          B='https://open-bus-stride-api.hasadna.org.il'
          def get(p, q):
              u=B+p+'?'+urllib.parse.urlencode(q)
              print('GET', u)
              return json.load(urllib.request.urlopen(u, timeout=60))
          q={'vehicle_refs': '${{ inputs.plate }}', 'recorded_at_time_from': '${{ inputs.start }}',
             'recorded_at_time_to': '${{ inputs.end }}', 'order_by': 'recorded_at_time asc', 'limit': 5000}
          rows=get('/siri_vehicle_locations/list', q)
          print('rows:', len(rows))
          ts=[]
          for r in rows:
              t=datetime.datetime.fromisoformat(r['recorded_at_time'].replace('Z','+00:00'))
              if not ts or t!=ts[-1]: ts.append(t)
          d=[(b-a).total_seconds() for a,b in zip(ts,ts[1:])]
          for a,x in zip(ts[1:],d): print(a.astimezone(datetime.timezone(datetime.timedelta(hours=3))).strftime('%H:%M:%S'), int(x))
          if d:
              s=sorted(d); print('distinct reports:', len(ts), '| mean', round(sum(d)/len(d),1), '| median', s[len(s)//2], '| min', s[0], '| max', s[-1])
          PY
