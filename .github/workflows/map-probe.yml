name: map-probe
# בדיקה זמנית — תימחק אחרי הבדיקה
on:
  push:
    branches: [claude/stoic-allen-3g21ru]
    paths: ['.github/workflows/map-probe.yml', 'tools/probe/**']
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow -q && python3 tools/probe/l8map.py tools/probe/l8.json tools/probe/l8-map.png
      - run: |
          git config user.name 'Claude'; git config user.email 'noreply@anthropic.com'
          git add tools/probe/l8-map.png && git commit -qm 'בדיקה זמנית: מפת קו 8' && git push
