name: kavpach-build

# קו פח — בנייה מראש בכל שינוי קוד (שלמה 18.09): KavPach.jsx → KavPach.js
# (Babel פעם אחת כאן במקום בכל דפדפן) ו-Tailwind → CSS מוכן, עם חותמת ?v=
# ב-index.html. תוצרי הבנייה מקומטים חזרה ל-main.

on:
  push:
    branches: [main]
    paths: ['KavPach.jsx', 'index.html', 'tools/build_kavpach.mjs']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kavpach-build
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: build
        run: |
          set -euo pipefail
          npm i --no-save --silent tailwindcss@3 terser
          node tools/build_kavpach.mjs
      - name: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KavPach.js vendor/kavpach.css index.html
          git diff --cached --quiet && { echo "אין שינוי"; exit 0; }
          git commit -m "build: קו פח — KavPach.js ו-CSS מוכנים מראש"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "push rejected — retry $i"; sleep 10
          done
