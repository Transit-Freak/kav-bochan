name: kavpach-build

# קו פח — בנייה וחישוב מוקדם בכל שינוי קוד או נתונים (שלמה 18.09): KavPach.jsx → KavPach.js,
# והצבירה לכל קו (tools/precompute_kavpach.mjs) → data-lines.json
# (Babel פעם אחת כאן במקום בכל דפדפן) ו-Tailwind → CSS מוכן, עם חותמת ?v=
# ב-index.html. תוצרי הבנייה מקומטים חזרה ל-main.

on:
  push:
    branches: [main]
    paths: ['KavPach.jsx', 'index.html', 'tools/build_kavpach.mjs', 'kavpach-core.js', 'xlsx-worker.js', 'tools/precompute_kavpach.mjs', 'data-main.json', 'data-schedule.json', 'data-benchmark.json']
  # עדכניות: הניקוד המוכן נשען על הארכיון, החפיפות והנסיעות התפעוליות — נבנה מחדש
  # אחרי כל אחד מהתהליכים שמעדכנים אותם, וגם לילית ליתר ביטחון
  workflow_run:
    workflows: [line-history, bus-reliability, kavpach-overlap]
    types: [completed]
  schedule:
    - cron: '45 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kavpach-build
  cancel-in-progress: true

jobs:
  build:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'build: קו פח') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: build
        run: |
          set -euo pipefail
          npm i --no-save --silent tailwindcss@3 terser
          node tools/build_kavpach.mjs
          # הצבירה לכל קו מחושבת כאן פעם אחת (במקום בכל טלפון) → data-lines.json
          node tools/precompute_kavpach.mjs
      - name: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KavPach.js vendor/kavpach.css index.html data-lines.json
          git diff --cached --quiet && { echo "אין שינוי"; exit 0; }
          git commit -m "build: קו פח — KavPach.js ו-CSS מוכנים מראש"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "push rejected — retry $i"; sleep 10
          done
