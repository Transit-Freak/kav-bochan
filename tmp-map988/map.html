<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;background:#fff;font-family:Arial,"Noto Sans Hebrew",sans-serif;color:#1d2421}
#hd{padding:22px 28px 10px}
h1{margin:0;font-size:34px}
.sub{font-size:22px;color:#555;margin-top:4px}
#map{width:1080px;height:1150px}
.leaflet-tooltip-pane{direction:ltr}.leaflet-tooltip{direction:rtl}
#lg{display:flex;flex-wrap:wrap;gap:10px 28px;padding:14px 28px;font-size:21px;border-top:1px solid #ddd}
#lg span{display:inline-flex;align-items:center;gap:8px}
.l{width:44px;border-top:7px solid #1f5fd1;display:inline-block}.l.o{border-top:6px dashed #d64532}
.d{width:16px;height:16px;border-radius:50%;display:inline-block;border:3px solid #333;background:#fff}
.d.a{background:#14955f;border-color:#0c6b44}.d.r{background:#fff;border-color:#d64532}
#ft{padding:6px 28px 18px;font-size:18px;color:#666}
.tt{font-size:15px;font-weight:bold;padding:1px 5px}.tt.r{color:#b3301f;border-color:#d64532}.tt.a{color:#0c6b44;border-color:#14955f}.tt.end{font-size:18px;padding:3px 8px}.tt.nb{background:#1f5fd1;color:#fff;border-color:#1f5fd1}.tt.ob{background:#fff;color:#b3301f;border-color:#d64532}
.st span{display:inline-block;white-space:nowrap;font-size:15px;font-weight:bold;color:#222;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.cs span{display:inline-block;transform:translate(-50%,-115%);white-space:nowrap;font-size:17px;font-weight:bold;background:#111;color:#fff;border-radius:6px;padding:3px 8px;box-shadow:0 1px 4px #0006}
#lists{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;padding:10px 28px 4px;font-size:19px}
#lists h3{margin:0 0 4px;font-size:21px}#lists h3.r{color:#b3301f}#lists h3.a{color:#0c6b44}
#lists small{color:#777;font-size:15px}
#lists ol{margin:0;padding-right:26px;columns:1}
.nm{width:20px;height:20px;border-radius:50%;font:bold 12px/20px Arial,sans-serif;text-align:center;box-shadow:0 0 0 2px #fff}
.nm.r{background:#fff;color:#b3301f;border:2px solid #d64532;width:18px;height:18px;line-height:18px}
.nm.a{background:#14955f;color:#fff}
.tt.uturn{font-size:15px;background:#fff;color:#1f5fd1;border:2px solid #1f5fd1}
.edge{white-space:nowrap;background:#fff;border:2px solid #999;border-radius:6px;padding:2px 6px;font:bold 15px Arial,sans-serif;display:flex;align-items:center;gap:4px}.edge.r{border-color:#d64532;color:#b3301f}.edge.a{border-color:#14955f;color:#0c6b44}.edge .nm{display:inline-block}
#ov{position:absolute;left:14px;bottom:14px;width:380px;height:300px;border:3px solid #333;box-shadow:0 2px 8px #0006;z-index:1000;background:#eee}
.ovt{font:bold 13px Arial;background:#fffd;padding:1px 4px;border-radius:3px;white-space:nowrap;transform:translate(-50%,-50%);display:inline-block}
</style></head><body>
<div id="hd"><h1 id="t"></h1><div class="sub" id="s"></div></div>
<div id="mapwrap" style="position:relative;width:1080px"><div id="map"></div><div id="ov"></div></div>
<div id="lg"><span><i class="l o"></i>המסלול היום</span><span><i class="l"></i>המסלול מ-17.11.2026</span>
<span><i class="nm r" style="display:inline-block">1</i>תחנה שיורדת</span><span><i class="nm a" style="display:inline-block">1</i>תחנה חדשה</span><span><i class="d"></i>תחנה שנשארת</span></div>
<div id="lists"></div>
<div id="ft">הוכן על ידי אדם פרטי · לא פרסום רשמי של משרד התחבורה · מפה: © תורמי OpenStreetMap</div>
<script>
const dir=new URLSearchParams(location.search).get('d')||'d1';
const TT={d1:['קו 988 בצפת: קרית גת ← חצור הגלילית','מה משתנה בצפת מ-17.11.2026'],d2:['קו 988 בצפת: חצור הגלילית ← קרית גת','מה משתנה בצפת מ-17.11.2026']};
document.getElementById('t').textContent=TT[dir][0];
fetch('data.json').then(r=>r.json()).then(D=>{
  const x=D[dir];
  const map=L.map('map',{zoomControl:false,attributionControl:false,zoomSnap:0.1});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  const all=[];
  x.old.line.forEach(s=>{L.polyline(s,{color:'#d64532',weight:7,opacity:.85,dashArray:'12 10'}).addTo(map);all.push(...s)});
  x.new.line.forEach(s=>{L.polyline(s,{color:'#1f5fd1',weight:6,opacity:.9}).addTo(map);all.push(...s)});
  // המפה מתמקדת בעיר עצמה; צומת עין זיתים וצומת ביריה (מחוץ לעיר) מסומנים בשולי המפה עם חץ לכיוונם
  const far=s=>/עין זיתים|ביריה/.test(s.n);
  const b=L.latLngBounds([...x.old.stops,...x.new.stops].filter(s=>!far(s)).map(s=>[s.la,s.lo]));
  map.fitBounds(b,{padding:[50,50]});
  // תוויות: תחנות צמודות באותו צבע — תווית אחת "שם ועוד N", כדי שלא יעלו זו על זו
  // תחנות: מספר בתוך העיגול, כמו המספר ברשימה מתחת למפה
  // מספרים שנופלים זה על זה (למשל שתי תחנות "צומת עין זיתים" בשני כבישים) — מזיזים הצידה כדי ששניהם ייראו
  const nums=[];
  // המספר יושב על קו המסלול (העמוד עומד בצד הכביש, והקו מצויר במרכזו — בלי הצמדה נראה כאילו התחנה בצד השני)
  // side: +1 / -1 — תחנה אדומה בצד אחד של הכביש וירוקה בצד השני (שלמה 04.11), 0 — על הקו
  // ההצמדה לקו נעשתה מראש לפי סדר הנסיעה (sla/slo): כל תחנה על הקטע של המסלול שהאוטובוס עובר בו באותו רגע
  const snapTo=(s,segs,side=0)=>{if(s.sla==null)return s;
    const B=map.latLngToContainerPoint([s.sla,s.slo]);if(!side)return {...s,la:s.sla,lo:s.slo};
    const P0=map.latLngToContainerPoint(s.hd[0]),P1=map.latLngToContainerPoint(s.hd[1]);
    let dx=P1.x-P0.x,dy=P1.y-P0.y;const L0=Math.hypot(dx,dy)||1;let nx=-dy/L0,ny=dx/L0;
    if(nx<-0.01||(Math.abs(nx)<=0.01&&ny<0)){nx=-nx;ny=-ny;}
    // הצד של הכביש לפי המיקום האמיתי של עמוד התחנה (שלמה 04.11: "3 לא בצד הנכון"); רק כשהעמוד ממש על הקו — צד קבוע לפי הצבע
    const T=map.latLngToContainerPoint([s.la,s.lo]),cr=(T.x-B.x)*nx+(T.y-B.y)*ny;
    const sd=Math.abs(cr)>1.2?Math.sign(cr):side;
    const ll=map.containerPointToLatLng(L.point(B.x+sd*nx*11,B.y+sd*ny*11));return {...s,la:ll.lat,lo:ll.lng};};
  const num=(s0,i,cls)=>{const s=snapTo(s0,cls==='r'?x.old.line:x.new.line,cls==='r'?1:-1);const p0=map.latLngToContainerPoint([s.la,s.lo]),SZ=map.getSize();
    const p=L.point(Math.min(Math.max(p0.x,30),SZ.x-30),Math.min(Math.max(p0.y,30),SZ.y-30));
    if(!p.equals(p0)){const ang=Math.atan2(p0.y-p.y,p0.x-p.x)*180/Math.PI;
      while(nums.some(q=>Math.abs(q.x-p.x)<40&&Math.abs(q.y-p.y)<30))p.y+=34;
      const tx=p.x<SZ.x/2?'-12px':'calc(-100% + 12px)';
      L.marker(map.containerPointToLatLng(p),{zIndexOffset:600,interactive:false,icon:L.divIcon({className:'',iconSize:null,html:`<div class="edge ${cls}" style="transform:translate(${tx},-50%)"><span class="nm ${cls}">${i}</span> ${s.n.replace(/''/g,'"')} <b style="display:inline-block;transform:rotate(${ang}deg)">➜</b></div>`})}).addTo(map);
      nums.push({x:p.x,y:p.y});return;}
    // נקודה מדויקת על הקו בצבע התחנה; אם המספר נדחף הצידה (צפוף) — קו דק מחבר אותו לנקודה
    const col=cls==='r'?'#d64532':'#14955f';
    let dx=0,dy=0,t=0;const tries=[[0,0],[0,-22],[0,22],[22,0],[-22,0],[18,-18],[-18,-18],[18,18],[-18,18],[0,-40],[0,40],[40,0],[-40,0]];
    while(t<tries.length-1&&nums.some(q=>Math.hypot(q.x-(p.x+dx),q.y-(p.y+dy))<20)){t++;[dx,dy]=tries[t];}
    const tp=map.latLngToContainerPoint([s0.la,s0.lo]);(window.CHK=window.CHK||[]).push({cls,i,n:s0.n,c:s0.c,x:p.x+dx,y:p.y+dy,tx:tp.x,ty:tp.y,sx:p.x,sy:p.y});
    if(/chk=1/.test(location.search))L.circleMarker([s0.la,s0.lo],{radius:3,color:'#000',weight:1,fillColor:'#ff0',fillOpacity:1,interactive:false}).addTo(map);
    nums.push({x:p.x+dx,y:p.y+dy});
    L.circleMarker([s.la,s.lo],{radius:4,color:'#fff',weight:1.5,fillColor:col,fillOpacity:1,interactive:false}).addTo(map);
    if(dx||dy)L.polyline([[s.la,s.lo],map.containerPointToLatLng(L.point(p.x+dx,p.y+dy))],{color:col,weight:2,opacity:.9,interactive:false}).addTo(map);
    L.marker([s.la,s.lo],{zIndexOffset:500,interactive:false,icon:L.divIcon({className:'',iconSize:[20,20],iconAnchor:[10-dx,10-dy],html:`<div class="nm ${cls}">${i}</div>`})}).addTo(map);};
  x.new.stops.forEach(s0=>{const s=snapTo(s0,x.new.line);if(s.k!=='only')L.circleMarker([s.la,s.lo],{radius:5,color:'#333',weight:2,fillColor:'#fff',fillOpacity:1}).addTo(map)});
  x.old.stops.filter(s=>s.k==='only').forEach((s,i)=>num(s,i+1,'r'));
  x.new.stops.filter(s=>s.k==='only').forEach((s,i)=>num(s,i+1,'a'));
  // סוף ותחילת המסלול (שלמה 04.11: "שיהיה ברור שהקו הכחול לא נגמר באמצע") — תווית "ממשיך ל..." וחיצי כיוון
  const END={d1:['מגיע מקרית גת','ממשיך לחצור הגלילית'],d2:['מגיע מחצור הגלילית','ממשיך לקרית גת']}[dir];
  const sz=map.getSize(),P=q=>map.latLngToContainerPoint(q);
  const inside=pt=>pt.x>70&&pt.x<sz.x-70&&pt.y>50&&pt.y<sz.y-50;
  const bigArrow=(q,ang,col)=>L.marker(q,{interactive:false,zIndexOffset:900,icon:L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],html:`<div style="width:0;height:0;border-top:12px solid transparent;border-bottom:12px solid transparent;border-left:24px solid ${col};transform:rotate(${ang}deg);margin:3px 0 0 4px;filter:drop-shadow(0 0 2px #fff)"></div>`})}).addTo(map);
  const ends=(segs,col,cls,skip)=>{const pts=segs.flat();
    let i0=0;while(i0<pts.length-1&&!inside(P(pts[i0])))i0++;
    let i1=pts.length-1;while(i1>0&&!inside(P(pts[i1])))i1--;
    const ang=(i,j)=>{const a=P(pts[Math.max(0,Math.min(pts.length-1,i))]),c=P(pts[Math.max(0,Math.min(pts.length-1,j))]);return Math.atan2(c.y-a.y,c.x-a.x)*180/Math.PI;};
    [[i0,END[0],ang(i0,i0+20)],[i1,END[1],ang(i1-20,i1)]].forEach(([i,t,an],k)=>{const q=pts[i];
      if(skip&&skip[k]&&P(skip[k]).distanceTo(P(q))<120)return;
      if(k===0){L.circleMarker(q,{radius:8,color:'#fff',weight:3,fillColor:col,fillOpacity:1}).addTo(map);
        const j=Math.min(pts.length-1,i+30);bigArrow(pts[j],ang(j-12,j+8),col);}
      else bigArrow(q,an,col);
      const Q=P(q),W2=t.length*9+30,H2=36,RP=[...x.old.line.flat(),...x.new.line.flat()].map(P);
      const opts=[['left',[-18,0],Q.x-18-W2,Q.y-H2/2],['right',[18,0],Q.x+18,Q.y-H2/2],['top',[0,-18],Q.x-W2/2,Q.y-18-H2],['bottom',[0,18],Q.x-W2/2,Q.y+18]]
        .filter(o=>o[2]>4&&o[2]+W2<sz.x-4&&o[3]>4&&o[3]+H2<sz.y-4)
        .map(o=>[o,RP.filter(r=>r.x>o[2]-6&&r.x<o[2]+W2+6&&r.y>o[3]-6&&r.y<o[3]+H2+6).length+50*nums.filter(r=>r.x>o[2]-14&&r.x<o[2]+W2+14&&r.y>o[3]-14&&r.y<o[3]+H2+14).length]).sort((a,b)=>a[1]-b[1]);
      const o=(opts[0]||[['top',[0,-18]]])[0];
      L.marker(q,{opacity:0,interactive:false}).addTo(map).bindTooltip(t,{permanent:true,direction:o[0],offset:o[1],className:'tt end '+cls}).openTooltip();});
    return [pts[i0],pts[i1]];};
  const ne=ends(x.new.line,'#1f5fd1','nb'); ends(x.old.line,'#d64532','ob',ne);
  const arrows=(segs,col)=>segs.forEach(sg=>{let acc=0;for(let i=1;i<sg.length;i++){const a=map.latLngToContainerPoint(sg[i-1]),c=map.latLngToContainerPoint(sg[i]);acc+=a.distanceTo(c);
    if(acc>170&&i>=12){const a0=map.latLngToContainerPoint(sg[i-12]);if(a0.distanceTo(c)<20)continue;
      // קטע שהקו עובר בו פעמיים (הלוך וחזור באותו כביש) — בלי חץ, אחרת נראים שני חצים הפוכים
      if(sg.some((q,j)=>Math.abs(j-i)>40&&map.latLngToContainerPoint(q).distanceTo(c)<14))continue;acc=0;const ang=Math.atan2(c.y-a0.y,c.x-a0.x)*180/Math.PI;
      L.marker(sg[i],{interactive:false,icon:L.divIcon({className:'',iconSize:[18,18],iconAnchor:[9,9],html:`<div style="width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:13px solid ${col};transform:rotate(${ang}deg);transform-origin:center;margin:2px 0 0 3px"></div>`})}).addTo(map);}}});
  arrows(x.new.line,'#0b3d91');

  // שמות הרחובות שבהם עובר הקו (שלמה 04.11: "רק השמות של הרחובות"), בלי תוויות שעולות זו על זו
  const placed=[];
  // רק רחובות שהקו נוסע לאורכם (מעל 110 מ'), השם על הרחוב בכיוון שלו. לכל רחוב כמה מקומות אפשריים —
  // נבחר הראשון שלא מכסה מספר של תחנה, תווית "מגיע/ממשיך" או שם רחוב אחר
  const busy=[...nums.map(q=>({x:q.x,y:q.y,r:16}))];
  document.querySelectorAll('.leaflet-tooltip').forEach(el=>{const r=el.getBoundingClientRect(),m=document.getElementById('map').getBoundingClientRect();busy.push({x:r.left-m.left+r.width/2,y:r.top-m.top+r.height/2,r:Math.max(r.width,r.height)/2+8});});
  (x.streets||[]).forEach(t=>{const w=t.n.length*8+10;
    for(const [la,lo,a] of t.c){const p=map.latLngToContainerPoint([la,lo]);
      if(p.x<w/2+8||p.x>sz.x-w/2-8||p.y<20||p.y>sz.y-20)continue;
      if(busy.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<q.r+w/2))continue;
      busy.push({x:p.x,y:p.y,r:w/2.2});
      L.marker([la,lo],{interactive:false,icon:L.divIcon({className:'st',iconSize:null,html:`<span style="transform:translate(-50%,-50%) rotate(${a}deg)">${t.n.replace(/''/g,'"')}</span>`})}).addTo(map);break;}});
  // התחנה המרכזית
  // התחנה המרכזית: עיגול סביב כל הרציפים שלה (שלמה 04.11), והשם צמוד אליו
  {const cs=[...x.old.stops,...x.new.stops].filter(s=>/מרכזית צפת/.test(s.n));
   const c=cs.length?L.latLngBounds(cs.map(s=>[s.la,s.lo])).getCenter():L.latLng(D.cs);
   const r=Math.max(70,...cs.map(s=>c.distanceTo([s.la,s.lo])))+45;
   L.circle(c,{radius:r,color:'#111',weight:3,dashArray:'6 5',fill:true,fillColor:'#000',fillOpacity:.06,interactive:false}).addTo(map);
   const top=map.latLngToContainerPoint(c).subtract([0,map.latLngToContainerPoint(c).distanceTo(map.latLngToContainerPoint(L.latLng(c.lat,c.lng).toBounds(r*2).getNorthEast()))*0.72]);
   L.marker(map.containerPointToLatLng(top),{interactive:false,zIndexOffset:1000,icon:L.divIcon({className:'cs',iconSize:null,html:'<span>🚏 התחנה המרכזית צפת</span>'})}).addTo(map);}
  // רשימת התחנות מתחת למפה, לפי הסדר במסלול
  const li=(a)=>a.map(s=>'<li>'+s.n.replace(/''/g,'"')+' <small>('+s.c+')</small></li>').join('');
  document.getElementById('lists').innerHTML=
    `<div><h3 class="r">תחנות שהקו לא יעצור בהן (${x.old.stops.filter(s=>s.k==='only').length})</h3><ol>${li(x.old.stops.filter(s=>s.k==='only'))}</ol></div>`+
    `<div><h3 class="a">תחנות חדשות בקו (${x.new.stops.filter(s=>s.k==='only').length})</h3><ol>${li(x.new.stops.filter(s=>s.k==='only'))}</ol></div>`;
  document.getElementById('s').textContent=`${TT[dir][1]} · תחנות בצפת: ${x.old.stops.length} היום, ${x.new.stops.length} מ-17.11`;
  // מפת התמצאות קטנה בפינה: כל האזור, והמסגרת = החלק שבמפה הגדולה
  // הפינה הפנויה ביותר: הכי מעט נקודות של המסלולים ומספרי תחנות מתחתיה
  {const SZ=map.getSize(),W=386,cs=[['r','b'],['l','b'],['r','t'],['l','t']];
   const pts=[...x.old.line.flat(),...x.new.line.flat()].map(q=>map.latLngToContainerPoint(q)).concat(nums.map(q=>L.point(q.x,q.y)),nums.map(q=>L.point(q.x,q.y)),nums.map(q=>L.point(q.x,q.y)));
   const cnt=([h,v])=>{const x0=h==='l'?0:SZ.x-W-20,y0=v==='t'?0:SZ.y-W-20;return pts.filter(p=>p.x>=x0&&p.x<=x0+W+20&&p.y>=y0&&p.y<=y0+W+20).length;};
   const best=cs.sort((a,b)=>cnt(a)-cnt(b))[0],el=document.getElementById('ov');
   el.style.left=best[0]==='l'?'14px':'auto';el.style.right=best[0]==='r'?'14px':'auto';el.style.top=best[1]==='t'?'14px':'auto';el.style.bottom=best[1]==='b'?'14px':'auto';}
  const ov=L.map('ov',{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(ov);
  // כל הדרך מצומת עין זיתים דרך צפת ועד חצור הגלילית
  x.old.ovline.forEach(sg=>L.polyline(sg,{color:'#d64532',weight:4,dashArray:'7 6'}).addTo(ov));
  x.new.ovline.forEach(sg=>L.polyline(sg,{color:'#1f5fd1',weight:4}).addTo(ov));
  ov.fitBounds(L.latLngBounds([...x.old.ovline.flat(),...x.new.ovline.flat()]),{padding:[16,16]});
  L.rectangle(map.getBounds(),{color:'#111',weight:2,fill:false,dashArray:'4 3'}).addTo(ov);
  const ovl=(q,t)=>L.marker(q,{interactive:false,icon:L.divIcon({className:'',iconSize:null,html:`<span class="ovt">${t}</span>`})}).addTo(ov);
  const ez=[...x.old.stops,...x.new.stops].find(s=>/עין זיתים/.test(s.n));if(ez)ovl([ez.la+0.0015,ez.lo],'צומת עין זיתים');
  ovl(map.getBounds().getCenter(),'צפת');
  ovl([D.hz[0]+0.004,D.hz[1]],'חצור הגלילית');
  setTimeout(()=>document.title='ready',4000);
});
