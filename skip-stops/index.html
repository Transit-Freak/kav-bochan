  <!-- React ייצור, מוגש מאותו דומיין: גרסת הפיתוח מ-CDN הייתה איטית
       משמעותית (בדיקות ואזהרות בכל רינדור) והוסיפה תלות בשרת חיצוני -->
  <script src="vendor/react.production.min.js?v=18.3.1"></script>
  <script src="vendor/react-dom.production.min.js?v=18.3.1"></script>
  <!-- Babel מקומי — בלי תלות בשרת חיצוני בביקור ראשון -->
  <script src="../vendor/babel.min.js?v=7.29"></script>

  <script>
    (function () {
      // הקוד נטען עם revalidation מול השרת (ETag): עדכון מגיע מיד בלי
      // להעלות SK_BUILD ידנית, וקובץ שלא השתנה חוזר 304 זעיר. הפלט
      // המקומפל נשמר ב-localStorage לפי טביעת-תוכן — ביקור חוזר עולה
      // בלי קומפילציה בכלל (אותו דפוס כמו בדף הראשי ובהקו בזמן).
      function run(js) {
        var s = document.createElement("script");
        s.textContent = js;
        document.body.appendChild(s);
      }
      function hash(str) {
        var h = 5381, i = str.length;
        while (i) h = (h * 33) ^ str.charCodeAt(--i);
        return (h >>> 0).toString(36);
      }
      // חותמת זמן בכתובת: ה-CDN של Pages מגיש קובץ ששונה מהעותק הישן עד 10 דקות גם עם no-cache (שלמה 22.09)
      fetch("app.jsx?v=" + Date.now(), { cache: "no-cache" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
        .then(function (code) {
          var key = "sk-js-" + hash(code);
          var cached = null;
          try { cached = localStorage.getItem(key); } catch (e) { /* מצב פרטי */ }
          if (cached) { run(cached); return; }
          var out = Babel.transform(code, { presets: ["react"], filename: "app.jsx" }).code;
          try {
            Object.keys(localStorage).forEach(function (k) { if ((k.indexOf("sk-js-") === 0 || k.indexOf("sk-compiled-") === 0) && k !== key) localStorage.removeItem(k); });
            localStorage.setItem(key, out);
          } catch (e) { /* אין מקום — פשוט בלי מטמון */ }
          run(out);
        })
        .catch(function (e) {
          // תקלת רשת רגעית: אם יש קומפילציה שמורה מביקור קודם — מריצים
          // אותה במקום להציג שגיאה (הקוד מעט ישן, אבל האתר חי)
          try {
            var k = Object.keys(localStorage).find(function (x) { return x.indexOf("sk-js-") === 0; });
            if (k) { run(localStorage.getItem(k)); return; }
          } catch (e2) { /* אין מטמון */ }
          document.getElementById("root").innerHTML =
            '<div class="boot">שגיאת טעינה. נסו לרענן.</div>';
          console.error("load error", e);
        });
    })();
  </script>
