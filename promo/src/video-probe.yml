name: video-probe
on:
  push:
    branches: [claude/stoic-allen-3g21ru]
    paths: ['tmp-video/**', '.github/workflows/video-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: video-probe
  cancel-in-progress: true
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/stoic-allen-3g21ru
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: tmp-video
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: התקנה
        working-directory: tmp-video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          npm init -y >/dev/null
          npm i playwright@1.49.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: הקלטה
        working-directory: tmp-video
        run: OUT=$PWD/build node record.cjs
      - name: שמירה בענף
        if: always()
        run: |
          mkdir -p tmp-video/out
          cp tmp-video/build/*.mp4 tmp-video/build/*.png tmp-video/build/marks.json tmp-video/out/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-video/out
          git commit -m "סרטון: תוצאת הקלטה [skip ci]" || exit 0
          git push origin HEAD:claude/stoic-allen-3g21ru
