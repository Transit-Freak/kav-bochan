<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>כרטיסי פתיחה וסיום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Heebo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#13201b;--ink-fg:#eef3f0;--ink-sub:#a9c2b8;--new-on-ink:#45c97f;--before-on-ink:#f07b62;--new:#1f9152;--bg:#e9eeeb;--before:#b8361f;--fg:#13201b}
*{box-sizing:border-box}
html,body{margin:0;width:540px;height:960px;overflow:hidden;background:var(--bg);font-family:Assistant,Heebo,sans-serif;color:var(--fg)}
.scene{position:fixed;inset:0;opacity:0;transition:opacity .45s ease}
.scene.on{opacity:1}

/* 1: דף ריק עם סמן מהבהב */
#s1{background:#fff}
#s1 .sheet{position:absolute;top:120px;right:44px;left:44px;height:560px;border:1px solid #e3e8e5;border-radius:6px;box-shadow:0 10px 40px rgba(19,32,27,.08)}
#s1 .caret{position:absolute;top:56px;right:44px;width:4px;height:52px;background:var(--ink);animation:blink 1.06s steps(1) infinite}
#s1 .ghost{position:absolute;right:44px;left:44px;height:14px;border-radius:7px;background:#f1f4f2}
@keyframes blink{50%{opacity:0}}

/* 2: תג מחיר שנמחק */
#s2{background:var(--bg)}
#s2 .hang{position:absolute;top:0;left:50%;width:2px;height:250px;background:#8fa49a;transform:translateX(-50%)}
#s2 .tag{position:absolute;top:240px;left:50%;width:360px;height:190px;margin-left:-180px;background:#fff;border:4px solid var(--ink);
  border-radius:26px 26px 26px 26px;display:flex;align-items:center;justify-content:center;transform-origin:50% -10px;
  box-shadow:0 18px 40px rgba(19,32,27,.18);transform:translateY(-500px) rotate(0)}
#s2.on .tag{animation:drop 1.2s cubic-bezier(.2,.9,.3,1.1) forwards}
@keyframes drop{0%{transform:translateY(-500px) rotate(-14deg)}55%{transform:translateY(0) rotate(7deg)}75%{transform:rotate(-4deg)}100%{transform:rotate(-3deg)}}
#s2 .tag::before{content:"";position:absolute;top:16px;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50%;border:4px solid var(--ink);background:var(--bg)}
#s2 .price{direction:ltr;font:900 92px/1 Heebo,sans-serif;letter-spacing:-1px;margin-top:22px;transition:color .4s}
#s2 .strike{position:absolute;top:50%;left:-6%;height:12px;width:0;background:var(--before);border-radius:6px;transform:translateY(4px) rotate(-12deg);transform-origin:left center;transition:width .55s cubic-bezier(.5,0,.3,1)}
#s2.cut .strike{width:112%}
#s2.cut .price{color:#9aa8a1}

/* 3: כרטיס שם הכלי */
#s3,#s4{background:var(--ink);color:var(--ink-fg)}
.art{display:block;margin:0 auto}
.art path,.art circle{opacity:0}
.on .art .p1{opacity:1;stroke-dasharray:320;stroke-dashoffset:320;animation:draw .9s .15s ease-out forwards}
.on .art .p2{opacity:1;animation:fade .5s .8s both}
.on .art circle{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.on .art .c1{animation-delay:.5s}.on .art .c2{animation-delay:1s}.on .art .c3{animation-delay:1.15s}.on .art .c4{animation-delay:.95s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.art circle{transform-box:fill-box;transform-origin:center}
.namecard{position:absolute;top:150px;right:0;left:0;text-align:center;padding:0 36px}
.eyebrow{font:800 22px Heebo,sans-serif;letter-spacing:.04em;color:var(--ink-sub);margin-top:34px}
.title{font:900 66px/1.08 Heebo,sans-serif;margin:10px 0 0;color:#fff}
.free{display:inline-block;margin-top:22px;background:var(--new-on-ink);color:var(--ink);font:900 30px Heebo,sans-serif;border-radius:999px;padding:6px 28px 8px}
.up{opacity:0;transform:translateY(18px)}
.on .up{animation:up .55s cubic-bezier(.2,.8,.3,1) forwards}
.on .d1{animation-delay:.35s}.on .d2{animation-delay:.55s}.on .d3{animation-delay:.85s}
@keyframes up{to{opacity:1;transform:none}}
.seam{display:flex;align-items:center;height:8px;margin:34px auto 0;width:380px}
.seam::before{content:"";flex:1;height:5px;background:repeating-linear-gradient(to left,var(--before-on-ink) 0 16px,transparent 16px 26px)}
.seam::after{content:"";flex:1;height:8px;background:var(--new-on-ink);border-radius:0 4px 4px 0}
.seam i{width:18px;height:18px;border-radius:50%;background:var(--ink);border:4px solid var(--new-on-ink);flex:none;margin:0 -2px}
.on .seam{animation:grow .8s .6s cubic-bezier(.4,0,.2,1) both}
@keyframes grow{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
.url{direction:ltr;font:900 60px/1.1 Heebo,sans-serif;color:#fff;margin-top:14px}

/* כתובית */
#cap{position:fixed;right:22px;left:22px;bottom:150px;z-index:10;display:flex;align-items:center;justify-content:center;gap:14px;
  background:rgba(19,32,27,.95);color:#fff;border-radius:24px;padding:20px 24px 22px;font:800 33px/1.28 Heebo,sans-serif;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.25);border-bottom:6px solid var(--new);opacity:0;transform:translateY(16px);transition:opacity .35s,transform .35s}
#cap.on{opacity:1;transform:none}
body.paused *{animation-play-state:paused!important}
#cap.light{background:#fff;color:var(--ink);border-bottom-color:var(--new)}
</style>
</head>
<body>
<section class="scene" id="s1">
  <div class="sheet"><div class="caret"></div></div>
</section>
<section class="scene" id="s2">
  <div class="hang"></div>
  <div class="tag"><span class="price">₪ 3,000</span><span class="strike"></span></div>
</section>
<section class="scene" id="s3">
  <div class="namecard">
    <svg class="art" viewBox="0 0 220 110" width="330" height="165" aria-hidden="true">
      <path class="p1" d="M8 86 C40 86 52 40 92 40 S150 70 212 30" fill="none" stroke="#45c97f" stroke-width="6" stroke-linecap="round"/>
      <path class="p2" d="M92 40 C110 40 112 92 150 92 S196 70 212 30" fill="none" stroke="#f07b62" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round"/>
      <circle class="c1" cx="92" cy="40" r="8" fill="#13201b" stroke="#45c97f" stroke-width="4"/>
      <circle class="c2" cx="150" cy="92" r="7" fill="#f07b62" stroke="#13201b" stroke-width="2.5"/>
      <circle class="c3" cx="150" cy="57" r="7.5" fill="#0a5530" stroke="#ffffff" stroke-width="2.5"/>
      <circle class="c4" cx="212" cy="30" r="6" fill="#13201b" stroke="#45c97f" stroke-width="3"/>
    </svg>
    <div class="eyebrow up d1">הקו הבוחן</div>
    <h1 class="title up d2">מצגת לשינוי בקו</h1>
    <div class="free up d3">חינם</div>
    <div class="seam"><i></i></div>
  </div>
</section>
<section class="scene" id="s4">
  <div class="namecard" style="top:170px">
    <svg class="art" viewBox="0 0 220 110" width="260" height="130" aria-hidden="true">
      <path class="p1" d="M8 86 C40 86 52 40 92 40 S150 70 212 30" fill="none" stroke="#45c97f" stroke-width="6" stroke-linecap="round"/>
      <path class="p2" d="M92 40 C110 40 112 92 150 92 S196 70 212 30" fill="none" stroke="#f07b62" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round"/>
      <circle class="c1" cx="92" cy="40" r="8" fill="#13201b" stroke="#45c97f" stroke-width="4"/>
      <circle class="c2" cx="150" cy="92" r="7" fill="#f07b62" stroke="#13201b" stroke-width="2.5"/>
      <circle class="c3" cx="150" cy="57" r="7.5" fill="#0a5530" stroke="#ffffff" stroke-width="2.5"/>
      <circle class="c4" cx="212" cy="30" r="6" fill="#13201b" stroke="#45c97f" stroke-width="3"/>
    </svg>
    <div class="eyebrow up d1">מצגת לשינוי בקו · הקו הבוחן</div>
    <div class="url up d2">kavbochan.app</div>
    <div class="seam"><i></i></div>
  </div>
</section>
<div id="cap"></div>
<script>
var cap = document.getElementById('cap');
function show(id) { document.querySelectorAll('.scene').forEach(function (s) { s.classList.toggle('on', s.id === id); }); }
function say(t, light) { cap.textContent = t; cap.classList.toggle('light', !!light); cap.classList.add('on'); }
function hush() { cap.classList.remove('on'); }
var at = function (ms, f) { setTimeout(f, ms); };
var scene = new URLSearchParams(location.search).get('scene') || 'intro';
// מצב התחלה (לפני ההקלטה): הדף הריק בלי כתובית, או כרטיס הסיום כשהכתובית כבר מוצגת
if (scene === 'intro') show('s1');
else { document.body.classList.add('paused'); document.getElementById('s4').style.transition = 'none'; show('s4'); cap.style.transition = 'none'; say('kavbochan.app · לא פרסום רשמי, בדקו תמיד מול חברת האוטובוסים', true); }
window.run = function () {
  if (scene !== 'intro') { document.body.classList.remove('paused'); return; }
  at(350, function () { say('הקו שלכם משתנה, וצריך להודיע לנוסעים?'); });
  at(4700, hush);
  at(5000, function () { show('s2'); });
  at(5250, function () { say('לא צריך לשלם אלפי שקלים על עיצוב'); });
  at(6500, function () { document.getElementById('s2').classList.add('cut'); });
  at(8700, hush);
  at(9000, function () { show('s3'); });
  at(9450, function () { say('מצגת לשינוי בקו · הקו הבוחן · חינם', true); });
};
</script>
</body>
</html>
