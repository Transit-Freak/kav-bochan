<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><script src="../../home-link.js" data-home="../../"></script>
<title>מפת רשת — הקו הבוחן</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><path d="M4 22 L12 22 L18 14 L28 14" stroke="%23c2185b" stroke-width="3.4" fill="none" stroke-linecap="round"/><path d="M4 10 L10 10 L16 18 L28 24" stroke="%231565c0" stroke-width="3.4" fill="none" stroke-linecap="round"/><circle cx="12" cy="22" r="3" fill="%23fff" stroke="%230f172a" stroke-width="2"/><circle cx="16" cy="14.6" r="3" fill="%23fff" stroke="%230f172a" stroke-width="2"/></svg>'>
<style>
  html,body{margin:0;height:100%;font-family:'Assistant','Heebo',system-ui,sans-serif;background:#eef1f5}
  .top{background:#1e3a8a;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .top h1{font-size:19px;font-weight:900;margin:0}
  .tag{background:#a78bfa;color:#2e1065;padding:3px 11px;border-radius:9999px;font-size:11px;font-weight:900}
  .top select{font-family:inherit;font-weight:800;font-size:15px;padding:7px 12px;border-radius:12px;border:none;background:#fff;color:#0f172a;min-width:170px}
  .top a{color:#bfdbfe;font-weight:800;font-size:13px;text-decoration:none;margin-right:auto}
  .top .sub{font-size:11.5px;opacity:.75;font-weight:700;flex-basis:100%;margin-top:2px}
  iframe{border:none;width:100%;height:calc(100% - 92px);display:block;background:#fff}
  /* מפת LOOM: מתג רמות, רשימת קווים, והדגשת קו בלחיצה */
  #loom{display:none;flex-direction:column;height:calc(100% - 92px);background:#fff}
  .bar{display:flex;gap:6px;padding:8px 10px 4px;flex-wrap:wrap;align-items:center}
  .tg{font-family:inherit;font-weight:800;font-size:13px;padding:6px 11px;border-radius:9999px;border:1.5px solid #cbd5e1;background:#fff;color:#334155;cursor:pointer}
  .tg.on{background:#1e3a8a;border-color:#1e3a8a;color:#fff}
  .tg:disabled{opacity:.35;cursor:default}
  .zm{margin-inline-start:auto;display:flex;gap:4px}
  .zm button{font-family:inherit;font-weight:900;font-size:17px;width:34px;height:34px;border-radius:10px;border:1.5px solid #cbd5e1;background:#fff;color:#0f172a;cursor:pointer}
  #chips{display:flex;gap:5px;padding:4px 10px 6px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  .chip{flex:none;font-family:inherit;font-weight:900;font-size:13px;min-width:34px;padding:5px 8px;border-radius:8px;border:2px solid transparent;color:#fff;cursor:pointer}
  #chips.hl .chip{opacity:.3}#chips.hl .chip.on{opacity:1;border-color:#0f172a}
  #info{padding:0 12px 6px;font-size:13px;font-weight:800;color:#0f172a;min-height:18px}
  #info small{font-weight:700;color:#64748b}
  #view{flex:1;overflow:auto;border-top:1px solid #e2e8f0;-webkit-overflow-scrolling:touch}
  #view svg{display:block;height:auto;max-width:none;margin:0 auto}
  #view svg [class*="line-"]{cursor:pointer;transition:opacity .15s}
  #view svg.hl [class*="line-"]{opacity:.1}
  .msg{padding:60px 20px;text-align:center;color:#475569;font-weight:800;font-size:17px}
</style>
</head>
<body>
  <div class="top">
    <h1>🚌 מפת רשת</h1>
    <span class="tag">ניסוי</span>
    <select id="city" aria-label="בחירת עיר"></select>
    <div class="sub">מפה סכמטית של קווי העיר, נוצרת אוטומטית מנתוני GTFS · לחצו על קו במפה כדי להדגיש אותו · מתעדכן שבועית</div>
  </div>
  <iframe id="frame" title="מפת הרשת"></iframe>
  <div id="loom">
    <div class="bar" id="tiers"></div>
    <div id="chips" aria-label="קווים"></div>
    <div id="info"></div>
    <div id="view"></div>
    <iframe id="oldf" title="מפת הרשת (המנוע הישן)" style="display:none;flex:1;height:auto"></iframe>
  </div>
  <script>
    const $=id=>document.getElementById(id);
    const sel=$('city'), frame=$('frame'), box=$('loom'), view=$('view'), chips=$('chips'), info=$('info'), hlCss=document.createElement('style');
    document.head.appendChild(hlCss);
    const TIERS=[['internal','פנימיים'],['metro','+ מטרופוליניים'],['all','כל הקווים']];
    const saved=localStorage.getItem('citymap-city');
    let LOOM={}, CITY={}, cur=null, zoom=1, picked=null;
    // maps/loom/index.json: הערים שיש להן מפה מהמנוע החדש. עיר שלא שם מוצגת בדף של המנוע הישן.
    Promise.all([fetch('cities.json').then(r=>{if(!r.ok)throw 0;return r.json()}),
                 fetch('maps/loom/index.json').then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([cities,loom])=>{
      LOOM=loom; for(const c of cities) CITY[c.name]=c;
      cities.sort((a,b)=>a.name.localeCompare(b.name,'he'));
      for(const c of cities){
        const o=document.createElement('option');
        o.value=c.name; o.textContent=`${c.name} (${c.lines} קווים)`;
        sel.appendChild(o);
      }
      const start=(saved&&cities.some(c=>c.name===saved))?saved:(cities.some(c=>c.name==='קרית גת')?'קרית גת':cities[0]?.name);
      if(start){ sel.value=start; load(start); }
      sel.onchange=()=>{ localStorage.setItem('citymap-city',sel.value); load(sel.value); };
    }).catch(()=>{
      document.body.insertAdjacentHTML('beforeend','<div class="msg">המפות עדיין בהפקה ראשונה — נסו שוב בעוד כמה דקות 🚧</div>');
      frame.style.display='none';
    });
    function load(city){
      const L=LOOM[city];
      frame.style.display=L?'none':'block'; box.style.display=L?'flex':'none';
      if(!L){ frame.src='maps/'+encodeURIComponent(city)+'.html'; return; }
      frame.removeAttribute('src'); showTier(city,L.def);
    }
    function showTier(city,t){
      const L=LOOM[city]; cur={city,t}; pick(null); zoom=1;
      const bar=$('tiers'); bar.innerHTML='';
      for(const [k,nm] of TIERS){
        // רמה שאין לה מפה חדשה מוצגת בדף של המנוע הישן (אם יש בה קווים נוספים)
        const b=document.createElement('button'); b.className='tg'+(k===t?' on':''); b.disabled=!L.tiers[k]&&!hasOld(city,k);
        b.textContent=nm+(L.tiers[k]?' ('+L.tiers[k].lines.length+')':b.disabled?'':' ('+CITY[city].n[k]+')'); b.onclick=()=>showTier(city,k); bar.appendChild(b);
      }
      const z=document.createElement('span'); z.className='zm';
      for(const [tx,f] of [['+',1.5],['−',1/1.5]]){ const b=document.createElement('button'); b.textContent=tx; b.setAttribute('aria-label',tx==='+'?'הגדלה':'הקטנה'); b.onclick=()=>setZoom(zoom*f); z.appendChild(b); }
      bar.appendChild(z);
      const old=!L.tiers[t], of=$('oldf');
      for(const el of [chips,info,view,z]) el.style.display=old?'none':'';
      of.style.display=old?'block':'none';
      if(old){ of.src='maps/'+encodeURIComponent(city)+(t===CITY[city].def?'':'.'+t)+'.html'; return; }
      of.removeAttribute('src');
      chips.innerHTML=''; const seen=new Set();
      for(const l of L.tiers[t].lines){
        if(seen.has(l.num)) continue; seen.add(l.num);
        const b=document.createElement('button'); b.className='chip'; b.textContent=l.num; b.dataset.num=l.num; b.style.background='#'+l.color;
        b.onclick=()=>pick(picked===l.num?null:l.num); chips.appendChild(b);
      }
      view.innerHTML='<div class="msg">טוען…</div>';
      fetch('maps/loom/'+encodeURIComponent(city)+'.'+t+'.svg').then(r=>{if(!r.ok)throw 0;return r.text()}).then(txt=>{
        if(cur.city!==city||cur.t!==t) return;
        const svg=document.importNode(new DOMParser().parseFromString(txt,'image/svg+xml').documentElement,true);
        svg.removeAttribute('width'); svg.removeAttribute('height');
        view.innerHTML=''; view.appendChild(svg); setZoom(1);
        svg.addEventListener('click',e=>{ const n=lineAt(e.clientX,e.clientY); pick(n===picked?null:n); });
      }).catch(()=>{ view.innerHTML='<div class="msg">המפה לא נטענה</div>'; });
    }
    function hasOld(city,k){
      const n=CITY[city]&&CITY[city].n; if(!n) return false;
      const i=TIERS.findIndex(x=>x[0]===k); return k===CITY[city].def||(n[k]>=2&&(i===0||n[k]!==n[TIERS[i-1][0]]));
    }
    function setZoom(z){
      zoom=Math.min(8,Math.max(1,z)); const svg=view.querySelector('svg'); if(!svg) return;
      // זום 1 = כל המפה בתוך החלון; בזום גדול יותר גוררים/גוללים
      const vb=svg.viewBox.baseVal, fit=Math.min(view.clientWidth, view.clientHeight*vb.width/vb.height);
      const cx=(view.scrollLeft+view.clientWidth/2)/view.scrollWidth, cy=(view.scrollTop+view.clientHeight/2)/view.scrollHeight;
      svg.style.width=Math.round(fit*zoom)+'px';
      view.scrollLeft=cx*view.scrollWidth-view.clientWidth/2; view.scrollTop=cy*view.scrollHeight-view.clientHeight/2;
    }
    const numOf=el=>{ const m=el&&el.getAttribute&&(el.getAttribute('class')||'').match(/(?:^|\s)line-(\S+)/); return m?m[1]:null; };
    function lineAt(x,y){
      // הקווים דקים: מחפשים גם בסביבת הלחיצה (עד 10 פיקסלים), מהקרוב לרחוק
      for(const r of [0,4,7,10]) for(let a=0;a<(r?8:1);a++){
        const el=document.elementFromPoint(x+r*Math.cos(a*Math.PI/4),y+r*Math.sin(a*Math.PI/4));
        const n=numOf(el)||numOf(el&&el.parentNode); if(n&&view.contains(el)) return n;
      }
      return null;
    }
    function pick(num){
      picked=num; const svg=view.querySelector('svg');
      hlCss.textContent=num?`#view svg.hl [class~="line-${CSS.escape(num)}"]{opacity:1}`:'';
      if(svg) svg.classList.toggle('hl',!!num);
      chips.classList.toggle('hl',!!num);
      for(const c of chips.children){ const on=c.dataset.num===num; c.classList.toggle('on',on); if(on) c.scrollIntoView({block:'nearest',inline:'center'}); }
      const ls=num&&cur?LOOM[cur.city].tiers[cur.t].lines.filter(l=>l.num===num):[];
      info.innerHTML=ls.length?ls.map(l=>`קו ${l.num} <small>${l.long.replace(/-\d+#?$/,'').replace('<->',' ← ').replace(/</g,'&lt;')}</small>`).join('<br>'):'<small>לחצו על קו במפה או על מספר קו כדי להדגיש אותו</small>';
    }
  </script>
<script src="../../birthday.js" defer></script>
<script src="../../hagim.js" defer></script>
</body>
</html>
