<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="../nav-restore.js"></script><script src="../home-link.js"></script>
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex, nofollow">
<title>GIS הקו הבוחן</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="26" fill="%230f172a"/><path d="M14 60 Q60 20 106 60 Q60 100 14 60 Z" stroke="%2338bdf8" stroke-width="6" fill="none"/><circle cx="60" cy="60" r="20" fill="%2338bdf8"/><circle cx="60" cy="60" r="9.5" fill="%230f172a"/></svg>'>
<meta property="og:image" content="https://kavbochan.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:title" content="GIS הקו הבוחן">
<meta property="og:description" content="כל שכבות התחבורה הציבורית על מפה אחת: מדדי האמינות, קו פח, קו באג, צי הרכבים, מסופים, נתיבי העדפה ותכניות העתיד של משרד התחבורה, ומדד לכל שכונה">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<!-- הקוד והעיצוב נטענים עם חותמת זמן (כמו במדד הדיוק): כל רענון מביא את הגרסה החדשה -->
<script>document.write('<link rel="stylesheet" href="style.css?v='+Date.now()+'">');try{if(localStorage.getItem('gis.theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>
<!-- ממשק GIS (שלמה 30.09: "שיהיה כמו GIS, לא כמו שאר האתרים שלנו"; העיצוב לפי ההדמיה שאושרה):
     כותרת כהה דקה, סרגל כלים אנכי מימין, לוח צד מעוגן שאפשר להרחיב, מפה, טבלת מאפיינים בתחתית ושורת מצב -->
<div id="app">
  <header id="bar">
    <a class="brand" href="../" title="לדף הבית של הקו הבוחן">
      <svg viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" rx="26" fill="#1e293b"/><path d="M14 60 Q60 20 106 60 Q60 100 14 60 Z" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linejoin="round"/><circle cx="60" cy="60" r="20" fill="#38bdf8"/><circle cx="60" cy="60" r="9.5" fill="#0f172a"/><circle cx="66" cy="54" r="3.5" fill="#fff"/><path d="M22 60 H34 M86 60 H98" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 7"/></svg>
      <h1>GIS הקו הבוחן</h1>
    </a>
    <div class="search">
      <svg class="si" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="חיפוש תחנה, מק״ט, קו, שכונה, כתובת…" aria-label="חיפוש במפה">
      <div id="qres" class="qres" role="listbox" hidden></div>
    </div>
    <button id="q-btn" class="hbtn" title="חיפוש" aria-label="חיפוש"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
    <button id="theme" class="hbtn" title="ערכה כהה / בהירה" aria-label="החלפת ערכת צבעים"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
  </header>

  <main id="main">
    <nav id="toolbar" aria-label="כלים">
      <button class="tool" data-tool="layers" title="עץ השכבות"><svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5zM3 12.5l9 5 9-5M3 17l9 5 9-5"/></svg><span>שכבות</span></button>
      <button class="tool" data-tool="legend" title="מקרא"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="4" height="3"/><rect x="3.5" y="10.5" width="4" height="3"/><rect x="3.5" y="16.5" width="4" height="3"/><path d="M10.5 6h10M10.5 12h10M10.5 18h10"/></svg><span>מקרא</span></button>
      <button class="tool" data-tool="base" title="מפת רקע"><svg viewBox="0 0 24 24"><rect x="3" y="3.5" width="18" height="17" rx="2"/><path d="m3 15.5 5-5 5 5 3-3 5 5"/><circle cx="16" cy="8" r="1.6"/></svg><span>רקע</span></button>
      <button class="tool" data-tool="tables" title="טבלאות מאפיינים"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9.5h18M3 15h18M9.5 4v16"/></svg><span>טבלאות</span></button>
      <button class="tool" data-tool="measure" title="מדידת מרחק ושטח"><svg viewBox="0 0 24 24"><path d="M3.5 16.5 16.5 3.5l4 4-13 13z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg><span>מדידה</span></button>
      <button class="tool" data-tool="select" title="בחירת ישויות"><svg viewBox="0 0 24 24"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4" /><path d="m10 10 8 3.2-3.3 1.5L13.2 18z"/></svg><span>בחירה</span></button>
      <button class="tool" data-tool="analysis" title="ניתוח — מדד לכל שכונה"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>ניתוח</span></button>
      <button class="tool" data-tool="bookmarks" title="סימניות — ערים ותצוגות שמורות"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></svg><span>סימניות</span></button>
      <button class="tool" data-tool="print" title="ייצוא תמונה והדפסה"><svg viewBox="0 0 24 24"><path d="M6.5 9V3.5h11V9M6.5 17.5H4v-8h16v8h-2.5"/><path d="M7.5 14h9v6.5h-9z"/></svg><span>הדפסה</span></button>
    </nav>

    <aside id="pane" aria-label="לוח צד">
      <div class="ph"><h2 id="pane-title">שכבות</h2><span id="pane-act"></span><button class="x" id="pane-close" title="סגירה" aria-label="סגירת הלוח"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="pbody">
        <section data-pane="layers"><div id="lyrtop"></div><div id="tree"></div></section>
        <section data-pane="legend" id="legend" hidden></section>
        <section data-pane="base" id="bases" hidden></section>
        <section data-pane="tables" id="tables" hidden></section>
        <section data-pane="measure" id="measure" hidden></section>
        <section data-pane="select" id="selpane" hidden></section>
        <section data-pane="analysis" hidden>
          <div class="atabs" role="tablist"><button data-ana="hood" class="on" role="tab">שכונה</button><button data-ana="line" role="tab">קו</button><button data-ana="stop" role="tab">תחנה</button><button data-ana="fut" role="tab">עתידי</button><button data-ana="st" role="tab">רחוב</button><button data-ana="sp" role="tab">מרחבי</button></div>
          <div data-ana-pane="hood"><div id="hoodtop"></div><div id="hood"></div></div>
          <div data-ana-pane="line" id="lineview" hidden></div>
          <div data-ana-pane="stop" id="stopview" hidden></div>
          <div data-ana-pane="fut" id="futview" hidden></div>
          <div data-ana-pane="sp" id="spview" hidden></div>
          <div data-ana-pane="st" id="strview" hidden></div>
        </section>
        <section data-pane="bookmarks" id="bookmarks" hidden></section>
        <section data-pane="print" id="printpane" hidden></section>
      </div>
      <div class="rz" id="pane-rz" title="גרירה משנה את רוחב הלוח" aria-hidden="true"></div>
    </aside>

    <div id="mapwrap">
      <div id="map" role="application" aria-label="מפה"></div>
      <div class="mapctl" aria-label="ניווט במפה">
        <button id="c-in" title="הגדלה" aria-label="הגדלה"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="c-out" title="הקטנה" aria-label="הקטנה"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button id="c-home" title="כל הארץ" aria-label="תצוגה ארצית"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5M6.5 10v9h11v-9"/></svg></button>
        <button id="c-loc" title="המיקום שלי" aria-label="המיקום שלי"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.8" class="f"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg></button>
      </div>
      <div class="north" title="צפון" aria-hidden="true"><svg viewBox="0 0 24 30"><path d="M12 2 18 20 12 16 6 20z"/></svg><b>צ</b></div>
      <div id="ov" aria-hidden="true"></div>
      <div id="modebar" class="modebar" hidden></div>
      <div id="ident" class="ident" hidden role="dialog" aria-label="זיהוי ישות"></div>
      <section id="table" hidden aria-label="טבלת מאפיינים">
        <div class="rzh" id="t-rz" title="גרירה משנה את גובה הטבלה" aria-hidden="true"></div>
        <div class="ttabs"><div id="t-tabs" class="tabs" role="tablist"></div><div id="t-act" class="tact"></div>
          <button class="x" id="t-close" title="סגירת הטבלה" aria-label="סגירת הטבלה"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <div class="tbar2">
          <input id="t-q" type="search" placeholder="סינון בטבלה…" aria-label="סינון בטבלה">
          <label class="chk"><input type="checkbox" id="t-view"> רק בתחום המפה</label>
          <label class="chk"><input type="checkbox" id="t-selonly"> רק הנבחרות</label>
          <span id="t-count" class="mut"></span>
        </div>
        <div class="tscroll"><table id="t-grid"></table></div>
      </section>
      <section id="dsheet" class="dsheet" hidden aria-label="טבלת נתונים">
        <div class="ttabs"><b id="d-title" class="dtitle"></b><div id="d-tabs" class="tabs" role="tablist"></div><div id="d-act" class="tact"></div>
          <button class="x" id="d-close" title="סגירת הטבלה" aria-label="סגירת הטבלה"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <div class="tbar2"><input id="d-q" type="search" placeholder="סינון…" aria-label="סינון בטבלה"><span id="d-count" class="mut"></span><span id="d-note" class="mut"></span></div>
        <div class="tscroll"><table id="d-grid" class="dgrid"></table></div>
      </section>
    </div>
  </main>

  <footer id="status">
    <span class="sc"><b id="s-wgs" dir="ltr">—</b> WGS84</span>
    <span class="sc"><b id="s-itm" dir="ltr">—</b> ITM</span>
    <span class="sc">קנה מידה <b id="s-scale" dir="ltr">—</b></span>
    <span class="sc">זום <b id="s-zoom">—</b></span>
    <span class="sc" id="s-selw">נבחרו <b id="s-sel">0</b></span>
    <span id="s-msg" aria-live="polite"></span>
    <span class="src">מקורות: משרד התחבורה (data.gov.il, GTFS), דאטאבוס, המרכז למיפוי ישראל · <span id="s-attr"></span> · <a href="../">kavbochan.app</a> · <a href="../terms.html#copyright">© 2026 שלמה הרטמן</a></span>
  </footer>
</div>
<div id="lmenu" class="menu" hidden role="menu"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="../kavpach-core.js"></script>

</body>
</html>
