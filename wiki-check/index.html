<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><script src="../home-link.js"></script>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ויקי-בודק — הקו הבוחן</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect x="2" y="4" width="28" height="24" rx="5" fill="%2310172A"/><text x="16" y="22" font-size="16" text-anchor="middle" fill="white" font-family="serif" font-weight="bold">W</text></svg>'>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#F2F4F8; --surface:#FFFFFF; --ink:#10172A; --mut:#6B7488; --dim:#8B93A7;
    --line:#E6EAF0; --chipbg:#EEF1F6; --row:#F6F8FB;
    --ok:#166534; --ok-bg:#DCFCE7; --bad:#991B1B; --bad-bg:#FEE2E2;
    --warn:#92400E; --warn-bg:#FEF3C7;
    --shadow:0 1px 3px rgba(16,23,42,.08);
  }
  *{box-sizing:border-box}
  html{direction:rtl}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .logo{width:42px;height:42px;border-radius:13px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;font-family:serif;flex-shrink:0}
  h1{font-size:21px;font-weight:800;margin:0}
  .tag{font-size:10.5px;font-weight:700;background:#FEF3C7;color:#92400E;border-radius:999px;padding:3px 10px}
  .homelink{margin-inline-start:auto;font-size:13px;font-weight:700;color:#1D4ED8;text-decoration:none}
  .sub{font-size:12.5px;color:var(--mut);font-weight:600;line-height:1.6;margin:8px 0 14px}
  #q{width:100%;height:46px;border:none;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:0 16px;font:600 14px 'Rubik',sans-serif;color:var(--ink);outline:none;margin-bottom:12px}
  #q:focus{box-shadow:0 0 0 2px #10172A, var(--shadow)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .card{border:none;text-align:inherit;font-family:inherit;cursor:pointer;color:#fff;background:#10172A;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
  .card h2{margin:0;font-size:15px;font-weight:800}
  .card span{font-size:11px;opacity:.75;font-weight:600}
  .panel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-top:14px}
  .ptitle{font-weight:800;font-size:14px;margin:0 0 10px}
  .ophead{color:#fff;background:#10172A;border-radius:18px;padding:16px 20px}
  .ophead h2{margin:0;font-size:20px;font-weight:800}
  .ophead .sub2{font-size:12px;opacity:.85;font-weight:500;margin-top:3px}
  .back{border:none;background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 15px;font:700 13px 'Rubik',sans-serif;cursor:pointer;box-shadow:var(--shadow);margin-bottom:12px}
  table{width:100%;border-collapse:separate;border-spacing:0 5px;font-size:12.5px}
  th{text-align:right;font-size:11px;color:var(--dim);font-weight:700;padding:2px 10px}
  td{background:var(--row);padding:8px 10px;font-weight:600}
  td:first-child{border-radius:0 10px 10px 0;font-weight:800}
  td:last-child{border-radius:10px 0 0 10px}
  .chip{display:inline-block;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;margin:2px}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.bad{background:var(--bad-bg);color:var(--bad)}
  .chip.warn{background:var(--warn-bg);color:var(--warn)}
  .btn{border:none;cursor:pointer;background:var(--ink);color:#fff;border-radius:12px;padding:11px 18px;font:700 13px 'Rubik',sans-serif}
  .btn.sec{background:var(--chipbg);color:var(--ink)}
  .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #wtitle{flex:1;min-width:200px;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:600 13px 'Rubik',sans-serif;color:var(--ink);outline:none}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:12px;padding:12px;font:500 12px ui-monospace,monospace;direction:rtl;resize:vertical}
  .note{font-size:11px;color:var(--dim);font-weight:600;line-height:1.6;margin-top:10px}
  .empty{padding:40px;text-align:center;color:var(--dim);font-weight:700}
  .msg{padding:60px 20px;text-align:center;color:var(--mut);font-weight:800;font-size:16px}
  .stat{font-size:13px;font-weight:700;margin:8px 0}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .fchip{border:none;cursor:pointer;background:var(--chipbg);color:var(--mut);border-radius:999px;padding:7px 14px;font:700 12px 'Rubik',sans-serif}
  .fchip.on{background:var(--ink);color:#fff}
  .rlist{display:flex;flex-direction:column;gap:6px;margin:6px 0}
  .rrow{font-size:13px;line-height:1.6;padding:6px 10px;background:var(--row);border-radius:10px}
  a{color:#1D4ED8}
  button:focus-visible,input:focus-visible{outline:2px solid #10172A;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">W</div>
    <h1>ויקי-בודק</h1>
    <span class="tag">לעורכי ויקיפדיה</span>
  </div>
  <div class="sub">בערכים של תחנות מרכזיות ומסופים יש הרבה רשימות קווים לא מעודכנות. הכלי סורק את הערכים אוטומטית, משווה את מה שכתוב בהם מול הקווים שמתחילים ומסתיימים בכל תחנה בפועל — לפי קובץ ה-GTFS הרשמי של משרד התחבורה — ומייצר טבלה מוכנה להדבקה בערך.</div>
  <div id="view"><div class="msg">⏳ טוען נתונים…</div></div>
</div>

<script>
const $=s=>document.querySelector(s);
let DATA=null, AUDIT=null, SEL=null, Q='', WIKI=null, WBUSY=false, KIND='station';
const KINDS={station:'תחנות מרכזיות ומסופים'};   // רק מה שרשום בוויקיפדיה בקטגוריית התחנות המרכזיות והמסופים (שלמה 18.09)
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=s=>s?s.split('-').reverse().join('.'):'—';
function lineKey(x){const m=/^(\d+)/.exec(String(x));return m?+m[1]:1e9;}

function auditBadge(k){
  const a=AUDIT&&AUDIT.stations&&AUDIT.stations[k];
  if(!a) return '';
  if(!a.article) return '<span class="chip warn">לא נמצא ערך</span>';
  if(!a.hasTable) return '<span class="chip warn">אין טבלת קווים בערך</span>';
  const nr=a.routes?Object.keys(a.routes).length:0;
  const rr=nr?`<span class="chip warn">${nr} מסלולים לבדיקה</span>`:'';
  const na=a.acc?['missing','wrong','circMissing','circWrong'].reduce((n,k)=>n+(a.acc[k]||[]).length,0):0;
  const ra=na?`<span class="chip warn">${na} סימונים לבדיקה</span>`:'';
  if(a.wrong&&a.wrong.length) return `<span class="chip bad">${a.wrong.length} קווים בערך שכבר לא עוצרים בתחנה</span>`+rr+ra;
  return (nr||na?'':'<span class="chip ok">הטבלה בערך תקינה ✓</span>')+rr+ra;
}
function home(){
  const f=Q.trim();
  const ks=Object.keys(DATA.stations).filter(k=>(DATA.stations[k].kind||'station')===KIND).filter(k=>!f||k.includes(f)||DATA.stations[k].city.includes(f))
    .sort((a,b)=>{
      const w=k=>{const x=AUDIT&&AUDIT.stations&&AUDIT.stations[k];return x&&x.wrong?x.wrong.length:0;};
      return (w(b)-w(a))||(DATA.stations[b].lines.length-DATA.stations[a].lines.length);});
  return `<div class="filters"></div>
  <div class="cards">${ks.map(k=>{const s=DATA.stations[k];
    return `<button class="card" onclick="pick(${JSON.stringify(k).replace(/"/g,'&quot;')})">
      <h2>${esc(k)}</h2><span>${esc(s.city)} · ${s.lines.length} קווים</span><div style="margin-top:6px">${auditBadge(k)}</div></button>`;}).join('')
    ||'<div class="empty">לא נמצאה תחנה</div>'}</div>
  <p class="note">תחנות מרכזיות ומסופים בלבד — אלה שיש להם ערך בקטגוריה "ישראל: תחנות מרכזיות ומסופי אוטובוסים" בוויקיפדיה. קו משויך למקום אם הוא עוצר בו לפי לוח הזמנים הרשמי (כולל באמצע מסלול). הערכים נסרקים אוטומטית כל שבוע — ערכים עם טעויות מוצגים ראשונים. עדכון: ${fd(DATA.updated)}.</p>`;
}

function destTxt(st,l){
  const ds=l[2].filter(d=>d!==SEL&&!SEL.startsWith(d));
  return ds.length?ds.join(', '):'קו מעגלי';
}

function stView(){
  const s=DATA.stations[SEL];
  const a=AUDIT&&AUDIT.stations&&AUDIT.stations[SEL];
  const real=new Set(s.lines.map(l=>l[0]));
  const hasPlat=s.lines.some(l=>l[3]);
  return `<button class="back" onclick="SEL=null;WIKI=null;render()">→ כל התחנות</button>
  <div class="ophead"><h2>${esc(SEL)}</h2><div class="sub2">${esc(s.city)} · ${s.lines.length} קווים עוצרים כאן · לפי GTFS מ-${fd(DATA.updated)}</div></div>

  ${a?`<div class="panel"><p class="ptitle">מה כתוב בערך היום — מהסריקה השבועית</p>
    ${!a.article?'<p class="note">לא נמצא ערך מתאים בוויקיפדיה לתחנה הזו.</p>':
      !a.hasTable?`<div class="stat">הערך: <a href="https://he.wikipedia.org/wiki/${encodeURIComponent(a.article)}" target="_blank" rel="noopener">${esc(a.article)}</a></div>
        <div class="stat" style="color:var(--warn)">⚠ בערך אין טבלת קווים — אפשר להוסיף אחת עם הטבלה המוכנה שלמטה.</div>`:
      `<div class="stat">הערך: <a href="https://he.wikipedia.org/wiki/${encodeURIComponent(a.article)}" target="_blank" rel="noopener">${esc(a.article)}</a> · ${a.inArticle.length} קווים בטבלאות הערך · <b style="color:var(--ok)">${a.correct} נכונים</b>${a.wrong.length?` · <b style="color:var(--bad)">${a.wrong.length} שגויים</b>`:''}${a.missing?` · ${a.missing} חסרים`:''}</div>
      <div>${a.inArticle.map(l=>`<span class="chip ${real.has(l)?'ok':'bad'}">${esc(l)}</span>`).join('')}</div>
      ${a.acc&&['missing','wrong','circMissing','circWrong'].some(k=>(a.acc[k]||[]).length)?`<p class="ptitle" style="margin-top:14px">סימונים בטבלה (♿ 🔄)</p>
      <div class="rlist">${(a.acc.missing||[]).length?`<div class="rrow"><span style="color:var(--warn)">קווים נגישים לפי ה-GTFS בלי סימון ♿ בערך:</span> ${a.acc.missing.map(esc).join(', ')}</div>`:''}${(a.acc.wrong||[]).length?`<div class="rrow"><span style="color:var(--bad)">מסומנים ♿ בערך אבל לא נגישים לפי ה-GTFS:</span> ${a.acc.wrong.map(esc).join(', ')}</div>`:''}${(a.acc.circMissing||[]).length?`<div class="rrow"><span style="color:var(--warn)">קווים מעגליים לפי ה-GTFS בלי סימון 🔄 בערך:</span> ${a.acc.circMissing.map(esc).join(', ')}</div>`:''}${(a.acc.circWrong||[]).length?`<div class="rrow"><span style="color:var(--bad)">מסומנים 🔄 בערך אבל אינם מעגליים לפי ה-GTFS:</span> ${a.acc.circWrong.map(esc).join(', ')}</div>`:''}</div>
      <p class="note">הסימונים 🛡️ (ממוגן ירי), 💺 (בהזמנה מראש) ו-🚆 (הזנה לרכבת) אינם בקובץ משרד התחבורה ולכן לא נבדקים.</p>`:''}
      ${a.routes&&Object.keys(a.routes).length?`<p class="ptitle" style="margin-top:14px">עמודת המסלול — רחובות שכדאי לבדוק</p>
      <div class="rlist">${Object.entries(a.routes).sort((x,y)=>lineKey(x[0])-lineKey(y[0])).map(([ln,r])=>`<div class="rrow"><b>קו ${esc(ln)}</b>${r.no&&r.no.length?` · <span style="color:var(--bad)">כתוב בערך אבל הקו לא עובר שם: ${r.no.map(esc).join(', ')}</span>`:''}${r.miss&&r.miss.length?` · <span style="color:var(--warn)">רחובות מרכזיים במסלול שלא הוזכרו: ${r.miss.map(esc).join(', ')}</span>`:''}</div>`).join('')}</div>
      <p class="note">ההשוואה לפי רחובות התחנות של הקו בלוח הזמנים הרשמי. "רחוב מרכזי" = רחוב שעוברים בו 10 קווים ומעלה באותה עיר. שמות ערים ותחנות קצה לא נספרים.</p>`:''}
      <p class="note">ירוק = הקו כתוב בערך וקיים בתחנה. אדום = כתוב בערך אבל לא עוצר בתחנה כיום לפי לוח הזמנים הרשמי — כנראה בוטל, שונה או הועבר. הסריקה רצה פעם בשבוע.</p>`}
  </div>`:''}

  <div class="panel"><p class="ptitle">בדיקה מול ויקיפדיה — עכשיו</p>
    <div class="row2">
      <input id="wtitle" placeholder="שם הערך בוויקיפדיה (ריק = חיפוש אוטומטי)" value="${esc((WIKI&&WIKI.title)||(a&&a.article)||'')}">
      <button class="btn" onclick="checkWiki()" ${WBUSY?'disabled':''}>${WBUSY?'בודק…':'בדיקת הערך'}</button>
    </div>
    ${WIKI&&WIKI.err?`<div class="stat" style="color:var(--bad)">${esc(WIKI.err)}</div>`:''}
    ${WIKI&&WIKI.done?wikiResult():'<p class="note">בדיקה טרייה מול הגרסה הנוכחית של הערך — למקרה שערכו אותו אחרי הסריקה השבועית.</p>'}
  </div>

  <div class="panel"><p class="ptitle">הקווים בתחנה בפועל</p>
    <table><thead><tr><th>קו</th><th>מפעיל</th><th>יעדים</th>${hasPlat?'<th>רציף</th>':''}</tr></thead><tbody>
    ${s.lines.map(l=>`<tr><td>${esc(l[0])}${l[4]?' <span title="מתחיל/מסתיים בתחנה" style="color:var(--dim);font-size:9px">⬤</span>':''}</td><td>${esc(l[1])}</td><td>${esc(destTxt(SEL,l))}</td>${hasPlat?`<td>${esc(l[3]||'—')}</td>`:''}</tr>`).join('')}
    </tbody></table>
    <p class="note">כל הקווים שעוצרים בתחנה לפי לוח הזמנים הרשמי — כולל קווים שעוצרים בה באמצע מסלולם. ⬤ = הקו מתחיל או מסתיים בתחנה. הרציף — מתוך תיאור התחנה ב-GTFS (לא לכל קו יש).</p>
  </div>

  <div class="panel"><p class="ptitle">טבלה מוכנה להדבקה בערך</p>
    <textarea id="wt" readonly>${esc(wikitext(s))}</textarea>
    <div class="row2" style="margin-top:8px">
      <button class="btn" onclick="navigator.clipboard.writeText($('#wt').value).then(()=>{this.textContent='הועתק ✓';setTimeout(()=>this.textContent='העתקת הטבלה',1500)})">העתקת הטבלה</button>
    </div>
    <p class="note">טבלת ויקי ממוינת (קו · מפעיל · מסלול · רציף · נגישות) עם קישורים פנימיים — המפעילים מקושרים לערכים שלהם והיעדים לערכי הערים. המסלול לפי סגנון הערך הקיים: אם הערך מפרט רחובות, הטבלה מפרטת את הרחובות המרכזיים שהקו עובר בהם (עד 6, לפי הסדר); אחרת מוצא-יעד בקצרה. כולל שורת מקור עם תאריך הנתונים. מומלץ לעבור עליה לפני ההדבקה.</p>
  </div>`;
}

function wikitext(s){
  // קישורים פנימיים: מפעילים לפי שמות הערכים האמיתיים שלהם בוויקיפדיה,
  // יעדים כקישור לערך העיר. שם שלא מוכר נשאר טקסט רגיל — עדיף בלי קישור מאשר קישור שגוי.
  const OPLINK={'אגד':'[[אגד]]','אגד תעבורה':'[[אגד תעבורה]]',
    'דן':'[[דן חברה לתחבורה ציבורית|דן]]','דן בדרום':'[[דן בדרום]]',
    'דן באר שבע':'[[דן באר שבע]]','דן צפון':'[[דן צפון]]',
    'מטרופולין':'[[מטרופולין (תחבורה ציבורית)|מטרופולין]]',
    'קווים':'[[קווים (חברת אוטובוסים)|קווים]]','סופרבוס':'[[סופרבוס]]',
    'נתיב אקספרס':'[[נתיב אקספרס]]','אלקטרה אפיקים':'[[אלקטרה-אפיקים]]',
    'אלקטרה אפיקים תחבורה':'[[אלקטרה-אפיקים]]','תנופה':'[[תנופה (חברת תחבורה)|תנופה]]',
    'בית שמש אקספרס':'[[בית שמש אקספרס]]','גי.בי. טורס':'[[גי.בי. טורס]]',
    'נסיעות ותיירות':'[[חברת הנסיעות והתיירות נצרת|נסיעות ותיירות]]',
    'מועצה אזורית גולן':'[[מועצה אזורית גולן]]','מועצה אזורית אילות':'[[מועצה אזורית חבל אילות|מועצה אזורית אילות]]'};
  const CITYFIX={'תל אביב יפו':'תל אביב-יפו','פתח תקוה':'פתח תקווה'};
  const isStop=d=>/מסוף|מרכזית|ת\.|תחנ|\//.test(d);
  const linkDests=l=>{
    const ds=l[2].filter(d=>d!==SEL&&!SEL.startsWith(d));
    if(!ds.length) return 'קו מעגלי';
    return ds.map(d=>isStop(d)?d:`[[${CITYFIX[d]||d}]]`).join(', ');
  };
  const hasPlat=s.lines.some(l=>l[3]);
  // מסלול מקוצר בסגנון הערכים: התחנה מודגשת ואז היעדים
  // מסלול: הרחובות המרכזיים שהקו עובר בהם, לפי הסדר — עד 6
  const cent=DATA.central||{};
  const mainStreets=l=>(l[5]||[]).filter(([st,ct])=>(cent[ct]||[]).includes(st)).map(([st])=>st).filter((x,i,arr)=>arr.indexOf(x)===i).slice(0,6);
  // סגנון הערך הקיים קובע (שלמה 18.09): ערך שמפרט רחובות מקבל מסלול מפורט, ערך עם מסלול קצר נשאר קצר.
  // הסריקה השבועית יודעת את זה מראש (detailed); בדיקה חיה מעדכנת.
  const a0=AUDIT&&AUDIT.stations&&AUDIT.stations[SEL];
  const detailed=WIKI&&WIKI.done?!!WIKI.detailed:!!(a0&&a0.detailed);
  const routeTxt=l=>{const d=linkDests(l);const ms=detailed?mainStreets(l):[];const mid=ms.length?` ← ${ms.join(' ← ')} ← `:' - ';return d==='קו מעגלי'?`'''${SEL}''' 🔄 קו מעגלי`:`'''${SEL}'''${mid}${d}`;};
  // עמודת נגישות: ♿ = כל נסיעות הקו נגישות לפי ה-GTFS, ♿ חלקי = חלק מהנסיעות (שלמה 18.09)
  const hasAcc=s.lines.some(l=>l[6]!=null);
  const accTxt=l=>l[6]===1?'♿':l[6]===2?'♿ חלקי':'—';
  const rows=s.lines.map(l=>`|-\n| ${l[0]} || ${OPLINK[l[1]]||l[1]} || ${routeTxt(l)}${hasPlat?` || ${l[3]||'—'}`:''}${hasAcc?` || ${accTxt(l)}`:''}`).join('\n');
  return `{| class="wikitable sortable"\n|+ קווי האוטובוס בתחנה (נכון ל-${fd(DATA.updated)}, לפי נתוני GTFS של משרד התחבורה)\n! קו !! מפעיל !! מסלול${hasPlat?' !! רציף':''}${hasAcc?' !! נגישות':''}\n${rows}\n|}`;
}

/* ── בדיקת הערך: קוראים את קוד המקור (wikitext) ומזהים קווים בטבלאות —
   ככה זה כתוב בערכי תחנות: טבלאות קו/מפעיל/מסלול/רציף ── */
function extractLines(wt){
  // מספרי קווים מתוך טבלאות בלבד, ורק מהתא הראשון של כל שורה — שם כתוב
  // מספר הקו בערכי תחנות. עמודות אחרות (רציף, מסלול) והטקסט החופשי לא נספרים.
  const found=new Set();
  let inTable=0, rowStart=false;
  const clean=c=>c.replace(/\{\{[^}]*\}\}|\[\[|\]\]|'''?|<[^>]*>/g,' ').trim();
  for(const raw of wt.split('\n')){
    const ln=raw.trim();
    if(ln.startsWith('{|')){inTable++;rowStart=true;continue;}
    if(ln.startsWith('|}')){if(inTable)inTable--;continue;}
    if(!inTable) continue;
    if(ln.startsWith('|-')){rowStart=true;continue;}
    if(ln.startsWith('|+')) continue;
    if(ln.startsWith('!')){rowStart=false;continue;}   // שורת כותרות
    if(ln.startsWith('|')&&rowStart){
      const cell=ln.replace(/^\|+/,'').split(/\|\|/)[0];
      // "9/9א" — זוג קווים באותו תא, מפוצל על לוכסן
      for(const part of clean(cell).split(/[\/\\]/)){
        const m=part.trim().match(/^(\d{1,3}[א-ת]?)$/);
        if(m) found.add(m[1]);
      }
      // תבנית קו בתא הראשון: {{...|370}}
      for(const t of cell.matchAll(/\{\{[^}]*?\|\s*(\d{1,3}[א-ת]?)\s*(?:\||\}\})/g)) found.add(t[1]);
      rowStart=false;
    }
  }
  return found;
}
async function checkWiki(){
  const s=DATA.stations[SEL];
  let title=$('#wtitle').value.trim();
  WBUSY=true;WIKI={title};render();
  try{
    const api='https://he.wikipedia.org/w/api.php?origin=*&format=json&';
    if(!title){
      // מחפשים ערך שבאמת נראה כמו תחנה — לא סתם התוצאה הראשונה
      const core=SEL.replace(/^(רחוב|שדרות|דרך|קניון|מרכז רפואי|בית חולים|מכללת|תחנת רכבת|אוניברסיטת)\s+/,'').replace(/\s*\(.*\)$/,'');
      const rel=t=>(s.kind||'station')==='station'?(['תחנה','מסוף','מרכזית'].some(w=>t.includes(w))||t.includes(s.city)):t.includes(core);
      for(const q of [SEL+' '+s.city,'התחנה המרכזית של '+s.city,'התחנה המרכזית '+s.city]){
        const r0=await (await fetch(api+'action=query&list=search&srlimit=5&srsearch='+encodeURIComponent(q))).json();
        const hit=(r0.query.search||[]).find(h=>rel(h.title));
        if(hit){title=hit.title;break;}
      }
      if(!title) throw new Error('לא נמצא ערך שנראה כמו תחנה — הקלידו את שם הערך המדויק');
    }
    const r=await (await fetch(api+'action=query&prop=revisions&rvprop=content&rvslots=main&redirects=1&titles='+encodeURIComponent(title))).json();
    const pg=Object.values(r.query.pages)[0];
    if(!pg||pg.missing!==undefined||!pg.revisions) throw new Error('הערך "'+title+'" לא נמצא בוויקיפדיה');
    const wt=pg.revisions[0].slots.main['*']||'';
    if(!wt) throw new Error('לא הצלחתי לקרוא את קוד הערך');
    const hasTable=wt.includes('{|');
    const inArticle=extractLines(wt);
    const realFull=new Set(s.lines.map(l=>l[0]));
    const correct=[...inArticle].filter(l=>realFull.has(l));
    const wrong=[...inArticle].filter(l=>!realFull.has(l)).sort((a,b)=>parseInt(a)-parseInt(b));
    const missing=[...realFull].filter(l=>!inArticle.has(l));
    const ops=[...new Set(s.lines.map(l=>l[1]))];
    const opsMissing=ops.filter(o=>!wt.includes(o.split(' ')[0]));
    const detailed=/←|→/.test(wt);
    WIKI={title:pg.title,done:true,hasTable,detailed,nInArticle:inArticle.size,correct,wrong,missing,opsMissing};
  }catch(e){WIKI={title,err:e.message};}
  WBUSY=false;render();
}

function chipList(arr,cls,empty){
  return arr.length?arr.map(x=>`<span class="chip ${cls}">${esc(x)}</span>`).join(''):`<span class="note">${empty}</span>`;
}
function wikiResult(){
  const w=WIKI;
  if(!w.hasTable||!w.nInArticle)
    return `<div class="stat">הערך שנבדק: <a href="https://he.wikipedia.org/wiki/${encodeURIComponent(w.title)}" target="_blank" rel="noopener">${esc(w.title)}</a></div>
    <div class="stat" style="color:var(--warn)">⚠ בערך הזה לא נמצאה טבלת קווים — אין מה להשוות. אפשר להשתמש בטבלה המוכנה שלמטה כדי להוסיף אחת.</div>`;
  return `<div class="stat">הערך שנבדק: <a href="https://he.wikipedia.org/wiki/${encodeURIComponent(w.title)}" target="_blank" rel="noopener">${esc(w.title)}</a> · זוהו ${w.nInArticle} קווים בטבלאות הערך</div>
  <div class="stat" style="color:var(--bad)">✗ כתובים בערך אבל לא עוצרים בתחנה כיום (${w.wrong.length}) — כנראה קו שבוטל, שונה או הועבר</div>
  <div>${chipList(w.wrong,'bad','כל הקווים שכתובים בערך נכונים ✓')}</div>
  <div class="stat" style="color:var(--ok)">✓ כתובים בערך וקיימים בתחנה (${w.correct.length})</div>
  <div>${chipList(w.correct,'ok','—')}</div>
  <div class="stat" style="color:var(--mut)">קווים בתחנה שלא מופיעים בערך (${w.missing.length}) — לא בהכרח טעות: הרבה ערכים מפרטים רק חלק מהקווים</div>
  <div>${chipList(w.missing,'warn','כל הקווים מופיעים בערך')}</div>
  ${w.opsMissing.length?`<div class="stat" style="color:var(--warn)">⚠ מפעילים שפועלים בתחנה ולא מוזכרים בערך: ${esc(w.opsMissing.join(', '))}</div>`:''}
  ${w.detailed?`<div class="stat" style="color:var(--mut)">בערך המסלולים מפורטים תחנה-תחנה (עם חיצים) — הטבלה המוכנה נותנת מסלול מקוצר (מוצא-יעד), כדאי לשמור על הפירוט הקיים בעריכה.</div>`:''}
  <p class="note">הזיהוי נעשה מתוך טבלאות הערך בלבד, ורק מעמודת הקו (התא הראשון בכל שורה, כולל זוגות כמו 9/9א) — מספרי רציפים, שנים וטקסט חופשי אינם נספרים. הנתונים כוללים את כל הקווים שעוצרים בתחנה לפי לוח הזמנים הרשמי — ובכל זאת כדאי לאמת לפני עריכה.</p>`;
}

function pick(k){SEL=k;WIKI=null;render();window.scrollTo({top:0});}
function render(){$('#view').innerHTML=SEL?stView():home();
  const q=$('#q');if(q)q.value=Q;}
document.addEventListener('input',e=>{if(e.target.id==='q'){Q=e.target.value;render();$('#q').focus();const v=$('#q');v.setSelectionRange(v.value.length,v.value.length);}});

Promise.all([
  fetch('data/stations.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json();}),
  fetch('data/audit.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null)
]).then(([d,a])=>{DATA=d;AUDIT=a;
  document.querySelector('.sub').insertAdjacentHTML('afterend','<input id="q" placeholder="חיפוש תחנה מרכזית או מסוף…">');
  render();})
.catch(()=>{$('#view').innerHTML='<div class="msg">עוד אין נתונים — הריצו את ה-workflow ‏wiki-stations ב-GitHub Actions.</div>';});
</script>
